import groovy.json.JsonSlurper
import groovy.json.JsonOutput
allprojects { afterEvaluate {
    loom.runs.configureEach { runDir=providers.gradleProperty('s53RunDir').getOrElse(file('../s53-impl-run').absolutePath) }
    tasks.named('runClientGameTest') { doFirst { args '--graphicsBackend','opengl' } }
    tasks.named('processGametestResources') { outputs.upToDateWhen { false }; doLast {
        def manifest=new File(destinationDir,'fabric.mod.json'); def meta=new JsonSlurper().parse(manifest)
        meta.entrypoints['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S53OriginalSelectionProof']
        meta.entrypoints['fabric-client-gametest'].add('io.github.r3neer.scalebrews.test.S51OriginalSelectionProof')
        meta.entrypoints['fabric-client-gametest'].add('io.github.r3neer.scalebrews.client.collision.preparation.S51AdversarialNativeProof')
        manifest.text=JsonOutput.prettyPrint(JsonOutput.toJson(meta))
    } }
} }
