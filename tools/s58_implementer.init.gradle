import groovy.json.JsonSlurper
import groovy.json.JsonOutput
allprojects { afterEvaluate {
    tasks.register('s58CommonClasspath') { doLast {
        def output=file(providers.gradleProperty('s58ClasspathFile').getOrElse('../s58-impl-classpath.txt'))
        output.parentFile.mkdirs(); output.text=sourceSets.main.runtimeClasspath.asPath
    } }
    loom.runs.configureEach { runDir=file(providers.gradleProperty('s58RunDir').getOrElse('../s58-impl-run')).absolutePath }
    tasks.named('runClientGameTest') { doFirst { args '--graphicsBackend','opengl' } }
    tasks.named('processGametestResources') { outputs.upToDateWhen {false}; doLast {
        def manifest=new File(destinationDir,'fabric.mod.json');def meta=new JsonSlurper().parse(manifest)
        meta.entrypoints['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S56OriginalLinearPoseProof','io.github.r3neer.scalebrews.test.S58OriginalCompoundPoseProof']
        manifest.text=JsonOutput.prettyPrint(JsonOutput.toJson(meta))
    } }
} }
