import groovy.json.JsonSlurper
import groovy.json.JsonOutput
allprojects { afterEvaluate {
 loom.runs.configureEach { runDir=file(providers.gradleProperty('s61RunDir').getOrElse('../s61-adversarial-run')).absolutePath }
 tasks.named('runClientGameTest') { doFirst { args '--graphicsBackend','opengl' } }
 tasks.register('s61CommonClasspath') { doLast { def o=file(providers.gradleProperty('s61ClasspathFile').getOrElse('../s61-adversarial-classpath.txt')); o.parentFile.mkdirs(); o.text=sourceSets.main.runtimeClasspath.asPath } }
 tasks.register('s61ClientClasspath') { doLast { def o=file(providers.gradleProperty('s61ClientClasspathFile').getOrElse('../s61-adversarial-client-classpath.txt')); o.parentFile.mkdirs(); o.text=sourceSets.client.runtimeClasspath.asPath } }
 tasks.named('processGametestResources') { outputs.upToDateWhen { false }; doLast { def f=new File(destinationDir,'fabric.mod.json'); def m=new JsonSlurper().parse(f); m.entrypoints['fabric-client-gametest']=['io.github.r3neer.scalebrews.client.collision.preparation.S61AdversarialLivingInputProof']; f.text=JsonOutput.prettyPrint(JsonOutput.toJson(m)) } }
} }
