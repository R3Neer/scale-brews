import groovy.json.JsonSlurper
import groovy.json.JsonOutput
allprojects {afterEvaluate {
loom.runs.configureEach {runDir=file(providers.gradleProperty('s57RunDir').getOrElse('../s57-adversarial-run')).absolutePath}
tasks.register('s57CommonClasspath') {doLast {def output=file(providers.gradleProperty('s57ClasspathFile').getOrElse('../s57-adversarial-classpath.txt'));output.parentFile.mkdirs();output.text=sourceSets.main.runtimeClasspath.asPath}}
tasks.named('processGametestResources') {outputs.upToDateWhen {false};doLast {def f=new File(destinationDir,'fabric.mod.json');def m=new JsonSlurper().parse(f);m.entrypoints['fabric-gametest']=['io.github.r3neer.scalebrews.collision.internal.S18PoseEngineAuthorityTests','io.github.r3neer.scalebrews.collision.internal.S18SourcePoseCatalogBoundaryTests','io.github.r3neer.scalebrews.collision.internal.S18PoseProgramOwnershipTests'];f.text=JsonOutput.prettyPrint(JsonOutput.toJson(m))}}
}}
