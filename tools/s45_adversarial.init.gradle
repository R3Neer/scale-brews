import groovy.json.JsonSlurper
import groovy.json.JsonOutput
allprojects { afterEvaluate {
 loom.runs.configureEach { runDir=providers.gradleProperty('s45AdversarialRunDir').getOrElse(file('../s45-adversary-public-run').absolutePath) }

 tasks.named('runClientGameTest') { doFirst { args '--graphicsBackend','opengl' } }
 tasks.named('processGametestResources') { outputs.upToDateWhen { false }; doLast {
  def manifest=new File(destinationDir,'fabric.mod.json');def meta=new JsonSlurper().parse(manifest)
  meta.entrypoints['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S45AdversarialSlotIdentityProof','io.github.r3neer.scalebrews.test.S45AdversarialIdentityProof','io.github.r3neer.scalebrews.test.S45AdversarialCensusProof','io.github.r3neer.scalebrews.test.S45AdversarialBoundsProof']
  manifest.text=JsonOutput.prettyPrint(JsonOutput.toJson(meta))
 } }
} }
