import groovy.json.JsonSlurper
import groovy.json.JsonOutput
allprojects { afterEvaluate {
    tasks.register('s61CommonClasspath') { doLast {
        def output=file(providers.gradleProperty('s61ClasspathFile').getOrElse('../s61-impl-classpath.txt'))
        output.parentFile.mkdirs(); output.text=sourceSets.main.runtimeClasspath.asPath
    } }
    loom.runs.configureEach { runDir=file(providers.gradleProperty('s61RunDir').getOrElse('../s61-impl-run')).absolutePath }
    tasks.named('runClientGameTest') { doFirst { args '--graphicsBackend','opengl' } }
    tasks.named('processGametestResources') { outputs.upToDateWhen {false}; doLast {
        def manifest=new File(destinationDir,'fabric.mod.json');def meta=new JsonSlurper().parse(manifest)
        meta.entrypoints['fabric-gametest']=['io.github.r3neer.scalebrews.collision.pose.S61LivingInputTests']
        meta.entrypoints['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S61OriginalLivingInputsProof']
        manifest.text=JsonOutput.prettyPrint(JsonOutput.toJson(meta))
    } }
} }
