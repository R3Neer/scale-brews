# Build and execute the real server/client regression suites for every push and PR.
name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: reject deprecated 26.2 GameTest player helper
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'makeMockServerPlayerInLevel' -- src/gametest; then
            echo '::error::Deprecated GameTestHelper.makeMockServerPlayerInLevel usage remains.'
            exit 1
          fi
      - name: build and run server GameTests
        run: ./gradlew build runGameTest --no-daemon --console=plain
      - name: run client GameTests
        run: xvfb-run -a ./gradlew runClientGameTest --no-daemon --console=plain
      - name: capture build artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            build/libs/
            build/run/*/logs/latest.log
            build/run/clientGameTest/screenshots/*.png
          if-no-files-found: warn
