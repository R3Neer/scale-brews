# Temporary S00 transport infrastructure (SPRINT_WORKFLOW section 13).
# Production candidates are immutable Git trees, not prematurely closed sprints.
name: build
on:
  push:
    branches: [chatgpt-editing]
permissions:
  contents: read
env:
  S00_TREE: 189d5f5e277c4688e2d33423f3863548f35591e9
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout transport revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: materialize exact candidate tree without a source commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/chatgpt-editing
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, urllib.request
          target = os.environ['S00_TREE']
          assert re.fullmatch('[0-9a-f]{40}', target)
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs)
          exists = subprocess.run(['git', 'cat-file', '-e', target + '^{tree}'], capture_output=True).returncode == 0
          if not exists:
              def get(suffix):
                  request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/' + suffix,
                      headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              tree = get('trees/' + target + '?recursive=1')
              assert not tree.get('truncated') and tree['sha'] == target
              entries = []
              for entry in tree['tree']:
                  if entry['type'] == 'tree':
                      continue
                  path = pathlib.PurePosixPath(entry['path'])
                  assert not path.is_absolute() and not any(part in ('..', '.git') for part in path.parts)
                  assert '\n' not in entry['path'] and '\t' not in entry['path']
                  assert entry['type'] == 'blob' and entry['mode'] in ('100644', '100755')
                  sha = entry['sha']
                  assert re.fullmatch('[0-9a-f]{40}', sha)
                  if subprocess.run(['git', 'cat-file', '-e', sha], capture_output=True).returncode:
                      blob = get('blobs/' + sha)
                      assert blob['encoding'] == 'base64'
                      data = base64.b64decode(blob['content'])
                      assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
                      assert git('hash-object', '-w', '--stdin', input=data).decode().strip() == sha
                  entries.append(f"{entry['mode']} blob {sha}\t{entry['path']}\n")
              env = dict(os.environ, GIT_INDEX_FILE=os.path.join(os.environ['RUNNER_TEMP'], 's00-candidate.index'))
              git('read-tree', '--empty', env=env)
              git('update-index', '--index-info', input=''.join(entries).encode(), env=env)
              assert git('write-tree', env=env).decode().strip() == target
          git('read-tree', '--reset', '-u', target)
          assert git('write-tree').decode().strip() == target
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 's00-evidence'
          evidence.mkdir()
          (evidence / 'identity.txt').write_text('source_tree=' + target + '\ntransport_commit=' + os.environ['GITHUB_SHA'] + '\n')
          git('archive', '--format=tar', '--output=' + str(evidence / 'source.tar'), target)
          print('S00_SOURCE_TREE=' + target)
          print('S00_TRANSPORT_COMMIT=' + os.environ['GITHUB_SHA'])
          PY
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: record environment
        run: |
          java -version 2> "$RUNNER_TEMP/s00-evidence/java.txt"
          chmod +x ./gradlew
      - name: build and required server GameTests
        run: |
          set -o pipefail
          ./gradlew build --console=plain --rerun-tasks "-PscalebrewsGameTestReport=$RUNNER_TEMP/s00-evidence/server.xml" 2>&1 | tee "$RUNNER_TEMP/s00-evidence/build.log"
      - name: real client and integrated server GameTests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          xvfb-run -a ./gradlew runClientGameTest --console=plain --rerun-tasks "-PscalebrewsGameTestReport=$RUNNER_TEMP/s00-evidence/client-server.xml" 2>&1 | tee "$RUNNER_TEMP/s00-evidence/client.log"
      - name: preserve evidence even for a rejected candidate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S00-${{ github.run_id }}
          path: ${{ runner.temp }}/s00-evidence/
          if-no-files-found: error
