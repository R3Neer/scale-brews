# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: apply verified collision package refactor
        if: >-
          github.ref == 'refs/heads/chatgpt-editing' &&
          github.event_name == 'push' &&
          github.event.head_commit.message == 'chore: execute collision package refactor'
        run: |
          python tools/RefactorCollisionPackages.py
          ./gradlew clean build
          git diff --check
          git show HEAD^:.github/workflows/build.yml > .github/workflows/build.yml
          rm tools/RefactorCollisionPackages.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Package refactor produced no changes"
            exit 1
          fi
          git commit -m "refactor: organize entity collision packages"
          git push origin HEAD:chatgpt-editing
