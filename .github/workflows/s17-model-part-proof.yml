name: s17-model-part-proof

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s17-model-part-proof.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/api/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/BuiltInGeometryEngines.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/**'
      - 'src/client/java/io/github/r3neer/scalebrews/client/ScaleBrewsClient.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S17ModelPartGeometryEngineTests.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S17ModelPartGeometryEngineClientTests.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S17OriginalModelStructuralParityClientTests.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/AnatomyExportProof.java'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  common-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S17 server tests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=['io.github.r3neer.scalebrews.collision.internal.S17ModelPartGeometryEngineTests']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run common boundary
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s17-server-junit.xml"
      - name: capture server evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S17-model-part-server-proof
          path: |
            build/s17-server-junit.xml
            build/run/gameTest/logs/

  client-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S17 client tests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-client-gametest']=[
            'io.github.r3neer.scalebrews.test.S17ModelPartGeometryEngineClientTests',
            'io.github.r3neer.scalebrews.test.S17OriginalModelStructuralParityClientTests'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run real client preparation proof
        run: xvfb-run -a ./gradlew runClientGameTest --console=plain
      - name: capture client evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S17-model-part-client-proof
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/s17-retro-snapshots/
            build/resources/gametest/fabric.mod.json

  original-model-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate original model export proof
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.AnatomyExportProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: align legacy family oracle with canonical source ids
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/gametest/java/io/github/r3neer/scalebrews/test/AnatomyExportProof.java')
          text=p.read_text()
          old='''        var geometry=GeometryExtractor.vanilla("proof:"+label.substring(0,label.indexOf(' ')),"26.2",root,excluded);'''
          new='''        String family=label.substring(0,label.indexOf(' '));
          String source=switch(family) {
              case "chicken" -> "minecraft:chicken";
              case "llama" -> "minecraft:llama";
              case "villager" -> "minecraft:villager";
              case "iron_golem" -> "minecraft:iron_golem";
              case "ghast" -> "minecraft:ghast";
              case "feline" -> "minecraft:cat";
              case "equine" -> "minecraft:horse";
              case "bee" -> "minecraft:bee";
              default -> throw new AssertionError("Unmapped legacy vanilla family source: "+family);
          };
          var geometry=GeometryExtractor.vanilla(source,"26.2",root,excluded);'''
          if text.count(old) != 1:
              raise SystemExit('S17 legacy family source oracle drifted; refusing non-causal rewrite')
          p.write_text(text.replace(old,new))
          print('Aligned S17 legacy family pose oracle with canonical S18 source ids')
          PY
      - name: run original model and renderer proof
        run: xvfb-run -a ./gradlew runClientGameTest --console=plain
      - name: capture original model evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S17-original-model-export-proof
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/anatomy-export/
            build/resources/gametest/fabric.mod.json
