name: s19-field-hiding-probe

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s19-field-hiding-probe.yml'
  workflow_dispatch:

jobs:
  inspect-field-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: resolve exact locked Alex jar
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/s19-field-hiding"
          mkdir -p "$probe"
          python3 - "$probe" <<'PY'
          import json, pathlib, sys
          probe = pathlib.Path(sys.argv[1])
          lock = json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          alex = next(item for item in lock['inputs'] if item['modId'] == 'alexsmobs')
          (probe / 'settings.gradle').write_text("rootProject.name = 's19-field-hiding'\n")
          (probe / 'build.gradle').write_text(f"""repositories {{ maven {{ url = 'https://cursemaven.com/'; content {{ includeGroup 'curse.maven' }} }} }}
          configurations {{ proofInput {{ canBeConsumed = false; canBeResolved = true; transitive = false }} }}
          dependencies {{ proofInput '{alex['coordinate']}' }}
          tasks.register('copyProofInput', Copy) {{ from configurations.proofInput; into layout.buildDirectory.dir('proof-input') }}
          """)
          pathlib.Path('build').mkdir(exist_ok=True)
          pathlib.Path('build/s19-field-hiding-expected.txt').write_text(alex['sha256'] + '\n')
          PY
          ./gradlew -p "$probe" copyProofInput --console=plain
          jar="$(find "$probe/build/proof-input" -name '*.jar' -type f -print -quit)"
          test -n "$jar"
          test "$(sha256sum "$jar" | awk '{print $1}')" = "$(cat build/s19-field-hiding-expected.txt)"
          cp "$jar" build/s19-field-hiding-alex.jar
      - name: inspect bytecode field owners
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/s19-field-hiding-probe
          javap -classpath build/s19-field-hiding-alex.jar -p -c \
            com.github.alexthe666.alexsmobs.citadel.client.model.AdvancedModelBox \
            > build/s19-field-hiding-probe/advanced-model-box-javap.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('build/s19-field-hiding-probe/advanced-model-box-javap.txt').read_text().splitlines()
          needles = ('cubeList:', 'childModels:', 'Method addChild', 'Method addBox', 'Field cubeList', 'Field childModels')
          out=[]
          for i,line in enumerate(text):
              if any(n in line for n in needles):
                  lo=max(0,i-8); hi=min(len(text),i+9)
                  out.append('\n'.join(text[lo:hi]))
          evidence='\n\n--- context ---\n'.join(out)
          Path('build/s19-field-hiding-probe/field-context.txt').write_text(evidence+'\n')
          print(evidence)
          PY
      - name: capture field ownership evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S19-field-hiding-probe
          path: build/s19-field-hiding-probe/
