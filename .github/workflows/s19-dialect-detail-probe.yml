name: s19-dialect-detail-probe

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s19-dialect-detail-probe.yml'
  workflow_dispatch:

jobs:
  inspect-exact-dialect-details:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: inspect pinned Alex 2.1.9 bytecode
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/s19-dialect-detail"
          mkdir -p "$probe"
          cat > "$probe/settings.gradle" <<'EOF'
          rootProject.name = 's19-dialect-detail'
          EOF
          cat > "$probe/build.gradle" <<'EOF'
          repositories { maven { url = 'https://cursemaven.com/'; content { includeGroup 'curse.maven' } } }
          configurations { probe { canBeConsumed = false; canBeResolved = true; transitive = false } }
          dependencies { probe 'curse.maven:alexs-mobs-continued-1635121:8772801' }
          tasks.register('copyProbe', Copy) { from configurations.probe; into layout.buildDirectory.dir('probe') }
          EOF
          ./gradlew -p "$probe" copyProbe --console=plain
          jar="$(find "$probe/build/probe" -name '*.jar' -print -quit)"
          test "$(sha256sum "$jar" | awk '{print $1}')" = 'b810e1b7ac925f1f1ba6a2a87e742e30b33fafad4d164ff64192f21f46f6154c'
          mkdir -p build/s19-dialect-detail
          {
            for cls in \
              'com.github.alexthe666.alexsmobs.citadel.client.model.basic.BasicModelPart$ModelBox' \
              'com.github.alexthe666.alexsmobs.citadel.client.model.basic.BasicModelPart$TexturedQuad' \
              'com.github.alexthe666.alexsmobs.citadel.client.model.basic.BasicModelPart$PositionTextureVertex'; do
              echo "=== javap -private $cls ==="
              javap -private -classpath "$jar" "$cls"
              echo
            done
            echo '=== ModelGazelle constructor bytecode around addBox ==='
            javap -c -p -classpath "$jar" com.github.alexthe666.alexsmobs.client.model.ModelGazelle
          } | tee build/s19-dialect-detail/details.txt
      - name: capture detail evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S19-dialect-detail-probe
          path: build/s19-dialect-detail/details.txt
