name: s21-adversarial-root-rebind-lifecycle

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s21-adversarial-root-rebind-lifecycle.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/api/CollisionEngines.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/api/spi/RootTransformProvider.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyBindingState.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/GeometryProvider.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/ModelGeometryProvider.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/WorldAnatomyCatalog.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S21AdversarialRootRebindLifecycleTests.java'
  workflow_dispatch:

jobs:
  root-rebind-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S21 root rebind lifecycle holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S21AdversarialRootRebindLifecycleTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run S21 root rebind lifecycle holdout
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s21-adversarial-root-rebind-lifecycle-junit.xml"
      - name: capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S21-adversarial-root-rebind-lifecycle
          path: |
            build/s21-adversarial-root-rebind-lifecycle-junit.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json

  mutation-kill:
    needs: root-rebind-lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S21 root rebind lifecycle holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S21AdversarialRootRebindLifecycleTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: retain obsolete active binding across reset
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java')
          s=p.read_text()
          needle='state.entities.clear();state.sent.clear();state.contacts.clear();state.trackingGenerations.clear();AnatomyTransportReceipts.clear(server);'
          replacement='state.sent.clear();state.contacts.clear();state.trackingGenerations.clear();AnatomyTransportReceipts.clear(server);'
          count=s.count(needle)
          if count!=1:
              raise SystemExit(f'rebind lifecycle mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(needle,replacement,1))
          PY
          git diff -- src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java | tee build/s21-root-rebind-lifecycle-mutant.diff
      - name: mutant must compile
        run: ./gradlew compileJava compileGametestJava --console=plain
      - name: lifecycle holdout must kill retained-active mutant
        shell: bash
        run: |
          set +e
          ./gradlew runGameTest --console=plain --rerun-tasks -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s21-root-rebind-lifecycle-mutant.xml" \
            > "$GITHUB_WORKSPACE/build/s21-root-rebind-lifecycle-mutant.log" 2>&1
          code=$?
          set -e
          cat "$GITHUB_WORKSPACE/build/s21-root-rebind-lifecycle-mutant.log"
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: retaining State.entities across reset escaped the lifecycle holdout'
            exit 1
          fi
          echo 'KILLED: retaining State.entities across reset violates the lifecycle holdout'
      - name: capture mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S21-root-rebind-lifecycle-mutant
          path: |
            build/s21-root-rebind-lifecycle-mutant.xml
            build/s21-root-rebind-lifecycle-mutant.log
            build/s21-root-rebind-lifecycle-mutant.diff
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json
