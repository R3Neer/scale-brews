name: s21-adversarial-external-root-teleport

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s21-adversarial-external-root-teleport.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/mixin/PlatformEntityMixin.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/MaterialIntervalRuntime.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/MaterialIntervalTracker.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/ModelGeometryProvider.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S21AdversarialExternalRootTeleportTests.java'
  workflow_dispatch:

jobs:
  external-root-teleport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S21 external root teleport holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S21AdversarialExternalRootTeleportTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run S21 external root teleport holdout
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s21-adversarial-external-root-teleport-junit.xml"
      - name: capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S21-adversarial-external-root-teleport
          path: |
            build/s21-adversarial-external-root-teleport-junit.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json

  mutation-kill:
    needs: external-root-teleport
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S21 external root teleport holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S21AdversarialExternalRootTeleportTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: remove only the teleport interval fence
        shell: bash
        run: |
          mkdir -p build
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/mixin/PlatformEntityMixin.java')
          s=p.read_text()
          needle='''    @Inject(method="teleportTo(DDD)V",at=@At("HEAD"))
              private void scalebrews$teleport(double x,double y,double z,CallbackInfo ci) {
                  scalebrews$platform.clear();
                  if((Object)this instanceof LivingEntity living){AnatomyMovement.invalidateRoot(living);MaterialIntervalRuntime.invalidate(living);}
              }'''
          replacement='''    @Inject(method="teleportTo(DDD)V",at=@At("HEAD"))
              private void scalebrews$teleport(double x,double y,double z,CallbackInfo ci) {
                  scalebrews$platform.clear();
                  if((Object)this instanceof LivingEntity living){AnatomyMovement.invalidateRoot(living);}
              }'''
          count=s.count(needle)
          if count!=1:
              raise SystemExit(f'teleport lifecycle mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(needle,replacement,1))
          PY
          git diff -- src/main/java/io/github/r3neer/scalebrews/mixin/PlatformEntityMixin.java | tee build/s21-external-root-teleport-mutant.diff
      - name: mutant must compile
        run: ./gradlew compileJava compileGametestJava --console=plain
      - name: teleport holdout must kill missing interval fence
        shell: bash
        run: |
          set +e
          ./gradlew runGameTest --console=plain --rerun-tasks -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s21-external-root-teleport-mutant.xml" \
            > "$GITHUB_WORKSPACE/build/s21-external-root-teleport-mutant.log" 2>&1
          code=$?
          set -e
          cat "$GITHUB_WORKSPACE/build/s21-external-root-teleport-mutant.log"
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: removing the teleport interval fence escaped the external-root discontinuity holdout'
            exit 1
          fi
          echo 'KILLED: removing the teleport interval fence violates the external-root discontinuity holdout'
      - name: capture mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S21-external-root-teleport-mutant
          path: |
            build/s21-external-root-teleport-mutant.xml
            build/s21-external-root-teleport-mutant.log
            build/s21-external-root-teleport-mutant.diff
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json
