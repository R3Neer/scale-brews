name: s19-child-order-determinism-proof

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s19-child-order-determinism-proof.yml'
      - 'tools/s19-external-inputs.lock.json'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryExtractor.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryEngine.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S19ChildOrderDeterminismClientProof.java'
  workflow_dispatch:

jobs:
  child-order-determinism:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew

      - name: resolve pinned S19 external inputs
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/s19-child-order-inputs"
          mkdir -p "$probe"
          python3 - "$probe" <<'PY'
          import json, pathlib, sys
          probe=pathlib.Path(sys.argv[1])
          lock=json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          if lock.get('schema') != 1 or lock.get('minecraft') != '26.2': raise SystemExit('Unexpected S19 external input lock')
          inputs=lock.get('inputs')
          if not isinstance(inputs,list) or sorted(item.get('modId') for item in inputs) != ['alexsmobs','cloth-config','codxlib']:
              raise SystemExit('Unexpected S19 external input set')
          deps='\n'.join(f"    proofInputs '{item['coordinate']}'" for item in inputs)
          (probe/'settings.gradle').write_text("rootProject.name = 's19-child-order-inputs'\n")
          (probe/'build.gradle').write_text(f"""repositories {{
              maven {{ url = 'https://cursemaven.com/'; content {{ includeGroup 'curse.maven' }} }}
          }}
          configurations {{ proofInputs {{ canBeConsumed = false; canBeResolved = true; transitive = false }} }}
          dependencies {{
          {deps}
          }}
          tasks.register('copyProofInputs', Copy) {{ from configurations.proofInputs; into layout.buildDirectory.dir('proof-inputs') }}
          """)
          PY
          ./gradlew -p "$probe" copyProofInputs --console=plain
          mkdir -p build/s19-child-order/mods
          cp "$probe"/build/proof-inputs/*.jar build/s19-child-order/mods/
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          lock=json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text()); mods=pathlib.Path('build/s19-child-order/mods')
          for item in lock['inputs']:
              _,artifact,version=item['coordinate'].split(':'); jar=mods/f'{artifact}-{version}.jar'
              if not jar.is_file(): raise SystemExit(f'Missing pinned proof jar {jar.name}')
              actual=hashlib.sha256(jar.read_bytes()).hexdigest()
              if actual != item['sha256']: raise SystemExit(f'Pinned input hash mismatch for {jar.name}: {actual}')
              with zipfile.ZipFile(jar) as archive: metadata=json.loads(archive.read('fabric.mod.json'))
              if metadata.get('id') != item['modId'] or str(metadata.get('version')) != item['version']:
                  raise SystemExit(f'Pinned input identity mismatch for {jar.name}')
          PY

      - name: isolate child-order proof
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json'); data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S19ChildOrderDeterminismClientProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

      - name: require sibling-order-independent preparation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/s19-child-order
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-child-order/mods" \
            2>&1 | tee build/s19-child-order/normal.log
          mkdir -p build/s19-child-order/logs-normal
          cp -r build/run/clientGameTest/logs/. build/s19-child-order/logs-normal/ || true

      - name: capture child-order evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S19-child-order-determinism-proof
          path: |
            build/s19-child-order/*.log
            build/s19-child-order/logs-normal/
            build/resources/gametest/fabric.mod.json
            tools/s19-external-inputs.lock.json
