name: s08-anchor-wiring

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s08-anchor-wiring.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
          fetch-depth: 0
      - name: apply source patch
        shell: bash
        run: |
          python tools/s08_patch.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/github/r3neer/scalebrews/collision/internal/MaterialPhysicsRuntime.java
          git add src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java
          git commit -m 'feat(s08): wire certified anchored transport'
          git push origin HEAD:chatgpt-editing
