name: s20-citadel-pose-real-proof

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s20-citadel-pose-real-proof.yml'
      - 'tools/s19-external-inputs.lock.json'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/api/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/pose/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/geometry/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/BuiltInGeometryEngines.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/**'
      - 'src/main/resources/data/alexsmobs/scalebrews/citadel_pose_programs/**'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S20CitadelPoseClientProof.java'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  pinned-real-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew

      - name: resolve only locked external proof inputs
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/s20-external-inputs"
          mkdir -p "$probe"
          python3 - "$probe" <<'PY'
          import json, pathlib, sys
          probe = pathlib.Path(sys.argv[1])
          lock = json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          if lock.get('schema') != 1 or lock.get('minecraft') != '26.2':
              raise SystemExit('Unsupported S20 external input lock schema or Minecraft version')
          inputs = lock.get('inputs')
          if not isinstance(inputs, list) or sorted(x.get('modId') for x in inputs) != ['alexsmobs','cloth-config','codxlib']:
              raise SystemExit('S20 requires the exact S19 Alex/Codx/Cloth proof input set')
          deps = '\n'.join(f"    proofInputs '{item['coordinate']}'" for item in inputs)
          (probe / 'settings.gradle').write_text("rootProject.name='s20-external-inputs'\n")
          (probe / 'build.gradle').write_text(f"""repositories {{
              maven {{ url='https://cursemaven.com/'; content {{ includeGroup 'curse.maven' }} }}
          }}
          configurations {{ proofInputs {{ canBeConsumed=false; canBeResolved=true; transitive=false }} }}
          dependencies {{
          {deps}
          }}
          tasks.register('copyProofInputs', Copy) {{
              from configurations.proofInputs
              into layout.buildDirectory.dir('proof-inputs')
          }}
          """)
          PY
          ./gradlew -p "$probe" copyProofInputs --console=plain
          mkdir -p build/s20-external-inputs/mods
          cp "$probe"/build/proof-inputs/*.jar build/s20-external-inputs/mods/

      - name: verify pinned hashes and external identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          lock=json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          mods=pathlib.Path('build/s20-external-inputs/mods')
          lines=[]
          for item in lock['inputs']:
              group,artifact,version=item['coordinate'].split(':')
              jar=mods/f'{artifact}-{version}.jar'
              if not jar.is_file(): raise SystemExit(f'Missing pinned S20 input {jar.name}')
              sha=hashlib.sha256(jar.read_bytes()).hexdigest()
              if sha != item['sha256']: raise SystemExit(f'SHA-256 mismatch for {jar.name}')
              with zipfile.ZipFile(jar) as z: metadata=json.loads(z.read('fabric.mod.json'))
              if metadata.get('id') != item['modId'] or str(metadata.get('version')) != item['version']:
                  raise SystemExit(f'Identity/version mismatch for {jar.name}')
              lines.append(f"{jar.name}\t{item['modId']}\t{item['version']}\t{sha}")
          if len(list(mods.glob('*.jar'))) != len(lock['inputs']): raise SystemExit('Unpinned extra S20 proof jar')
          manifest=pathlib.Path('build/s20-external-inputs/manifest.txt')
          manifest.write_text('\n'.join(lines)+'\n')
          print(manifest.read_text(),end='')
          PY

      - name: keep external family optional in ordinary mod metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          data=json.loads(pathlib.Path('src/main/resources/fabric.mod.json').read_text())
          leaked=set((data.get('depends') or {}).keys()) & {'alexsmobs','codxlib','cloth-config'}
          if leaked: raise SystemExit('S20 made external proof mods mandatory: '+', '.join(sorted(leaked)))
          PY

      - name: isolate S20 pinned client oracle
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S20CitadelPoseClientProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

      - name: compare shared engine with original Grizzly and Gazelle setupAnim
        shell: bash
        run: xvfb-run -a ./gradlew runClientGameTest --console=plain -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s20-external-inputs/mods"

      - name: capture S20 real-model evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S20-citadel-pose-real-model-proof
          path: |
            tools/s19-external-inputs.lock.json
            build/s20-external-inputs/manifest.txt
            build/run/clientGameTest/logs/
            build/resources/gametest/fabric.mod.json
