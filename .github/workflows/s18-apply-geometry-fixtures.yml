name: s18-apply-geometry-fixtures

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s18-apply-geometry-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: apply exact remaining fixture migration
        run: python3 .github/scripts/s18_fix_remaining_geometry_fixtures.py
      - name: verify gametest compilation
        run: ./gradlew compileGametestJava --console=plain
      - name: commit migration and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/s18_fix_remaining_geometry_fixtures.py .github/workflows/s18-apply-geometry-fixtures.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gametest/java/io/github/r3neer/scalebrews/test/AnatomyGeometryTests.java
          git commit -m 'test(s18): migrate remaining geometry pose fixtures'
          git push origin HEAD:chatgpt-editing
