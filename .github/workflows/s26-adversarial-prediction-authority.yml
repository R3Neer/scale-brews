name: s26-adversarial-prediction-authority

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s26-adversarial-prediction-authority.yml'
      - 'tools/s26_prediction_authority_gate.py'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java'
      - 'src/main/java/io/github/r3neer/scalebrews/platform/PlatformPhysics.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S00ObserverBoundaryTests.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S26ControlHandoffClientProof.java'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  remote-observer-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate real-client observer authority proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=[
            'io.github.r3neer.scalebrews.test.S00ObserverBoundaryTests'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: verify structural prediction authority boundary
        run: python3 tools/s26_prediction_authority_gate.py
      - name: run remote observer authority baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/s26-prediction-authority
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            2>&1 | tee build/s26-prediction-authority/client.log
          grep -R -F 'S00_OBSERVER_AUTHORITY PASS' \
            build/run/clientGameTest/logs build/s26-prediction-authority/client.log >/dev/null
      - name: capture prediction authority evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S26-prediction-authority
          path: |
            build/s26-prediction-authority/client.log
            build/run/clientGameTest/logs/
            build/resources/gametest/fabric.mod.json

  simulate-all-mutant-must-die:
    needs: remote-observer-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate real-client observer authority proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S00ObserverBoundaryTests']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: let every client replica simulate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java')
          s=p.read_text()
          old='public static boolean simulates(Entity body){return !body.level().isClientSide() || body.isLocalInstanceAuthoritative();}'
          new='public static boolean simulates(Entity body){return true;}'
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileClientJava compileGametestJava --console=plain
      - name: remote-body holdout must kill simulate-all mutant
        shell: bash
        run: |
          set +e
          xvfb-run -a ./gradlew runClientGameTest --no-daemon --console=plain --rerun-tasks
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: remote client replicas gained full anatomy carry prediction'
            exit 1
          fi
          echo 'KILLED: simulate-all client authority mutant'

  tick-loop-guard-mutant-must-die:
    needs: remote-observer-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: remove local-authority guard from ordinary client carry loop
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java')
          s=p.read_text()
          old='if(entity.isLocalInstanceAuthoritative() && AnatomyMovement.contact(entity)!=null)AnatomyMovement.carry(entity);'
          new='if(AnatomyMovement.contact(entity)!=null)AnatomyMovement.carry(entity);'
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileClientJava --console=plain
      - name: structural gate must kill unguarded client loop
        shell: bash
        run: |
          set +e
          python3 tools/s26_prediction_authority_gate.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: ordinary client loop can carry remote observers'
            exit 1
          fi
          echo 'KILLED: unguarded ordinary client carry loop'

  control-handoff-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S26 control handoff proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=[
            'io.github.r3neer.scalebrews.test.S26ControlHandoffClientProof'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run player-vehicle control handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/s26-control-handoff
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            2>&1 | tee build/s26-control-handoff/client.log
          grep -R -F 'S26_CONTROL_HANDOFF PASS' \
            build/run/clientGameTest/logs build/s26-control-handoff/client.log >/dev/null
      - name: capture control handoff evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S26-control-handoff
          path: |
            build/s26-control-handoff/client.log
            build/run/clientGameTest/logs/
            build/resources/gametest/fabric.mod.json

  stale-vehicle-authority-mutant-must-die:
    needs: control-handoff-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S26 control handoff proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=[
            'io.github.r3neer.scalebrews.test.S26ControlHandoffClientProof'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: let every client boat retain prediction authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java')
          s=p.read_text()
          old='public static boolean simulates(Entity body){return !body.level().isClientSide() || body.isLocalInstanceAuthoritative();}'
          new='public static boolean simulates(Entity body){return !body.level().isClientSide() || body.isLocalInstanceAuthoritative() || body instanceof net.minecraft.world.entity.vehicle.boat.Boat;}'
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileClientJava compileGametestJava --console=plain
      - name: control handoff must kill stale-vehicle authority
        shell: bash
        run: |
          set +e
          xvfb-run -a ./gradlew runClientGameTest --no-daemon --console=plain --rerun-tasks
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: an uncontrolled client boat retained prediction authority after handoff'
            exit 1
          fi
          echo 'KILLED: stale vehicle prediction authority across control handoff'

  reference-local-authority-mutant-must-die:
    needs: remote-observer-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: remove local-authority guard from movement-reference sender
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java')
          s=p.read_text()
          old='''        if(body==null || player==null || refreshPredictionOwner(client)!=body || !ready(body) || !body.isLocalInstanceAuthoritative()
                || !ClientPlayNetworking.canSend(AnatomyMoveReferenceV2Payload.TYPE))return;
        boolean vehicle=body!=player;
        if(!vehicle && player.getRootVehicle()!=player)return;
        if(vehicle && (player.getRootVehicle()!=body || body.getControllingPassenger()!=player))return;'''
          new='''        if(body==null || player==null || !ready(body)
                || !ClientPlayNetworking.canSend(AnatomyMoveReferenceV2Payload.TYPE))return;
        boolean vehicle=body!=player;'''
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileClientJava --console=plain
      - name: structural gate must kill ungated reference sender
        shell: bash
        run: |
          set +e
          python3 tools/s26_prediction_authority_gate.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: non-local body may emit anatomy prediction references'
            exit 1
          fi
          echo 'KILLED: movement-reference sender without local authority'

  duplicate-root-actor-mutant-must-die:
    needs: control-handoff-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S26 control handoff proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=[
            'io.github.r3neer.scalebrews.test.S26ControlHandoffClientProof'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: let local player and its controlled root both own full prediction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java')
          s=p.read_text()
          old='return simulates(body) && (!body.level().isClientSide() || body.getRootVehicle()==body);'
          new='return simulates(body);'
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileClientJava compileGametestJava --console=plain
      - name: control handoff must kill duplicate root actor
        shell: bash
        run: |
          set +e
          xvfb-run -a ./gradlew runClientGameTest --no-daemon --console=plain --rerun-tasks
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: mounted LocalPlayer and controlled root both retained full prediction'
            exit 1
          fi
          echo 'KILLED: duplicate full-prediction root actor'

  bridge-root-owner-mutant-must-die:
    needs: remote-observer-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: weaken one anatomy bridge decision back to local-replica authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/platform/PlatformPhysics.java')
          s=p.read_text()
          old='return AnatomyApi.ready(e) && AnatomyMovement.predictsBody(e)'
          new='return AnatomyApi.ready(e) && AnatomyMovement.simulates(e)'
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava --console=plain
      - name: structural gate must kill weakened bridge owner
        shell: bash
        run: |
          set +e
          python3 tools/s26_prediction_authority_gate.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: PlatformPhysics accepted a non-root local replica for full anatomy physics'
            exit 1
          fi
          echo 'KILLED: bridge physics without unique-root prediction ownership'

  stale-metadata-handoff-mutant-must-die:
    needs: control-handoff-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S26 control handoff proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=[
            'io.github.r3neer.scalebrews.test.S26ControlHandoffClientProof'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: preserve previous-owner prediction metadata across handoff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java')
          s=p.read_text()
          old='''            if(predictionOwner!=null) {
                predictedMovementReferences.remove(predictionOwner);
                transportReceiptTokens.discardBody(predictionOwner);
            }'''
          new='''            if(predictionOwner!=null) {
                predictedMovementReferences.get(predictionOwner);
                transportReceiptTokens.discardBody(null);
            }'''
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileClientJava compileGametestJava --console=plain
      - name: control handoff must kill retained prediction metadata
        shell: bash
        run: |
          set +e
          xvfb-run -a ./gradlew runClientGameTest --no-daemon --console=plain --rerun-tasks
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: prior root retained staged reference/token metadata after control handoff'
            exit 1
          fi
          echo 'KILLED: stale prediction metadata across control handoff'
