name: s24-adversarial-runtime-player-iteration

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s24-adversarial-runtime-player-iteration.yml'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S24AdversarialRuntimePlayerIterationTests.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java'
  workflow_dispatch:

jobs:
  player-iteration-barrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate runtime player iteration holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=['io.github.r3neer.scalebrews.collision.internal.S24AdversarialRuntimePlayerIterationTests']
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run runtime player iteration holdout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/s24-player-iteration
          ./gradlew runGameTest --no-daemon --console=plain \
            2>&1 | tee build/s24-player-iteration/server.log
      - name: capture player iteration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S24-adversarial-runtime-player-iteration
          path: |
            build/s24-player-iteration/server.log
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json
