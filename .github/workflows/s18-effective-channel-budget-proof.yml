name: s18-effective-channel-budget-proof

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s18-effective-channel-budget-proof.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/api/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/geometry/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/pose/**'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S18EffectiveChannelBudgetTests.java'
  workflow_dispatch:

jobs:
  common-effective-channel-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate effective-channel budget holdout
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S18EffectiveChannelBudgetTests'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run effective-channel budget holdout
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s18-channel-budget-junit.xml"
      - name: capture effective-channel budget evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S18-effective-channel-budget-proof
          path: |
            build/s18-channel-budget-junit.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json
