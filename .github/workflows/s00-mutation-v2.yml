# Temporary S00 mutation revalidation. Proves exact mutated trees; never updates refs.
name: s00-mutation-v2
on:
  push:
    branches: [chatgpt-editing]
permissions:
  contents: read
jobs:
  server-mutation-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mutation:
          - dispatcher-reentry
          - dispatcher-abort-clear
          - sat-axis-cutoff
          - sat-subnormal-reciprocal
          - bodypath-certificate
          - bodypath-interior-certificate
          - plane-precopy-cap
          - tiny-rotation-bound
          - receipt-current-tick
          - receipt-surface
          - frame-binding-generation
          - model-unknown-joint
          - runtime-thread-owner
          - endpoint-same-serial
          - first-capture-quarantine
          - registration-lifecycle-watermark
          - dispatcher-joint-orphan
          - catalog-authority-revision
          - model-degenerate-piece
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: retain reviewed mutation tools outside candidate source
        run: |
          cp .github/s00-mutate.py "$RUNNER_TEMP/s00-mutate-old.py"
          cp .github/s00-mutate-v2.py "$RUNNER_TEMP/s00-mutate-v2.py"
      - name: materialize exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/s00-build.py
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: gradle
      - name: apply mutation and seal exact mutated tree
        env:
          S00_OLD_MUTATOR: ${{ runner.temp }}/s00-mutate-old.py
        run: |
          chmod +x ./gradlew
          python3 "$RUNNER_TEMP/s00-mutate-v2.py" apply "${{ matrix.mutation }}"
      - name: mutation must compile
        run: |
          set -o pipefail
          ./gradlew compileGametestJava --console=plain 2>&1 | tee "$RUNNER_TEMP/s00-mutation/compile.log"
      - name: exact server assertion must kill mutation
        shell: bash
        env:
          S00_OLD_MUTATOR: ${{ runner.temp }}/s00-mutate-old.py
        run: |
          set +e
          ./gradlew runGameTest --console=plain --rerun-tasks "-PscalebrewsGameTestReport=$RUNNER_TEMP/s00-mutation/server.xml" > "$RUNNER_TEMP/s00-mutation/run.log" 2>&1
          code=$?
          set -e
          tail -n 60 "$RUNNER_TEMP/s00-mutation/run.log"
          python3 "$RUNNER_TEMP/s00-mutate-v2.py" verify "${{ matrix.mutation }}" "$code"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S00-v2-${{ matrix.mutation }}-${{ github.run_id }}
          path: ${{ runner.temp }}/s00-mutation/
          if-no-files-found: warn

  client-mutation-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mutation:
          - client-receipt-invalidate
          - client-carry-authority
          - client-extractor-zero-thickness
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: retain reviewed mutation tools outside candidate source
        run: |
          cp .github/s00-mutate.py "$RUNNER_TEMP/s00-mutate-old.py"
          cp .github/s00-mutate-v2.py "$RUNNER_TEMP/s00-mutate-v2.py"
      - name: materialize exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/s00-build.py
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: gradle
      - name: apply mutation and seal exact mutated tree
        env:
          S00_OLD_MUTATOR: ${{ runner.temp }}/s00-mutate-old.py
        run: |
          chmod +x ./gradlew
          python3 "$RUNNER_TEMP/s00-mutate-v2.py" apply "${{ matrix.mutation }}"
      - name: client mutation must compile
        run: |
          set -o pipefail
          ./gradlew compileGametestJava compileClientJava --console=plain 2>&1 | tee "$RUNNER_TEMP/s00-mutation/compile.log"
      - name: exact real-client oracle must kill mutation
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          S00_OLD_MUTATOR: ${{ runner.temp }}/s00-mutate-old.py
        shell: bash
        run: |
          set +e
          xvfb-run -a ./gradlew runClientGameTest --console=plain --rerun-tasks > "$RUNNER_TEMP/s00-mutation/run.log" 2>&1
          code=$?
          set -e
          tail -n 60 "$RUNNER_TEMP/s00-mutation/run.log"
          python3 "$RUNNER_TEMP/s00-mutate-v2.py" verify "${{ matrix.mutation }}" "$code"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S00-v2-${{ matrix.mutation }}-${{ github.run_id }}
          path: ${{ runner.temp }}/s00-mutation/
          if-no-files-found: warn
