name: s25-adversarial-receipt-publication-boundary

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s25-adversarial-receipt-publication-boundary.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyNetworking.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyTransportReceipts.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyTransportReceiptPayload.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S25AdversarialReceiptPublicationBoundaryTests.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S24TrackingAuthorityTestSeam.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/mixin/TestTrackingAuthorityMixin.java'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  receipt-publication-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S25 receipt publication boundary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S25AdversarialReceiptPublicationBoundaryTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run disconnected-recipient receipt holdout
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s25-receipt-publication-boundary.xml"
      - name: capture receipt publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S25-receipt-publication-boundary
          path: |
            build/s25-receipt-publication-boundary.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json
