name: s05-s07-incremental-hotfix

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - .github/workflows/s05-incremental-index-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
          fetch-depth: 0
      - name: apply source repair
        shell: bash
        run: |
          echo '...' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git diff --check
          git diff --stat
      - name: commit repair
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/github/r3neer/scalebrews/collision/physics/MaterialBroadphase.java src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java src/main/java/io/github/r3neer/scalebrews/collision/internal/MaterialPhysicsRuntime.java src/main/java/io/github/r3neer/scalebrews/mixin/PlatformEntityMixin.java
          git commit -m 'fix(collision): localize broadphase mutation and plan conflicts'
          git push origin HEAD:chatgpt-editing
