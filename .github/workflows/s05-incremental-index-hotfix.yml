'''    private static SpatialIndex spatial(Level level) {
        var current=SPATIAL.get(level);
        if(current!=null && current.tick()==level.getGameTime())return current;
        Map<LivingEntity,GeometryProvider> providers;
        synchronized(PROVIDERS){providers=new IdentityHashMap<>(PROVIDERS);}
        return rebuildSpatial(level,providers);
    }
    /** Explicit mutation seam used by root/setPos hooks; it never scans unrelated providers. */
    public static synchronized void spatialMutation(LivingEntity support) {refreshSpatialEntry(support);}
    private static void refreshSpatialEntry(LivingEntity support) {
        var current=SPATIAL.get(support.level());
        if(current==null || current.tick()!=support.level().getGameTime())return;
        var provider=PROVIDERS.get(support);
        if(provider==null){removeSpatialEntry(support);return;}
        if(DESCRIPTORS.containsKey(support)){queryFrame(support);return;}
        var sample=provider.sample(support).orElse(null);
        if(sample==null){removeSpatialEntry(support);return;}
        var frame=new FrameStamp(null,observeRoot(support),sample.revision(),registrationGeneration(support),0);
        syncSpatialEntry(support,sample,frame);
    }
    private static boolean syncSpatialEntry(LivingEntity support,GeometryProvider.QueryFrame frame) {
        var stamp=new FrameStamp(frame.identity(),frame.root(),frame.snapshot().revision(),registrationGeneration(support),frame.endpoint().frameSerial());
        return syncSpatialEntry(support,frame.snapshot(),stamp);
    }
    private static boolean syncSpatialEntry(LivingEntity support,GeometryProvider.Snapshot snapshot,FrameStamp frame) {
        var current=SPATIAL.get(support.level());
        if(current==null || current.tick()!=support.level().getGameTime())return true;
        var envelope=snapshotBounds(snapshot);if(envelope==null){removeSpatialEntry(support);return true;}
        var rejected=current.broadphase().upsert(new MaterialBroadphase.Entry<>(support,envelope));
        if(rejected!=null){current.frames().remove(support);quarantineEndpoint(support);return false;}
        current.frames().put(support,frame);return true;
    }
    private static void removeSpatialEntry(LivingEntity support) {
        var current=SPATIAL.get(support.level());
        if(current==null || current.tick()!=support.level().getGameTime())return;
        current.broadphase().remove(support);current.frames().remove(support);
    }
