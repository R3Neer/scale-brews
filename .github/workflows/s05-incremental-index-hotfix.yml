name: s05-s07-incremental-hotfix

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - .github/workflows/s05-incremental-index-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
          fetch-depth: 0
      - name: patch incremental broadphase and plan-conflict locality
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matches={count}')
              return text.replace(old,new,1)

