name: s19-hidden-hierarchy-proof

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s19-hidden-hierarchy-proof.yml'
      - 'tools/s19-external-inputs.lock.json'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryExtractor.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryEngine.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/geometry/AnatomyFilter.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S19HiddenHierarchyClientProof.java'
  workflow_dispatch:

jobs:
  hidden-hierarchy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew

      - name: resolve pinned S19 external inputs
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/s19-hidden-hierarchy-inputs"
          mkdir -p "$probe"
          python3 - "$probe" <<'PY'
          import json, pathlib, sys
          probe = pathlib.Path(sys.argv[1])
          lock = json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          if lock.get('schema') != 1 or lock.get('minecraft') != '26.2':
              raise SystemExit('Unexpected S19 external input lock')
          inputs = lock.get('inputs')
          if not isinstance(inputs, list) or sorted(item.get('modId') for item in inputs) != ['alexsmobs', 'cloth-config', 'codxlib']:
              raise SystemExit('Unexpected S19 external input set')
          deps = '\n'.join(f"    proofInputs '{item['coordinate']}'" for item in inputs)
          (probe / 'settings.gradle').write_text("rootProject.name = 's19-hidden-hierarchy-inputs'\n")
          (probe / 'build.gradle').write_text(f"""repositories {{
              maven {{ url = 'https://cursemaven.com/'; content {{ includeGroup 'curse.maven' }} }}
          }}
          configurations {{ proofInputs {{ canBeConsumed = false; canBeResolved = true; transitive = false }} }}
          dependencies {{
          {deps}
          }}
          tasks.register('copyProofInputs', Copy) {{
              from configurations.proofInputs
              into layout.buildDirectory.dir('proof-inputs')
          }}
          """)
          PY
          ./gradlew -p "$probe" copyProofInputs --console=plain
          mkdir -p build/s19-hidden-hierarchy/mods
          cp "$probe"/build/proof-inputs/*.jar build/s19-hidden-hierarchy/mods/
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          lock = json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          mods = pathlib.Path('build/s19-hidden-hierarchy/mods')
          for item in lock['inputs']:
              _, artifact, version = item['coordinate'].split(':')
              jar = mods / f'{artifact}-{version}.jar'
              if not jar.is_file():
                  raise SystemExit(f'Missing pinned proof jar {jar.name}')
              actual = hashlib.sha256(jar.read_bytes()).hexdigest()
              if actual != item['sha256']:
                  raise SystemExit(f'Pinned input hash mismatch for {jar.name}: {actual}')
              with zipfile.ZipFile(jar) as archive:
                  metadata = json.loads(archive.read('fabric.mod.json'))
              if metadata.get('id') != item['modId'] or str(metadata.get('version')) != item['version']:
                  raise SystemExit(f'Pinned input identity mismatch for {jar.name}')
          PY

      - name: isolate hidden hierarchy client proof
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S19HiddenHierarchyClientProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

      - name: run hidden hierarchy proof
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-hidden-hierarchy/mods" \
            2>&1 | tee build/s19-hidden-hierarchy/normal.log
          mkdir -p build/s19-hidden-hierarchy/logs-normal
          cp -r build/run/clientGameTest/logs/. build/s19-hidden-hierarchy/logs-normal/ || true

      - name: require lost ancestor-hidden propagation mutant to die
        shell: bash
        run: |
          set -euo pipefail
          file='src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryExtractor.java'
          python3 - "$file" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); text=p.read_text()
          old='''        boolean hidden = structurallyHidden || !bool(read(dialect.showModel, part, "showModel"), "showModel");'''
          new='''        boolean hidden = !bool(read(dialect.showModel, part, "showModel"), "showModel"); // adversarial mutant: ancestor-hidden state forgotten'''
          if text.count(old) != 1:
              raise SystemExit('S19 hidden-propagation mutation target drifted')
          p.write_text(text.replace(old,new,1))
          PY
          rm -rf build/run/clientGameTest
          set +e
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-hidden-hierarchy/mods" \
            2>&1 | tee build/s19-hidden-hierarchy/hidden-propagation-mutant.log
          code=${PIPESTATUS[0]}
          set -e
          mkdir -p build/s19-hidden-hierarchy/logs-mutant
          cp -r build/run/clientGameTest/logs/. build/s19-hidden-hierarchy/logs-mutant/ || true
          if [ "$code" -eq 0 ]; then
            echo 'S19 lost ancestor-hidden propagation mutant survived.' >&2
            exit 1
          fi
          if ! grep -R -E 'S19 hidden ancestor did not propagate source_hidden|S19 hidden ancestor leaked descendant collider' \
              build/run/clientGameTest/logs build/s19-hidden-hierarchy/hidden-propagation-mutant.log >/dev/null 2>&1; then
            echo 'S19 hidden-propagation mutant died for a non-causal reason.' >&2
            exit 1
          fi
          git checkout -- "$file"

      - name: require source-hidden revival mutant to die
        shell: bash
        run: |
          set -euo pipefail
          file='src/main/java/io/github/r3neer/scalebrews/collision/geometry/AnatomyFilter.java'
          python3 - "$file" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); text=p.read_text()
          old='''        if(piece.excluded()!=null)return piece.excluded(); // Equipment/cosmetic roles never become anatomy.'''
          new='''        if(piece.excluded()!=null && !(include.contains(piece.id()) || include.contains(piece.part())))return piece.excluded(); // adversarial mutant: explicit include may revive source-hidden geometry'''
          if text.count(old) != 1:
              raise SystemExit('S19 source-hidden revival mutation target drifted')
          p.write_text(text.replace(old,new,1))
          PY
          rm -rf build/run/clientGameTest
          set +e
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-hidden-hierarchy/mods" \
            2>&1 | tee build/s19-hidden-hierarchy/source-hidden-revival-mutant.log
          code=${PIPESTATUS[0]}
          set -e
          mkdir -p build/s19-hidden-hierarchy/logs-source-hidden-mutant
          cp -r build/run/clientGameTest/logs/. build/s19-hidden-hierarchy/logs-source-hidden-mutant/ || true
          if [ "$code" -eq 0 ]; then
            echo 'S19 source-hidden revival mutant survived.' >&2
            exit 1
          fi
          if ! grep -R -E 'S19 explicit (piece|part) include revived source_hidden collider' \
              build/run/clientGameTest/logs build/s19-hidden-hierarchy/source-hidden-revival-mutant.log >/dev/null 2>&1; then
            echo 'S19 source-hidden revival mutant died for a non-causal reason.' >&2
            exit 1
          fi

      - name: capture hidden hierarchy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S19-hidden-hierarchy-proof
          path: |
            build/s19-hidden-hierarchy/*.log
            build/s19-hidden-hierarchy/logs-normal/
            build/s19-hidden-hierarchy/logs-mutant/
            build/s19-hidden-hierarchy/logs-source-hidden-mutant/
            build/resources/gametest/fabric.mod.json
            tools/s19-external-inputs.lock.json
