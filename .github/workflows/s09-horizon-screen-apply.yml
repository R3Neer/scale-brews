name: s09-horizon-screen-apply

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s09-horizon-screen-apply.yml'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout exact trigger snapshot
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - name: add solo convergence diagnostics in workspace only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/gametest/java/io/github/r3neer/scalebrews/test/S09PreparedIntermediateContactProof.java')
          s=p.read_text()
          old='''            var chosenResponse=TemporalResponse.resolve(captured,Vec3.ZERO,\n                Map.of(chosen,liveMotion.pieces().get(chosen)),32,256);\n            h.assertTrue(chosenResponse.status()==TemporalResponse.Status.COMPLETE && chosenResponse.displacement().lengthSqr()>1e-10,\n                "A9 chosen live piece alone must produce a complete non-zero interior response: "+chosenResponse);'''
          new='''            var chosenMotion=liveMotion.pieces().get(chosen);\n            var chosenResponse=TemporalResponse.resolve(captured,Vec3.ZERO,Map.of(chosen,chosenMotion),32,256);\n            String soloDiagnostics="";\n            if(chosenResponse.status()==TemporalResponse.Status.ITERATION_LIMIT) {\n                int[] budgets={8,16,32,64,128,256,512,1024,4096};\n                var worldSweeps=new ArrayList<String>();\n                for(int budget:budgets)worldSweeps.add(budget+":"+ConservativeSweep.query(captured,Vec3.ZERO,chosenMotion,budget));\n                var center=captured.getCenter();\n                var shift=new Vec3(-center.x,0,-center.z);\n                var originBody=captured.move(shift);\n                var originMotion=translate(chosenMotion,shift);\n                var originSweeps=new ArrayList<String>();\n                for(int budget:budgets)originSweeps.add(budget+":"+ConservativeSweep.query(originBody,Vec3.ZERO,originMotion,budget));\n                double[] samples={0,.1,.2,.25,.28,.284,.285,.3,.4,.5,.75,1};\n                var gaps=new ArrayList<String>();\n                for(double t:samples){var material=chosenMotion.at().apply(t);var sep=material.separation(captured);gaps.add(t+":"+sep.gap()+"/"+sep.normal());}\n                soloDiagnostics=" piece="+chosen+" worldSweeps="+worldSweeps+" originSweeps="+originSweeps+" gaps="+gaps\n                    +" deformation="+chosenMotion.deformationSpeed()+" linear="+chosenMotion.linearTranslation()+" maxPointSpeed="+chosenMotion.maxPointSpeed()\n                    +" bodyCenter="+center+" originCenter="+originBody.getCenter();\n            }\n            h.assertTrue(chosenResponse.status()==TemporalResponse.Status.COMPLETE && chosenResponse.displacement().lengthSqr()>1e-10,\n                "A9 chosen live piece alone must produce a complete non-zero interior response: "+chosenResponse+soloDiagnostics);'''
          if s.count(old)!=1: raise SystemExit(f'solo diagnostic target count={s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - name: export original client geometry
        run: |
          chmod +x ./gradlew
          xvfb-run -a ./gradlew runClientGameTest -PscalebrewsAnatomyProof=true
      - name: locate exported catalog
        id: catalog
        shell: bash
        run: |
          catalog="$(find . -type d -name anatomy-export -print -quit)"
          test -n "$catalog"
          echo "path=$catalog" >> "$GITHUB_OUTPUT"
      - name: run prepared diagnostics
        run: ./gradlew runGameTest -PscalebrewsAnatomyPreparedSuite=true -PscalebrewsAnatomyCatalog='${{ steps.catalog.outputs.path }}'
