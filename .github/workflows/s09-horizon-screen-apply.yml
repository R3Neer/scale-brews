name: s09-horizon-screen-apply

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s09-horizon-screen-apply.yml'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout exact trigger snapshot
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - name: add translated manifold diagnostics in workspace only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/gametest/java/io/github/r3neer/scalebrews/test/S09PreparedIntermediateContactProof.java')
          s=p.read_text()
          old='''            var response=TemporalResponse.resolve(translatedBody,Vec3.ZERO,translated,32,256);\n            h.assertTrue(response.status()==TemporalResponse.Status.COMPLETE && response.displacement().lengthSqr()>1e-10,\n                "A9 translated prepared manifold must complete under the same 256 budget at x/z="\n                    +target[0]+"/"+target[1]+": "+response);'''
          new='''            var response=TemporalResponse.resolve(translatedBody,Vec3.ZERO,translated,32,256);\n            String diagnostics="";\n            if(response.status()==TemporalResponse.Status.ITERATION_LIMIT) {\n                var progressive=new TreeMap<String,ConservativeSweep.Motion>();\n                var prefix=new ArrayList<String>();\n                String failedAt=null;\n                for(var id:new TreeSet<>(translated.keySet())) {\n                    progressive.put(id,translated.get(id));\n                    var partial=TemporalResponse.resolve(translatedBody,Vec3.ZERO,progressive,32,256);\n                    prefix.add(id+"{status="+partial.status()+",evals="+partial.evaluations()+",time="+partial.time()+",contacts="+partial.contacts().size()+"}");\n                    if(partial.status()==TemporalResponse.Status.ITERATION_LIMIT){failedAt=id;break;}\n                }\n                if(failedAt!=null) {\n                    var motion=translated.get(failedAt);\n                    var solo=TemporalResponse.resolve(translatedBody,Vec3.ZERO,Map.of(failedAt,motion),32,256);\n                    var sweep8=ConservativeSweep.query(translatedBody,Vec3.ZERO,motion,8);\n                    var sweep256=ConservativeSweep.query(translatedBody,Vec3.ZERO,motion,256);\n                    diagnostics=" prefix="+prefix+" failedAt="+failedAt+" solo="+solo+" sweep8="+sweep8+" sweep256="+sweep256+" maxPointSpeed="+motion.maxPointSpeed()+" bodyCenter="+translatedBody.getCenter();\n                } else diagnostics=" prefix="+prefix+" noPrefixFailure=true bodyCenter="+translatedBody.getCenter();\n            }\n            h.assertTrue(response.status()==TemporalResponse.Status.COMPLETE && response.displacement().lengthSqr()>1e-10,\n                "A9 translated prepared manifold must complete under the same 256 budget at x/z="\n                    +target[0]+"/"+target[1]+": "+response+diagnostics);'''
          if s.count(old)!=1: raise SystemExit(f'diagnostic target count={s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - name: export original client geometry
        run: |
          chmod +x ./gradlew
          xvfb-run -a ./gradlew runClientGameTest -PscalebrewsAnatomyProof=true
      - name: locate exported catalog
        id: catalog
        shell: bash
        run: |
          catalog="$(find . -type d -name anatomy-export -print -quit)"
          test -n "$catalog"
          echo "path=$catalog" >> "$GITHUB_OUTPUT"
      - name: run prepared diagnostics
        run: ./gradlew runGameTest -PscalebrewsAnatomyPreparedSuite=true -PscalebrewsAnatomyCatalog='${{ steps.catalog.outputs.path }}'
