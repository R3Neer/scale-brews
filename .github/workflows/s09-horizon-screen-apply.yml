name: s09-horizon-screen-apply

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s09-horizon-screen-apply.yml'

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout exact trigger snapshot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - name: apply adaptive midpoint probe in workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/physics/TemporalResponse.java')
          s=p.read_text()
          old='private static final int MAX_Q_PROJECTIONS=4,MAX_BISECTIONS=8,PROBE_QUERY_BUDGET=8,SCREEN_DEPTH=8;'
          new='private static final int MAX_Q_PROJECTIONS=4,MAX_BISECTIONS=8,PROBE_QUERY_BUDGET=8,MIDPOINT_CONTACT_PROBE_BUDGET=80,SCREEN_DEPTH=8;'
          if s.count(old)!=1: raise SystemExit(f'constant target count={s.count(old)}')
          s=s.replace(old,new)

          old='''        double earliest=Double.POSITIVE_INFINITY;List<Hit> hits=new ArrayList<>();\n        var ordered=new ArrayList<String>(ids);'''
          new='''        double earliest=Double.POSITIVE_INFINITY;List<Hit> hits=new ArrayList<>();\n        var ordered=new ArrayList<String>(ids);\n        var midpointOverlapping=new HashSet<String>();'''
          if s.count(old)!=1: raise SystemExit(f'ordered target count={s.count(old)}')
          s=s.replace(old,new)

          old='''                var material=pieces.get(id).interval(start,end).at().apply(.5);\n                if(material==null)return new Search(ConservativeSweep.Status.ITERATION_LIMIT,0,List.of());\n                midpointOverlap.put(id,material.overlaps(midpointBody));'''
          new='''                var material=pieces.get(id).interval(start,end).at().apply(.5);\n                if(material==null)return new Search(ConservativeSweep.Status.ITERATION_LIMIT,0,List.of());\n                boolean overlaps=material.overlaps(midpointBody);\n                midpointOverlap.put(id,overlaps);\n                if(overlaps)midpointOverlapping.add(id);'''
          if s.count(old)!=1: raise SystemExit(f'midpoint target count={s.count(old)}')
          s=s.replace(old,new)

          old='''            var result=constraint==null?firstForPiece(body,queryDelta,interval,budget):budget.query(body,queryDelta,interval);'''
          new='''            int probeBudget=!Double.isFinite(earliest) && midpointOverlapping.contains(id)\n                ?MIDPOINT_CONTACT_PROBE_BUDGET:PROBE_QUERY_BUDGET;\n            var result=constraint==null?firstForPiece(body,queryDelta,interval,budget,probeBudget):budget.query(body,queryDelta,interval);'''
          if s.count(old)!=1: raise SystemExit(f'call target count={s.count(old)}')
          s=s.replace(old,new)

          old='''    private static ConservativeSweep.Result firstForPiece(AABB body,Vec3 delta,ConservativeSweep.Motion interval,Budget budget) {\n        if(interval.deformationSpeed()==0)return budget.query(body,delta,interval);\n        var probe=budget.query(body,delta,interval,PROBE_QUERY_BUDGET);'''
          new='''    private static ConservativeSweep.Result firstForPiece(AABB body,Vec3 delta,ConservativeSweep.Motion interval,Budget budget,int probeBudget) {\n        if(interval.deformationSpeed()==0)return budget.query(body,delta,interval);\n        var probe=budget.query(body,delta,interval,probeBudget);'''
          if s.count(old)!=1: raise SystemExit(f'firstForPiece target count={s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git diff -- src/main/java/io/github/r3neer/scalebrews/collision/physics/TemporalResponse.java
      - name: ordinary suite
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: export original client geometry
        run: xvfb-run -a ./gradlew runClientGameTest -PscalebrewsAnatomyProof=true
      - name: locate exported catalog
        id: catalog
        shell: bash
        run: |
          catalog="$(find . -type d -name anatomy-export -print -quit)"
          test -n "$catalog"
          echo "path=$catalog" >> "$GITHUB_OUTPUT"
      - name: prepared server suite
        run: ./gradlew runGameTest -PscalebrewsAnatomyPreparedSuite=true -PscalebrewsAnatomyCatalog='${{ steps.catalog.outputs.path }}'
      - name: commit and push production fix
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add src/main/java/io/github/r3neer/scalebrews/collision/physics/TemporalResponse.java
          git commit -m 'fix(s09): probe first midpoint contact exactly'
          git push origin HEAD:chatgpt-editing
