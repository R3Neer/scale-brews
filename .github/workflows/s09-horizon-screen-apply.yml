name: s09-horizon-screen-apply

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s09-horizon-screen-apply.yml'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout exact trigger snapshot
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - name: add deterministic solo translation diagnostics in workspace only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/gametest/java/io/github/r3neer/scalebrews/test/S09PreparedIntermediateContactProof.java')
          s=p.read_text()
          old='''            var chosenResponse=TemporalResponse.resolve(captured,Vec3.ZERO,\n                Map.of(chosen,liveMotion.pieces().get(chosen)),32,256);\n            h.assertTrue(chosenResponse.status()==TemporalResponse.Status.COMPLETE && chosenResponse.displacement().lengthSqr()>1e-10,\n                "A9 chosen live piece alone must produce a complete non-zero interior response: "+chosenResponse);'''
          new='''            var chosenMotion=liveMotion.pieces().get(chosen);\n            var chosenResponse=TemporalResponse.resolve(captured,Vec3.ZERO,Map.of(chosen,chosenMotion),32,256);\n            int[] diagnosticBudgets={8,16,32,64,128,256,512,1024,4096};\n            double[][] diagnosticTargets={{0,0},{8_000_000,-4_000_000},{-13_000_000,8_000_000},{29_000_000,-29_000_000}};\n            var sourceCenter=captured.getCenter();\n            for(var target:diagnosticTargets) {\n                var shift=new Vec3(target[0]-sourceCenter.x,0,target[1]-sourceCenter.z);\n                var diagnosticBody=captured.move(shift);\n                var diagnosticMotion=translate(chosenMotion,shift);\n                var sweeps=new ArrayList<String>();\n                for(int diagnosticBudget:diagnosticBudgets)\n                    sweeps.add(diagnosticBudget+":"+ConservativeSweep.query(diagnosticBody,Vec3.ZERO,diagnosticMotion,diagnosticBudget));\n                var temporal=TemporalResponse.resolve(diagnosticBody,Vec3.ZERO,Map.of(chosen,diagnosticMotion),32,256);\n                double[] sampleTimes={0,.1,.2,.25,.28,.284,.285,.3,.4,.5,.75,1};\n                var gaps=new ArrayList<String>();\n                for(double sampleTime:sampleTimes){var material=diagnosticMotion.at().apply(sampleTime);var sep=material.separation(diagnosticBody);gaps.add(sampleTime+":"+sep.gap()+"/"+sep.normal());}\n                System.out.println("S09_SOLO_TRANSLATION target="+target[0]+"/"+target[1]+" piece="+chosen\n                    +" temporal="+temporal+" sweeps="+sweeps+" gaps="+gaps\n                    +" deformation="+diagnosticMotion.deformationSpeed()+" linear="+diagnosticMotion.linearTranslation()\n                    +" maxPointSpeed="+diagnosticMotion.maxPointSpeed()+" bodyCenter="+diagnosticBody.getCenter());\n            }\n            h.assertTrue(chosenResponse.status()==TemporalResponse.Status.COMPLETE && chosenResponse.displacement().lengthSqr()>1e-10,\n                "A9 chosen live piece alone must produce a complete non-zero interior response: "+chosenResponse);'''
          if s.count(old)!=1: raise SystemExit(f'solo diagnostic target count={s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - name: export original client geometry
        run: |
          chmod +x ./gradlew
          xvfb-run -a ./gradlew runClientGameTest -PscalebrewsAnatomyProof=true
      - name: locate exported catalog
        id: catalog
        shell: bash
        run: |
          catalog="$(find . -type d -name anatomy-export -print -quit)"
          test -n "$catalog"
          echo "path=$catalog" >> "$GITHUB_OUTPUT"
      - name: run prepared diagnostics
        run: ./gradlew runGameTest -PscalebrewsAnatomyPreparedSuite=true -PscalebrewsAnatomyCatalog='${{ steps.catalog.outputs.path }}'
