name: s16-finalize-docs

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s16-finalize-docs.yml'

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
      - name: apply closure patch
        run: python3 .github/scripts/s16_finalize_docs.py
      - name: commit docs and remove helpers
        run: |
          set -euo pipefail
          git rm .github/workflows/s16-finalize-docs.yml .github/scripts/s16_finalize_docs.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/sprints/S16-canonical-catalog-authority.md docs/ENTITY_COLLISIONS_PLAN.md docs/VALIDATION.md
          git commit -m 'docs(s16): renew canonical catalog closure'
          git push origin HEAD:chatgpt-editing
