name: s19-scale-children-real-proof

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s19-scale-children-real-proof.yml'
      - 'tools/s19-external-inputs.lock.json'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryEngine.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryExtractor.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S19ScaleChildrenClientProof.java'
  workflow_dispatch:

jobs:
  real-scale-children:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew

      - name: resolve and verify pinned S19 external inputs
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/s19-scale-children-inputs"
          mkdir -p "$probe"
          python3 - "$probe" <<'PY'
          import json, pathlib, sys
          probe = pathlib.Path(sys.argv[1])
          lock = json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          if lock.get('schema') != 1 or lock.get('minecraft') != '26.2':
              raise SystemExit('Unexpected S19 external input lock')
          deps = '\n'.join(f"    proofInputs '{item['coordinate']}'" for item in lock['inputs'])
          (probe / 'settings.gradle').write_text("rootProject.name = 's19-scale-children-inputs'\n")
          (probe / 'build.gradle').write_text(f"""repositories {{
              maven {{
                  url = 'https://cursemaven.com/'
                  content {{ includeGroup 'curse.maven' }}
              }}
          }}
          configurations {{
              proofInputs {{
                  canBeConsumed = false
                  canBeResolved = true
                  transitive = false
              }}
          }}
          dependencies {{
          {deps}
          }}
          tasks.register('copyProofInputs', Copy) {{
              from configurations.proofInputs
              into layout.buildDirectory.dir('proof-inputs')
          }}
          """)
          PY
          ./gradlew -p "$probe" copyProofInputs --console=plain
          mkdir -p build/s19-scale-children/mods
          cp "$probe"/build/proof-inputs/*.jar build/s19-scale-children/mods/
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          lock = json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          mods = pathlib.Path('build/s19-scale-children/mods')
          for item in lock['inputs']:
              group, artifact, version = item['coordinate'].split(':')
              jar = mods / f'{artifact}-{version}.jar'
              if not jar.is_file():
                  raise SystemExit(f'Missing pinned proof jar {jar.name}')
              actual = hashlib.sha256(jar.read_bytes()).hexdigest()
              if actual != item['sha256']:
                  raise SystemExit(f'SHA mismatch for {jar.name}: {actual}')
              with zipfile.ZipFile(jar) as archive:
                  metadata = json.loads(archive.read('fabric.mod.json'))
              if metadata.get('id') != item['modId'] or str(metadata.get('version')) != item['version']:
                  raise SystemExit(f'Mod identity mismatch for {jar.name}')
          PY

      - name: isolate real scaleChildren client proof
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S19ScaleChildrenClientProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

      - name: run real scaleChildren proof
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-scale-children/mods" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/s19-scale-children/normal.log"
          mkdir -p build/s19-scale-children/logs-normal
          cp -r build/run/clientGameTest/logs/. build/s19-scale-children/logs-normal/ || true

      - name: require lost child-scale compensation mutant to die
        shell: bash
        run: |
          set -euo pipefail
          file='src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryExtractor.java'
          python3 - "$file" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); text=p.read_text()
          old='extractPart(child, id, childTransformParent, hidden, depth + 1);'
          new='extractPart(child, id, id, hidden, depth + 1); // adversarial mutant: helper exists but children bypass it'
          if old not in text:
              raise SystemExit('S19 child-scale mutation target not found')
          p.write_text(text.replace(old,new,1))
          PY
          rm -rf build/run/clientGameTest
          set +e
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-scale-children/mods" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/s19-scale-children/mutant.log"
          code=${PIPESTATUS[0]}
          set -e
          mkdir -p build/s19-scale-children/logs-mutant
          cp -r build/run/clientGameTest/logs/. build/s19-scale-children/logs-mutant/ || true
          if [ "$code" -eq 0 ]; then
            echo 'S19 lost scaleChildren compensation mutant survived the real Citadel renderer oracle.' >&2
            exit 1
          fi
          if ! grep -R -F 'S19 scaleChildren collider vertex diverges from real Citadel renderer' \
              build/run/clientGameTest/logs "$GITHUB_WORKSPACE/build/s19-scale-children/mutant.log" >/dev/null 2>&1; then
            echo 'S19 child-scale mutant failed, but not at the intended renderer/collider assertion.' >&2
            exit 1
          fi

      - name: capture real scaleChildren evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S19-real-scale-children-proof
          path: |
            build/s19-scale-children/*.log
            build/s19-scale-children/logs-normal/
            build/s19-scale-children/logs-mutant/
            build/resources/gametest/fabric.mod.json
            tools/s19-external-inputs.lock.json
