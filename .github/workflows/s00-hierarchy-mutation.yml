# Temporary S00 directed mutation for the latest HierarchyMotion repair.
name: s00-hierarchy-mutation
on:
  push:
    branches: [chatgpt-editing]
permissions:
  contents: read
jobs:
  hierarchy-unknown-joint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: materialize exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/s00-build.py
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: gradle
      - name: apply and seal mutation
        run: |
          chmod +x ./gradlew
          python3 - <<'PY'
          import json,pathlib,subprocess
          p=pathlib.Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/HierarchyMotion.java')
          old='''        Objects.requireNonNull(before);Objects.requireNonNull(after);\n        var knownParts=new HashSet<String>();for(var part:model.parts())knownParts.add(part.id());\n        if(!knownParts.containsAll(before.keySet()) || !knownParts.containsAll(after.keySet()))\n            throw new IllegalArgumentException("Unknown motion joint");\n'''
          s=p.read_text();assert s.count(old)==1
          candidate=subprocess.check_output(['git','write-tree'],text=True).strip();p.write_text(s.replace(old,''))
          subprocess.check_call(['git','add','--',str(p)]);mutation=subprocess.check_output(['git','write-tree'],text=True).strip();assert mutation!=candidate
          d=pathlib.Path('${{ runner.temp }}')/'s00-hierarchy-mutation';d.mkdir();(d/'identity.json').write_text(json.dumps({'candidate_tree':candidate,'mutation_tree':mutation},indent=2))
          print('candidate='+candidate);print('mutation='+mutation)
          PY
      - name: mutation must compile
        run: ./gradlew compileGametestJava --console=plain
      - name: exact assertion must kill mutation
        shell: bash
        run: |
          set +e
          ./gradlew runGameTest --console=plain --rerun-tasks "-PscalebrewsGameTestReport=$RUNNER_TEMP/s00-hierarchy-mutation/server.xml" > "$RUNNER_TEMP/s00-hierarchy-mutation/run.log" 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          python3 - <<'PY'
          import json,os,subprocess,xml.etree.ElementTree as ET,pathlib
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'s00-hierarchy-mutation';identity=json.loads((d/'identity.json').read_text())
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==identity['mutation_tree']
          failed=[t.get('name') for t in ET.parse(d/'server.xml').findall('.//testcase') if t.find('failure') is not None]
          expected='scalebrews-test:s00model_tests_hierarchy_motion_unknown_joint_cannot_silently_become_rest_pose'
          assert expected in failed,failed
          (d/'result.json').write_text(json.dumps({'status':'KILLED','expected':expected,'observed_failures':failed,**identity},indent=2))
          print('MUTATION_KILLED hierarchy-unknown-joint')
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S00-hierarchy-mutation-${{ github.run_id }}
          path: ${{ runner.temp }}/s00-hierarchy-mutation/
          if-no-files-found: warn
