name: s25-adversarial-receipt-isolation

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s25-adversarial-receipt-isolation.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyTransportReceipts.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S25ReceiptAuthorityIsolationTests.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S24TrackingAuthorityTestSeam.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/mixin/TestTrackingAuthorityMixin.java'
      - 'src/gametest/resources/scalebrews-test.mixins.json'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  receipt-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S25 receipt isolation holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S25ReceiptAuthorityIsolationTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run recipient-local receipt holdout
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s25-receipt-isolation.xml"
      - name: capture receipt isolation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S25-receipt-isolation
          path: |
            build/s25-receipt-isolation.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json

  recipient-key-mutant-must-die:
    needs: receipt-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S25 receipt isolation holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=['io.github.r3neer.scalebrews.collision.internal.S25ReceiptAuthorityIsolationTests']
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: ignore recipient identity during receipt lookup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyTransportReceipts.java')
          s=p.read_text()
          old='var roots=HISTORIES.get(recipient);if(roots==null)return null;'
          new='var roots=HISTORIES.values().stream().findFirst().orElse(null);if(roots==null)return null;'
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileGametestJava --console=plain
      - name: holdout must kill recipient-key mutant
        shell: bash
        run: |
          set +e
          ./gradlew runGameTest --console=plain --rerun-tasks -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s25-receipt-recipient-mutant.xml"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: receipt lookup ignored recipient identity'
            exit 1
          fi
          echo 'KILLED: recipient identity omission in receipt lookup'

  disconnect-global-mutant-must-die:
    needs: receipt-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S25 receipt isolation holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=['io.github.r3neer.scalebrews.collision.internal.S25ReceiptAuthorityIsolationTests']
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: make one disconnect erase all recipient receipts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyTransportReceipts.java')
          s=p.read_text()
          old='if(player!=null)HISTORIES.remove(player);'
          new='if(player!=null)HISTORIES.clear();'
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileGametestJava --console=plain
      - name: holdout must kill global-disconnect mutant
        shell: bash
        run: |
          set +e
          ./gradlew runGameTest --console=plain --rerun-tasks -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s25-receipt-disconnect-mutant.xml"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: one recipient disconnect erased every receipt owner'
            exit 1
          fi
          echo 'KILLED: global receipt teardown on one disconnect'
