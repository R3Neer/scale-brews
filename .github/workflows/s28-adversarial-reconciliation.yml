name: s28-adversarial-reconciliation

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s28-adversarial-reconciliation.yml'
      - 'docs/sprints/S28-g4-reconciliation.md'
      - 'src/main/java/io/github/r3neer/scalebrews/mixin/PlatformConnectionMixin.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovementReference.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/runtime/TransportLedger.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/AnatomyPredictionBaselineProof.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/PlatformTestLatency.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/VehicleMoveAudit.java'
      - 'src/gametest/resources/scalebrews-test.mixins.json'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  reconciliation-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: export immutable original client geometry
        run: xvfb-run -a ./gradlew runClientGameTest -PscalebrewsAnatomyProof=true
      - name: locate exported anatomy catalog
        id: catalog
        shell: bash
        run: |
          catalog="$(find . -type d -name anatomy-export -print -quit)"
          test -n "$catalog"
          echo "path=$catalog" >> "$GITHUB_OUTPUT"
      - name: isolate reconciliation dedicated proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.AnatomyPredictionBaselineProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run player and controlled-boat reconciliation baseline
        shell: bash
        env:
          SCALEBREWS_S25_REFERENCE_ACCEPTANCE: '1'
        run: |
          set -euo pipefail
          mkdir -p build/s28-reconciliation
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            -PscalebrewsAnatomyCatalog="$CATALOG" \
            2>&1 | tee build/s28-reconciliation/client.log
          grep -R -F 'S25_REFERENCE_LATENCY PASS' \
            build/run/clientGameTest/logs build/s28-reconciliation/client.log >/dev/null
        env:
          SCALEBREWS_S25_REFERENCE_ACCEPTANCE: '1'
          CATALOG: \${{ steps.catalog.outputs.path }}
      - name: capture reconciliation baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S28-reconciliation-baseline
          path: |
            build/s28-reconciliation/client.log
            build/run/clientGameTest/logs/
            build/resources/gametest/fabric.mod.json

  baseline-double-mutant-must-die:
    needs: reconciliation-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: double every confirmed transport baseline adjustment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/mixin/PlatformConnectionMixin.java')
          s=p.read_text()
          old='public void scalebrews$transportBaseline(Entity body,Vec3 d) {'
          new='public void scalebrews$transportBaseline(Entity body,Vec3 d) {\n        d=d.scale(2);'
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileClientJava compileGametestJava --console=plain
      - name: export immutable original client geometry
        run: xvfb-run -a ./gradlew runClientGameTest -PscalebrewsAnatomyProof=true
      - name: locate exported anatomy catalog
        id: catalog
        shell: bash
        run: |
          catalog="$(find . -type d -name anatomy-export -print -quit)"
          test -n "$catalog"
          echo "path=$catalog" >> "$GITHUB_OUTPUT"
      - name: isolate reconciliation dedicated proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.AnatomyPredictionBaselineProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: baseline-double mutant must break reconciliation
        shell: bash
        env:
          SCALEBREWS_S25_REFERENCE_ACCEPTANCE: '1'
          CATALOG: \${{ steps.catalog.outputs.path }}
        run: |
          set +e
          xvfb-run -a ./gradlew runClientGameTest --console=plain --rerun-tasks \
            -PscalebrewsAnatomyCatalog="$CATALOG"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: doubled vanilla transport baseline produced no detected correction/drift'
            exit 1
          fi
          echo 'KILLED: doubled vanilla transport baseline'

  reference-double-mutant-must-die:
    needs: reconciliation-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: reapply current transport on top of post-receipt rebase
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovementReference.java')
          s=p.read_text()
          old='Vec3 rebased=absolute.add(window.appliedDelta());'
          new='Vec3 rebased=absolute.add(window.appliedDelta()).add(TransportLedger.current(body).appliedDelta());'
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileClientJava compileGametestJava --console=plain
      - name: export immutable original client geometry
        run: xvfb-run -a ./gradlew runClientGameTest -PscalebrewsAnatomyProof=true
      - name: locate exported anatomy catalog
        id: catalog
        shell: bash
        run: |
          catalog="$(find . -type d -name anatomy-export -print -quit)"
          test -n "$catalog"
          echo "path=$catalog" >> "$GITHUB_OUTPUT"
      - name: isolate reconciliation dedicated proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.AnatomyPredictionBaselineProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: reference double-apply mutant must break reconciliation
        shell: bash
        env:
          SCALEBREWS_S25_REFERENCE_ACCEPTANCE: '1'
          CATALOG: \${{ steps.catalog.outputs.path }}
        run: |
          set +e
          xvfb-run -a ./gradlew runClientGameTest --console=plain --rerun-tasks \
            -PscalebrewsAnatomyCatalog="$CATALOG"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: receipt/current transport double-apply produced no detected correction/drift'
            exit 1
          fi
          echo 'KILLED: reference double-apply reconciliation mutant'
