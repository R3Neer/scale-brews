name: s07-adversarial-evidence

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s07-adversarial-evidence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
          fetch-depth: 0
      - name: record executed S07 evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/VALIDATION.md')
          t=p.read_text()
          old='''- closing the current S05 post-mutation locality reds;\n- closing the current S07 valid-plan-conflict fail-closed red;'''
          new='''- closing the current S07 rejected-batch final-contact-validity red;'''
          if old in t:
              t=t.replace(old,new,1)
          marker='## G2 / S07 rejected-batch contact validity reopening — 2026-09-11'
          if marker not in t:
              t += '''\n\n## G2 / S07 rejected-batch contact validity reopening — 2026-09-11\n\nThe earlier plan-conflict locality defect is closed, but a later adversarial holdout reopens S07 under NFR-004.\n\nGreen evidence immediately before the reopening:\n\n- source repair `29d4595f38f7ff3c44f9af7ebb98512cdd16f93d` localized body/body conflicts by responsible support;\n- run `34633241588`, job `103374905847` passed **319/319 GameTests**;\n- run `34633398671`, job `103375427902` passed **320/320 GameTests**, including the cross-tick S05 locality holdout;\n- prepared proof run `34633591227`, job `103376062867` passed original-client geometry export plus the isolated prepared server runtime.\n\nNew red-before-green evidence:\n\n- `S07RejectedBatchContactValidityTests.rejectedConflictMustStillReleaseRetainedFaceThatMovedAway` creates a simultaneous A/B joint batch;\n- support A is the cause of an otherwise valid body/body plan conflict;\n- the left body retains a valid contact on support B before the event;\n- B's own certified interval moves that retained floor away by `0.4`, while the batch is rejected because of A;\n- the fixture starts B at gap `0.01`, inside the `0.025` retention tolerance but outside the CCD skin, and models B as rigid translation, so it does not manufacture a `t=0` temporal contact;\n- run **`34634310744`**, job **`103378374367`**, snapshot `a48f4e6e960e5b1adf4bd937e3275e838cdb7ad3`, executed **321 GameTests**: **320 passed / 1 failed**;\n- the single failure is exactly `NFR-004 forbids preserving a retained B face that the same rejected batch certifies has moved away`;\n- all fixture preconditions passed, the individual plans were `COMPLETE`, the batch was rejected as `BACKEND_EXHAUSTED`, and no partial body displacement was applied.\n\nAn earlier version of this holdout that started B at exact tangency entered `ITERATION_LIMIT` and is explicitly **not** production evidence. `a48f4e6e…` corrected the fixture before the valid red above.\n\nThis reopening does **not** reopen S05 or S06. It demonstrates a distinct S07 rule: after a rejected batch, causal attribution of the conflict and final material validity of retained contacts are separate checks. A repair must preserve the existing stable-B multi-support holdout while releasing a B contact whose own certified `after` frame no longer validates it.\n'''
          p.write_text(t)
          PY
          git diff --check
          git diff -- docs/VALIDATION.md
      - name: commit evidence
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No evidence changes required.'
            exit 0
          fi
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/VALIDATION.md
          git commit -m 'docs(collision): record S07 rejected-batch red evidence'
          git push origin HEAD:chatgpt-editing
