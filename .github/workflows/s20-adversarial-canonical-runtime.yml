name: s20-adversarial-canonical-runtime

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s20-adversarial-canonical-runtime.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/WorldAnatomyCatalog.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/ModelGeometryProvider.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AuthorityPoseTracker.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyBindingState.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/pose/CitadelPoseEngine.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/pose/CitadelPoseProgram.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S20AdversarialCanonicalRuntimeTests.java'
  workflow_dispatch:

jobs:
  canonical-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S20 live canonical runtime holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S20AdversarialCanonicalRuntimeTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run S20 live canonical runtime holdout
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s20-adversarial-canonical-runtime-junit.xml"
      - name: capture baseline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S20-adversarial-canonical-runtime
          path: |
            build/s20-adversarial-canonical-runtime-junit.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json

  mutation-kill:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S20 live canonical runtime holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S20AdversarialCanonicalRuntimeTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: prove baseline green
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s20-canonical-runtime-baseline.xml"
      - name: reintroduce legacy eligibility suppression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/WorldAnatomyCatalog.java')
          s=p.read_text()
          old='return legacyPoseProvider == null || AnatomyPoseEligibility.supported(legacyPoseProvider, entity);'
          new='return legacyPoseProvider != null && AnatomyPoseEligibility.supported(legacyPoseProvider, entity);'
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileGametestJava --console=plain
      - name: live runtime holdout must kill eligibility mutant
        shell: bash
        run: |
          set +e
          ./gradlew runGameTest --console=plain --rerun-tasks -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s20-canonical-runtime-mutant.xml"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: canonical binding accepted legacy eligibility suppression'
            exit 1
          fi
          echo 'KILLED: canonical live-runtime holdout rejected legacy eligibility suppression'
      - name: capture mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S20-canonical-runtime-mutation-kill
          path: |
            build/s20-canonical-runtime-baseline.xml
            build/s20-canonical-runtime-mutant.xml
            build/run/gameTest/logs/
