name: s05-locality-cleanup

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - .github/workflows/s05-locality-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
          fetch-depth: 0
      - name: remove non-contractual S06 fallback while preserving S05 locality
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d | python
          git diff --check
          git diff -- src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java
      - name: commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java
          git commit -m 'fix(collision): keep live broadphase locality minimal'
          git push origin HEAD:chatgpt-editing
