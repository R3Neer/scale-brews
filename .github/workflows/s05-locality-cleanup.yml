name: s05-locality-cleanup

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - .github/workflows/s05-locality-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
          fetch-depth: 0
      - name: keep only contractual live locality change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java')
          t=p.read_text()
          start=t.index('    private static SpatialIndex spatial(Level level) {')
          end=t.index('    /** The current S05 caller supplies instantaneous convex bounds',start)
          replacement=(
              '    private static SpatialIndex spatial(Level level) {\n'
              '        var current=SPATIAL.get(level);\n'
              '        // Register/rebind, lifecycle barriers, accepted causal endpoints and tick rollover\n'
              '        // invalidate the cache explicitly. Reusing a same-tick index must not resample every\n'
              '        // registered provider before a local query can reach the bounded spatial kernel.\n'
              '        if(current!=null && current.tick()==level.getGameTime())return current;\n'
              '        Map<LivingEntity,GeometryProvider> providers;\n'
              '        synchronized(PROVIDERS){providers=new IdentityHashMap<>(PROVIDERS);}\n'
              '        return rebuildSpatial(level,providers);\n'
              '    }\n'
              '    private static SpatialIndex rebuildSpatial(Level level,Map<LivingEntity,GeometryProvider> providers) {\n'
              '        Map<LivingEntity,FrameStamp> frames=new IdentityHashMap<>();\n'
              '        List<MaterialBroadphase.Entry<LivingEntity>> entries=new ArrayList<>();\n'
              '        for(var entry:providers.entrySet()) {\n'
              '            var support=entry.getKey();if(support.level()!=level)continue;\n'
              '            var sample=currentSnapshot(support,entry.getValue()).orElse(null);var frame=currentFrameStamp(support,entry.getValue());\n'
              '            if(sample==null || frame==null)continue;\n'
              '            AABB envelope=snapshotBounds(sample);if(envelope==null)continue;\n'
              '            entries.add(new MaterialBroadphase.Entry<>(support,envelope));frames.put(support,frame);\n'
              '        }\n'
              '        var built=MaterialBroadphase.build(entries,SUPPORT_ORDER,CELL_SIZE,MAX_INDEX_CELLS,MAX_INDEX_CELLS,MAX_INDEX_CANDIDATES);\n'
              '        for(var rejected:built.rejected()) {\n'
              '            frames.remove(rejected.key());\n'
              '            quarantineEndpoint(rejected.key());\n'
              '        }\n'
              '        var index=new SpatialIndex(level.getGameTime(),built.index(),Collections.unmodifiableMap(new IdentityHashMap<>(frames)));\n'
              '        SPATIAL.put(level,index);return index;\n'
              '    }\n'
              '    private static FrameStamp currentFrameStamp(LivingEntity support,GeometryProvider provider) {\n'
              '        if(provider==null)return null;\n'
              '        if(DESCRIPTORS.containsKey(support))return queryFrame(support).map(frame->new FrameStamp(frame.identity(),frame.root(),frame.snapshot().revision(),registrationGeneration(support),frame.endpoint().frameSerial())).orElse(null);\n'
              '        var sample=provider.sample(support).orElse(null);\n'
              '        return sample==null?null:new FrameStamp(null,observeRoot(support),sample.revision(),registrationGeneration(support),0);\n'
              '    }\n'
          )
          p.write_text(t[:start]+replacement+t[end:])
          PY
          git diff --check
          git diff -- src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java
      - name: commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java
          git commit -m 'fix(collision): keep live broadphase locality minimal'
          git push origin HEAD:chatgpt-editing
