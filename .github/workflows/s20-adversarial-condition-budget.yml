name: s20-adversarial-condition-budget

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s20-adversarial-condition-budget.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/pose/CitadelPoseProgram.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S20AdversarialConditionBudgetTests.java'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  condition-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S20 condition-budget holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S20AdversarialConditionBudgetTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: prove global condition budget
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/s20-condition-budget-proof
          ./gradlew runGameTest --console=plain \
            -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s20-condition-budget-proof/junit.xml" 2>&1 \
            | tee build/s20-condition-budget-proof/console.log
      - name: capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S20-adversarial-condition-budget
          path: |
            build/s20-condition-budget-proof/
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json
