name: s25-adversarial-reference-behavior

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s25-adversarial-reference-behavior.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMoveReferencePayload.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovementReference.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyTransportReceipts.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/runtime/TransportLedger.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S25AdversarialReferenceBehaviorTests.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S24TrackingAuthorityTestSeam.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/mixin/TestTrackingAuthorityMixin.java'
      - 'src/gametest/resources/scalebrews-test.mixins.json'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  reference-behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S25 reference behavior holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S25AdversarialReferenceBehaviorTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: compile S25 reference behavior holdout
        run: ./gradlew compileJava compileGametestJava --console=plain
      - name: run S25 reference behavior holdout
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s25-reference-behavior.xml"
      - name: capture S25 reference behavior evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S25-reference-behavior
          path: |
            build/s25-reference-behavior.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json

  mutation-kills:
    needs: reference-behavior
    strategy:
      fail-fast: false
      matrix:
        mutant:
          - exactly-once
          - tracking-generation
          - lifecycle-identity
          - expired-receipt
          - saturated-tick
          - non-controller
          - double-apply
          - fabricated-hit
          - rate-budget
          - pending-ttl
          - epoch-fence
          - dimension-fence
          - network-id-fence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew

      - name: isolate S25 reference behavior holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S25AdversarialReferenceBehaviorTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

      - name: apply directed ${{ matrix.mutant }} mutant
        shell: bash
        env:
          MUTATION: ${{ matrix.mutant }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          mutation=os.environ['MUTATION']
          receipts=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyTransportReceipts.java')
          refs=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovementReference.java')

          def replace(path,old,new,count=1):
              text=path.read_text()
              found=text.count(old)
              if found!=count:
                  raise SystemExit(f'{mutation}: target count for {path}: {found}, expected {count}')
              path.write_text(text.replace(old,new,count))

          if mutation=='exactly-once':
              replace(receipts,
                  ' || history.consumedTransportSequences.contains(match.transportSequence())',
                  '')

          elif mutation=='tracking-generation':
              replace(receipts,
                  'match.trackingGeneration()!=AnatomyRuntime.trackingGeneration(recipient,body)',
                  'false')
              replace(refs,
                  '''                || pending.trackingGeneration()!=AnatomyRuntime.trackingGeneration(player,body)''',
                  '''''')

          elif mutation=='lifecycle-identity':
              replace(receipts,'!match.epoch().equals(AnatomyNetworking.epoch(server))','false')
              replace(receipts,'match.catalogRevision()!=AnatomyNetworking.revision(server)','false')
              replace(receipts,'!match.dimension().equals(body.level().dimension().identifier())','false')
              replace(refs,'!pending.epoch().equals(AnatomyNetworking.epoch(server))','false')
              replace(refs,'pending.revision()!=AnatomyNetworking.revision(server)','false')
              replace(refs,'!pending.dimension().equals(body.level().dimension().identifier())','false')

          elif mutation=='expired-receipt':
              replace(receipts,'tick-HISTORY_TICKS+1','Long.MIN_VALUE',2)

          elif mutation=='saturated-tick':
              replace(receipts,'history.saturatedTicks.contains(match.tick())','false')

          elif mutation=='non-controller':
              replace(refs,' || root.getControllingPassenger()!=player','')

          elif mutation=='double-apply':
              replace(refs,
                  'Vec3 rebased=absolute.add(window.appliedDelta());',
                  'Vec3 rebased=absolute.add(window.appliedDelta()).add(TransportLedger.current(body).appliedDelta());')

          elif mutation=='fabricated-hit':
              replace(receipts,' && frameSerial.longValue()==supportFrameSerial','')
              replace(receipts,
                  'if(match!=null)return null; // Ambiguous provenance is never repaired by client metadata.\n                ',
                  '')

          elif mutation=='rate-budget':
              replace(refs,
                  'if(state.attempts>=MAX_REFERENCES_PER_TICK)return;',
                  'if(false)return;')

          elif mutation=='pending-ttl':
              replace(refs,
                  'if(pending.acceptedTick()>now || pending.acceptedTick()+PENDING_TICKS<now)return absolute;',
                  'if(pending.acceptedTick()>now || false)return absolute;')

          elif mutation=='epoch-fence':
              replace(receipts,
                  ' && receipt.epoch().equals(AnatomyNetworking.epoch(server))',
                  '')

          elif mutation=='dimension-fence':
              replace(receipts,
                  ' && receipt.dimension().equals(body.level().dimension().identifier())',
                  '')

          elif mutation=='network-id-fence':
              replace(receipts,
                  ' && receipt.bodyNetworkId()==body.getId()',
                  '')

          else:
              raise SystemExit(f'unknown mutation: {mutation}')
          PY

      - name: mutant must compile
        run: ./gradlew compileJava compileGametestJava --console=plain

      - name: behavior holdout must kill ${{ matrix.mutant }} mutant
        shell: bash
        env:
          MUTATION: ${{ matrix.mutant }}
        run: |
          set +e
          ./gradlew runGameTest --console=plain --rerun-tasks \
            -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s25-reference-$MUTATION-mutant.xml"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "SURVIVED: $MUTATION mutant passed the S25 reference behavior holdout"
            exit 1
          fi
          echo "KILLED: $MUTATION mutant"

      - name: capture ${{ matrix.mutant }} mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S25-reference-${{ matrix.mutant }}-mutant
          path: |
            build/s25-reference-*-mutant.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json

