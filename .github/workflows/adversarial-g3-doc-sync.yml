name: adversarial-g3-doc-sync

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/adversarial-g3-doc-sync.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
          fetch-depth: 0
      - name: sync final S16 and adversarial S17 evidence
        shell: python
        run: |
          from pathlib import Path
          import re

          # Canonical task state and compact gate summaries.
          plan = Path('docs/ENTITY_COLLISIONS_PLAN.md')
          text = plan.read_text()
          old_task = '3. [ ] consolidar `ModelPart` GeometryEngine;'
          new_task = '3. [x] consolidar `ModelPart` GeometryEngine;'
          if old_task in text:
              text = text.replace(old_task, new_task, 1)
          elif new_task not in text:
              raise SystemExit('G3 task 3 marker not found')

          old_s16 = ('**S16 cerrado tras reapertura adversarial:** el rojo post-cierre `e3e49ac2...` demostró que un selector variant del bridge eludía validación integral. '
                     '`5cff913349a4fc64921a81e0d8236e5aae235ac9` valida todos los bindings del candidato antes de resolver el selector runtime y conserva atómicamente snapshot+bundle ante rechazo. '
                     'La campaña posterior `d218adc84a0180e02dd5908114bacf010c4ee86e` añadió conflicto canonical↔legacy, round-trip variant y rechazo wire; quedó verde sin otro cambio productivo. '
                     'Evidencia final: ordinary `34753580865` **401/401** y focal `34753580858` **8/8**. G3 tarea 1 queda cerrada; permanecen abiertas 3–12.')
          new_s16 = ('**S16 cerrado tras reapertura adversarial:** el rojo post-cierre `e3e49ac2...` demostró que un selector variant del bridge eludía validación integral. '
                     '`5cff913349a4fc64921a81e0d8236e5aae235ac9` valida todos los bindings del candidato antes de resolver el selector runtime y conserva atómicamente snapshot+bundle ante rechazo. '
                     'La campaña final `eabd6ef31ee8f6ed4a7e4fffa873171339db508f` añadió conflicto canonical↔legacy, round-trip variant y rechazo wire completo con restauración client-style; quedó verde sin otro cambio productivo. '
                     'Evidencia final: ordinary `34753730671` **402/402** y focal `34753730753` **9/9**. G3 tarea 1 queda cerrada; permanecen abiertas 4–12 tras el cierre posterior de S17.')
          if old_s16 in text:
              text = text.replace(old_s16, new_s16, 1)
          elif new_s16 not in text:
              raise SystemExit('S16 summary paragraph not found')

          s17_summary = ('**S17 cerrado:** G3 tarea 3 queda cerrada. `scalebrews:model_part` está registrado en common mediante dispatcher server-safe y la implementación `ModelPartGeometryEngine` permanece client-only. '
                         'La campaña adversarial final `11824a121b669eeab7cd77704afad6bce4b0c254` endureció classloading, ownership del delegate, fallos de source/output, exclusiones `visible/skipDraw`, reproducibilidad y aislamiento entre fuentes sin requerir cambios de producción. '
                         'Evidencia: ordinary `34755126613` **407/407**; workflow focal `34755126630` con common **6/6**, client preparation verde y original-model/export verde, incluidas 640 comparaciones adicionales de familias vanilla. G3 continúa con tareas 4–12.')
          if '**S17 cerrado:**' not in text:
              anchor = new_s16 + '\n\n'
              if anchor not in text:
                  raise SystemExit('Could not locate S16 anchor for S17 summary')
              text = text.replace(anchor, anchor + s17_summary + '\n\n', 1)
          plan.write_text(text)

          # S16: preserve intermediate campaign, add the truly final wire holdout campaign.
          s16 = Path('docs/sprints/S16-canonical-catalog-authority.md')
          text = s16.read_text()
          seventh = '''### Séptima pasada adversarial — rechazo wire completo conserva la revisión aceptada

`eabd6ef31ee8f6ed4a7e4fffa873171339db508f` añadió `invalidWireReplacementRetainsAcceptedRevisionAfterClientStyleRejection`: primero acepta una revisión v4 válida, después entrega una revisión nueva completa y bien fragmentada cuyo binding variant referencia un modelo inexistente. El receptor debe rechazar el candidato sin avanzar `revision()` ni sustituir el `Snapshot`; tras `rejectPending()` debe volver a `READY` sobre el mismo objeto aceptado y la misma epoch.

La prueba pasa sin modificar producción. Esto cierra la diferencia entre demostrar atomicidad llamando directamente a `WorldAnatomyCatalog.replace(...)` y demostrarla atravesando la ruta de transferencia que usa el cliente.

'''
          if '### Séptima pasada adversarial — rechazo wire completo conserva la revisión aceptada' not in text:
              marker = '### Revisión final\n'
              if marker not in text:
                  raise SystemExit('S16 final review heading not found')
              text = text.replace(marker, seventh + marker, 1)

          final_block = '''## Evidencia final renovada

Último cambio productivo S16: `5cff913349a4fc64921a81e0d8236e5aae235ac9`. Snapshot final de evidencia adversarial: `eabd6ef31ee8f6ed4a7e4fffa873171339db508f`.

- ordinary run **34753730671**, job **103714474314**: **402/402 required GameTests passed**, `BUILD SUCCESSFUL`; artifact **10316763087**, SHA-256 **`5c2ee0b2f3673ec238ebced823cf32eee89efe2fa05cdc15c8295676ad1cf54a`**;
- focal S16 run **34753730753**, job **103714474664**: **9/9 required S16 GameTests passed**, `BUILD SUCCESSFUL`; artifact **10315833864**, SHA-256 **`5401316de24eb5db5c9be7ab63c81da1b01cb8d87ec739c3779c88852f8e5564`**;
- la campaña final añade el holdout wire completo sobre las pruebas de conflicto canonical↔legacy y round-trip variant de `d218adc...`; **no hubo cambios productivos posteriores a `5cff913...`**.

La evidencia `d218adc...` / 401/401 / 8/8 queda como campaña intermedia válida, pero ésta es la pasada que satisface el criterio final de cierre.

'''
          text, count = re.subn(r'## Evidencia final renovada\n.*?(?=## Criterio de cierre\n)', final_block, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not replace S16 final evidence block')
          s16.write_text(text)

          # S17: reflect implementation completion and record the independent adversarial campaign.
          s17 = Path('docs/sprints/S17-model-part-geometry-engine.md')
          text = s17.read_text()
          text = text.replace('Estado: **PLAN CERRADO / IMPLEMENTACIÓN PENDIENTE**.',
                              'Estado: **CERRADO — 2026-09-13, implementación + revisión adversarial final**.', 1)
          text = re.sub(r'- \[ \] \*\*I(\d+)\*\*', r'- [x] **I\1**', text)
          evidence = '''## Implementación y revisión adversarial final

La implementación convergió sobre la frontera prevista: `BuiltInGeometryEngines.MODEL_PART` registra en common un dispatcher neutral; `ModelPartGeometryEngine` y `ModelPartGeometryExtractor` viven sólo en client preparation; las fuentes son acotadas, deterministas y producen `ModelGeometry` formato 2 con version/model transform explícitos. `GeometryExtractor.vanilla(...)` reutiliza el extractor de familia y Alex permanece fuera de este engine.

La revisión adversarial posterior añadió, **sin tocar producción**, tres capas adicionales de holdouts:

- `6d658d0d6fa10b5d55266c1b8b12dfd03ee59b5b`: inspección del bytecode/constant pool de la frontera common, no sólo de firmas públicas, para impedir referencias a `net.minecraft.client`, Blaze3D o la implementación client preparation;
- `15eaa6cbb8a10f3329a47de58df46a7f7e0e94e6`: source nulo/exception, transform degenerado, aislamiento tras fallo, version+transform distintos sin stale reuse, exclusiones `visible=false`/`skipDraw`, include que no revive cosméticos, orden de snapshot e inmutabilidad del tooling registry;
- `11824a121b669eeab7cd77704afad6bce4b0c254`: ownership del delegate: reinstalar el mismo owner es idempotente, un segundo owner distinto falla y no roba el slot. El test restaura el estado global en `finally`.

Ningún holdout exigió cambiar código de producción. Por tanto la segunda lectura independiente termina en **cero cambios productivos**, como exige el criterio 6.

## Evidencia final

Snapshot adversarial final: `11824a121b669eeab7cd77704afad6bce4b0c254`.

- ordinary build run **34755126613**, job **103718098834**: **407/407 required GameTests passed**, `BUILD SUCCESSFUL`; artifact **10317615494**, SHA-256 **`93ce1322a6186ed211bb55dbfb6ba17de5b9d47a1f02ccf9df29f5ce9091dd0c`**;
- S17 focal run **34755126630**, common-boundary job **103718098895**: **6/6 required S17 common GameTests passed**, incluyendo fail-closed sin delegate, catálogo dedicated, firmas common, constant-pool client-free y ownership del delegate; artifact **10317310881**, SHA-256 **`3a1c2de697169e59256a75c4b78ea54d63820a1972d1ce70d0d2d99ed8598534`**;
- mismo run, client-preparation job **103718098982**: preparación real + holdouts de aislamiento/reproducibilidad/exclusiones verdes; artifact **10317930031**, SHA-256 **`501503b498e9cb3462b9ca7515839e4dd626ccc1dd15cd3f660830ca14c9b81a`**;
- mismo run, original-model-export job **103718098983**: `cow`, `player_wide` y `player_slim` exportados contra modelos/render transforms originales, 80 comparaciones animadas por familia principal y **640 comparaciones vanilla adicionales**; `BUILD SUCCESSFUL`; artifact **10316049789**, SHA-256 **`22fc133027782e612b388a53197737ef4bfbb198679a06eb44da39e4e0181d9c`**.

El ruido headless de narrator/flite, ALSA/OpenAL, Realms/auth y cursor X11 no cambia la conclusión de las lanes: todos los jobs finalizaron `success` y los proofs contractuales emitieron sus sentinels esperados.

'''
          if '## Implementación y revisión adversarial final' not in text:
              marker = '## Criterio de cierre\n'
              if marker not in text:
                  raise SystemExit('S17 closure criteria heading not found')
              text = text.replace(marker, evidence + marker, 1)
          s17.write_text(text)

          # VALIDATION is an evidence ledger, not task state. Append superseding evidence instead of rewriting history.
          validation = Path('docs/VALIDATION.md')
          text = validation.read_text()
          marker = '## G3 / S17 ModelPart GeometryEngine — CLOSED 2026-09-13'
          if marker not in text:
              text += f'''\n\n## G3 / S16 final-evidence correction — 2026-09-13\n\nThe previous S16 closure entry recorded the green intermediate campaign `d218adc...` (401/401 + 8/8). The true final adversarial snapshot is **`eabd6ef31ee8f6ed4a7e4fffa873171339db508f`**, after adding the complete invalid-wire replacement/`rejectPending()` holdout. Ordinary run **34753730671**, job **103714474314**, passed **402/402**; focal run **34753730753**, job **103714474664**, passed **9/9**. Artifacts: **10316763087** SHA-256 `5c2ee0b2f3673ec238ebced823cf32eee89efe2fa05cdc15c8295676ad1cf54a` and **10315833864** SHA-256 `5401316de24eb5db5c9be7ab63c81da1b01cb8d87ec739c3779c88852f8e5564`. No production change followed `5cff913...`; this correction supersedes only the closure evidence, not the historical intermediate run.\n\n{marker}\n\nFinal adversarial snapshot **`11824a121b669eeab7cd77704afad6bce4b0c254`**. The independent pass added no production code: it hardened common constant-pool/classloading checks, delegate single-owner semantics, client source/output failure isolation, version/transform freshness, structural `visible/skipDraw` exclusions, filter non-revival and deterministic immutable source snapshots.\n\nOrdinary run **34755126613**, job **103718098834**: **407/407 required GameTests**, `BUILD SUCCESSFUL`, artifact **10317615494**, SHA-256 `93ce1322a6186ed211bb55dbfb6ba17de5b9d47a1f02ccf9df29f5ce9091dd0c`. Focal run **34755126630**: common job **103718098895**, **6/6**; client preparation job **103718098982**, success; original-model-export job **103718098983**, success with cow/player exports, 80 animated comparisons per primary family and 640 additional vanilla-family comparisons. Artifacts respectively **10317310881** (`3a1c2de697169e59256a75c4b78ea54d63820a1972d1ce70d0d2d99ed8598534`), **10317930031** (`501503b498e9cb3462b9ca7515839e4dd626ccc1dd15cd3f660830ca14c9b81a`) and **10316049789** (`22fc133027782e612b388a53197737ef4bfbb198679a06eb44da39e4e0181d9c`).\n\nThis closes **G3 task 3**. G3 remains open for tasks 4–12.\n'''
          validation.write_text(text)
      - name: commit synchronized evidence and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/adversarial-g3-doc-sync.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ENTITY_COLLISIONS_PLAN.md docs/sprints/S16-canonical-catalog-authority.md docs/sprints/S17-model-part-geometry-engine.md docs/VALIDATION.md
          git commit -m 'docs(g3): close S17 with adversarial evidence'
          git push origin HEAD:chatgpt-editing
