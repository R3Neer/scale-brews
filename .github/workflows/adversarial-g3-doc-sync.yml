name: adversarial-g3-doc-sync

on:
  push:
    branches:
      - chatgpt-editing
    paths:
      - .github/workflows/adversarial-g3-doc-sync.yml

jobs:
  sync-docs:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
          fetch-depth: 0
      - name: Patch G3 evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          plan = Path('docs/ENTITY_COLLISIONS_PLAN.md')
          p = plan.read_text()
          p = p.replace('3. [ ] consolidar `ModelPart` GeometryEngine;', '3. [x] consolidar `ModelPart` GeometryEngine;', 1)
          stale = '**S16 cerrado tras reapertura adversarial:** el rojo post-cierre `e3e49ac2...` demostró que un selector variant del bridge eludía validación integral. `5cff913349a4fc64921a81e0d8236e5aae235ac9` valida todos los bindings del candidato antes de resolver el selector runtime y conserva atómicamente snapshot+bundle ante rechazo. La campaña posterior `d218adc84a0180e02dd5908114bacf010c4ee86e` añadió conflicto canonical↔legacy, round-trip variant y rechazo wire; quedó verde sin otro cambio productivo. Evidencia final: ordinary `34753580865` **401/401** y focal `34753580858` **8/8**. G3 tarea 1 queda cerrada; permanecen abiertas 3–12.'
          final16 = '**S16 cerrado tras reapertura adversarial:** el rojo post-cierre `e3e49ac2...` demostró que un selector variant del bridge eludía validación integral. `5cff913349a4fc64921a81e0d8236e5aae235ac9` valida todos los bindings del candidato antes de resolver el selector runtime y conserva atómicamente snapshot+bundle ante rechazo. La campaña final `eabd6ef31ee8f6ed4a7e4fffa873171339db508f` añadió conflicto canonical↔legacy, round-trip variant y rechazo wire completo con restauración client-style; quedó verde sin otro cambio productivo. Evidencia final: ordinary `34753730671` **402/402** y focal `34753730753` **9/9**. G3 tarea 1 queda cerrada.'
          if stale in p:
              p = p.replace(stale, final16, 1)
          elif final16 not in p:
              raise SystemExit('S16 plan summary not found')
          s17line = '**S17 cerrado:** G3 tarea 3 queda cerrada. `scalebrews:model_part` usa dispatcher common server-safe y preparación `ModelPart` client-only. La campaña adversarial final `11824a121b669eeab7cd77704afad6bce4b0c254` añadió classloading/constant-pool, ownership del delegate, aislamiento ante fallos, exclusiones estructurales y reproducibilidad sin cambios de producción. Evidencia: ordinary `34755126613` **407/407**; focal `34755126630`: common **6/6**, client preparation verde y original-model/export verde con 640 comparaciones vanilla adicionales. G3 continúa con tareas 4–12.'
          if '**S17 cerrado:**' not in p:
              p = p.replace(final16 + '\n\n', final16 + '\n\n' + s17line + '\n\n', 1)
          plan.write_text(p)

          s16 = Path('docs/sprints/S16-canonical-catalog-authority.md')
          s = s16.read_text()
          if '### Séptima pasada adversarial — rechazo wire completo conserva la revisión aceptada' not in s:
              seventh = '''### Séptima pasada adversarial — rechazo wire completo conserva la revisión aceptada

`eabd6ef31ee8f6ed4a7e4fffa873171339db508f` añadió `invalidWireReplacementRetainsAcceptedRevisionAfterClientStyleRejection`: una revisión v4 válida queda aceptada, una revisión posterior completa pero inválida debe fallar sin avanzar `revision()` ni sustituir el `Snapshot`, y `rejectPending()` debe recuperar `READY` sobre el mismo snapshot y epoch. El holdout pasa sin modificar producción.

'''
              s = s.replace('### Revisión final\n', seventh + '### Revisión final\n', 1)
          final_block = '''## Evidencia final renovada

Último cambio productivo S16: `5cff913349a4fc64921a81e0d8236e5aae235ac9`. Snapshot final adversarial: `eabd6ef31ee8f6ed4a7e4fffa873171339db508f`.

- ordinary **34753730671** / job **103714474314**: **402/402**, `BUILD SUCCESSFUL`; artifact **10316763087**, SHA-256 `5c2ee0b2f3673ec238ebced823cf32eee89efe2fa05cdc15c8295676ad1cf54a`;
- focal S16 **34753730753** / job **103714474664**: **9/9**, `BUILD SUCCESSFUL`; artifact **10315833864**, SHA-256 `5401316de24eb5db5c9be7ab63c81da1b01cb8d87ec739c3779c88852f8e5564`;
- la campaña final añade el holdout wire completo sobre la campaña intermedia `d218adc...`; no hubo cambios productivos posteriores a `5cff913...`.

La evidencia 401/401 + 8/8 se conserva como campaña intermedia; ésta es la evidencia final de cierre.

'''
          s, n = re.subn(r'## Evidencia final renovada\n.*?(?=## Criterio de cierre\n)', final_block, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('S16 evidence block not found')
          s16.write_text(s)

          s17 = Path('docs/sprints/S17-model-part-geometry-engine.md')
          s = s17.read_text()
          s = s.replace('Estado: **PLAN CERRADO / IMPLEMENTACIÓN PENDIENTE**.', 'Estado: **CERRADO — 2026-09-13, implementación + revisión adversarial final**.', 1)
          s = re.sub(r'- \[ \] \*\*I(\d+)\*\*', r'- [x] **I\1**', s)
          if '## Evidencia adversarial final' not in s:
              evidence = '''## Evidencia adversarial final

Snapshot final: `11824a121b669eeab7cd77704afad6bce4b0c254`. La segunda lectura añadió únicamente tests: escaneo de constant-pool common, ownership único del delegate, fallos de source/output, transform degenerado, aislamiento sin stale reuse, version/transform distintos, `visible=false`/`skipDraw`, no-revival por include y snapshot determinista/inmutable. Ningún holdout exigió cambiar producción.

- ordinary **34755126613** / job **103718098834**: **407/407**, `BUILD SUCCESSFUL`; artifact **10317615494**, SHA-256 `93ce1322a6186ed211bb55dbfb6ba17de5b9d47a1f02ccf9df29f5ce9091dd0c`;
- focal **34755126630**, common **103718098895**: **6/6**, artifact **10317310881**, SHA-256 `3a1c2de697169e59256a75c4b78ea54d63820a1972d1ce70d0d2d99ed8598534`;
- client preparation **103718098982**: success, artifact **10317930031**, SHA-256 `501503b498e9cb3462b9ca7515839e4dd626ccc1dd15cd3f660830ca14c9b81a`;
- original-model/export **103718098983**: success; cow/player wide/player slim, 80 comparaciones animadas por familia principal y **640 comparaciones vanilla adicionales**; artifact **10316049789**, SHA-256 `22fc133027782e612b388a53197737ef4bfbb198679a06eb44da39e4e0181d9c`.

'''
              s = s.replace('## Criterio de cierre\n', evidence + '## Criterio de cierre\n', 1)
          s17.write_text(s)

          validation = Path('docs/VALIDATION.md')
          v = validation.read_text()
          if '## G3 / S17 ModelPart GeometryEngine — CLOSED 2026-09-13' not in v:
              v += '''\n\n## G3 / S16 final-evidence correction — 2026-09-13\n\nThe final S16 snapshot is `eabd6ef31ee8f6ed4a7e4fffa873171339db508f`, not the intermediate `d218adc...`: ordinary `34753730671` passed **402/402** and focal `34753730753` passed **9/9** after the complete invalid-wire replacement/`rejectPending()` holdout. No production change followed `5cff913...`.\n\n## G3 / S17 ModelPart GeometryEngine — CLOSED 2026-09-13\n\nFinal adversarial snapshot `11824a121b669eeab7cd77704afad6bce4b0c254`. Ordinary `34755126613` / `103718098834`: **407/407**. Focal `34755126630`: common `103718098895` **6/6**, client preparation `103718098982` success, original-model/export `103718098983` success with 640 additional vanilla-family comparisons. The final adversarial additions changed tests only; production required no further patch. G3 task 3 is closed; tasks 4–12 remain open.\n'''
          validation.write_text(v)
          PY
      - name: Commit synchronized docs
        run: |
          set -euo pipefail
          git rm .github/workflows/adversarial-g3-doc-sync.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ENTITY_COLLISIONS_PLAN.md docs/sprints/S16-canonical-catalog-authority.md docs/sprints/S17-model-part-geometry-engine.md docs/VALIDATION.md
          git commit -m 'docs(g3): close S17 with adversarial evidence'
          git push origin HEAD:chatgpt-editing
