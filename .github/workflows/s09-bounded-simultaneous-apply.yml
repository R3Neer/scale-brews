name: s09-bounded-simultaneous-apply

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s09-bounded-simultaneous-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout branch snapshot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - name: apply bounded simultaneous window strategy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/physics/TemporalResponse.java')
          s=p.read_text()
          old_const='''    private static final int MAX_Q_PROJECTIONS=4,MAX_BISECTIONS=8,PROBE_QUERY_BUDGET=8,POST_CONTACT_PROBE_BUDGET=16,\n        MIDPOINT_CONTACT_PROBE_BUDGET=80,SCREEN_DEPTH=8;'''
          new_const='''    private static final int MAX_Q_PROJECTIONS=4,MAX_BISECTIONS=8,PROBE_QUERY_BUDGET=8,\n        MIDPOINT_CONTACT_PROBE_BUDGET=80,SCREEN_DEPTH=8;'''
          if s.count(old_const)!=1:
              raise SystemExit(f'constant target count={s.count(old_const)}')
          s=s.replace(old_const,new_const)

          old='''            // Screening is only for unknown candidates. Once a piece is active, its relevance has\n            // already been established; re-screening it would repeatedly tax the same real contact.\n            // After a manifold exists, a slightly wider exact probe lets short post-contact windows\n            // finish directly instead of paying probe + conservative screening for harmless pieces.\n            // The evaluations still debit the same shared response budget; no piece is skipped.\n            int probeBudget=!Double.isFinite(earliest) && midpointOverlapping.contains(id)\n                ?MIDPOINT_CONTACT_PROBE_BUDGET:!active.isEmpty()?POST_CONTACT_PROBE_BUDGET:PROBE_QUERY_BUDGET;\n            var result=constraint==null?firstForPiece(body,queryDelta,interval,budget,probeBudget):budget.query(body,queryDelta,interval);'''
          new='''            // Before the first hit, an unknown piece still needs the full temporal screening path.\n            // Once earliest is known, the horizon above is already the complete simultaneous-contact\n            // window that can change this event. Query every remaining piece exactly in that bounded\n            // window instead of paying probe + whole-trajectory screening again. The same shared\n            // response budget still pays every CCD and no piece is skipped.\n            ConservativeSweep.Result result;\n            if(constraint!=null || Double.isFinite(earliest)) {\n                result=budget.query(body,queryDelta,interval);\n            } else {\n                int probeBudget=midpointOverlapping.contains(id)\n                    ?MIDPOINT_CONTACT_PROBE_BUDGET:PROBE_QUERY_BUDGET;\n                result=firstForPiece(body,queryDelta,interval,budget,probeBudget);\n            }'''
          if s.count(old)!=1:
              raise SystemExit(f'query target count={s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git diff -- src/main/java/io/github/r3neer/scalebrews/collision/physics/TemporalResponse.java
      - name: compile production source
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava
      - name: commit production fix without overwriting concurrent solver work
        shell: bash
        run: |
          target='src/main/java/io/github/r3neer/scalebrews/collision/physics/TemporalResponse.java'
          base="$(git rev-parse HEAD)"
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add "$target"
          git commit -m 'fix(s09): query bounded simultaneous windows directly'
          git fetch origin chatgpt-editing
          remote="$(git rev-parse origin/chatgpt-editing)"
          if [ "$base" != "$remote" ]; then
            if ! git diff --quiet "$base" "$remote" -- "$target"; then
              echo 'TemporalResponse changed concurrently; refusing to rebase the generated fix.' >&2
              exit 1
            fi
            git rebase origin/chatgpt-editing
          fi
          git push origin HEAD:chatgpt-editing
