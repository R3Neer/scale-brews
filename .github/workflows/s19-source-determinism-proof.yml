name: s19-source-determinism-proof

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s19-source-determinism-proof.yml'
      - 'tools/s19-external-inputs.lock.json'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryEngine.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryExtractor.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S19SourceDeterminismClientProof.java'
  workflow_dispatch:

jobs:
  source-determinism:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew

      - name: resolve pinned S19 external inputs
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/s19-source-determinism-inputs"
          mkdir -p "$probe"
          python3 - "$probe" <<'PY'
          import json, pathlib, sys
          probe = pathlib.Path(sys.argv[1])
          lock = json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          if lock.get('schema') != 1 or lock.get('minecraft') != '26.2':
              raise SystemExit('Unexpected S19 external input lock')
          inputs = lock.get('inputs')
          if not isinstance(inputs, list) or sorted(item.get('modId') for item in inputs) != ['alexsmobs', 'cloth-config', 'codxlib']:
              raise SystemExit('Unexpected S19 external input set')
          deps = '\n'.join(f"    proofInputs '{item['coordinate']}'" for item in inputs)
          (probe / 'settings.gradle').write_text("rootProject.name = 's19-source-determinism-inputs'\n")
          (probe / 'build.gradle').write_text(f"""repositories {{
              maven {{ url = 'https://cursemaven.com/'; content {{ includeGroup 'curse.maven' }} }}
          }}
          configurations {{ proofInputs {{ canBeConsumed = false; canBeResolved = true; transitive = false }} }}
          dependencies {{
          {deps}
          }}
          tasks.register('copyProofInputs', Copy) {{
              from configurations.proofInputs
              into layout.buildDirectory.dir('proof-inputs')
          }}
          """)
          PY
          ./gradlew -p "$probe" copyProofInputs --console=plain
          mkdir -p build/s19-source-determinism/mods
          cp "$probe"/build/proof-inputs/*.jar build/s19-source-determinism/mods/
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          lock = json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          mods = pathlib.Path('build/s19-source-determinism/mods')
          for item in lock['inputs']:
              _, artifact, version = item['coordinate'].split(':')
              jar = mods / f'{artifact}-{version}.jar'
              if not jar.is_file():
                  raise SystemExit(f'Missing pinned proof jar {jar.name}')
              actual = hashlib.sha256(jar.read_bytes()).hexdigest()
              if actual != item['sha256']:
                  raise SystemExit(f'Pinned input hash mismatch for {jar.name}: {actual}')
              with zipfile.ZipFile(jar) as archive:
                  metadata = json.loads(archive.read('fabric.mod.json'))
              if metadata.get('id') != item['modId'] or str(metadata.get('version')) != item['version']:
                  raise SystemExit(f'Pinned input identity mismatch for {jar.name}')
          PY

      - name: isolate source determinism client proof
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S19SourceDeterminismClientProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

      - name: run source determinism proof
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-source-determinism/mods" \
            2>&1 | tee build/s19-source-determinism/normal.log
          mkdir -p build/s19-source-determinism/logs-normal
          cp -r build/run/clientGameTest/logs/. build/s19-source-determinism/logs-normal/ || true

      - name: require reused-model-identity guard mutant to die
        shell: bash
        run: |
          set -euo pipefail
          file='src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryEngine.java'
          python3 - "$file" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); text=p.read_text()
          old='''            if (firstModel == secondModel)\n                throw new IllegalArgumentException("AdvancedModelBox source factory reused mutable model identity");'''
          new='''            if (false && firstModel == secondModel)\n                throw new IllegalArgumentException("AdvancedModelBox source factory reused mutable model identity"); // adversarial mutant'''
          if text.count(old) != 1:
              raise SystemExit('S19 reused-identity mutation target drifted')
          p.write_text(text.replace(old,new,1))
          PY
          rm -rf build/run/clientGameTest
          set +e
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-source-determinism/mods" \
            2>&1 | tee build/s19-source-determinism/reused-identity-mutant.log
          code=${PIPESTATUS[0]}
          set -e
          mkdir -p build/s19-source-determinism/logs-reused-mutant
          cp -r build/run/clientGameTest/logs/. build/s19-source-determinism/logs-reused-mutant/ || true
          if [ "$code" -eq 0 ]; then
            echo 'S19 reused-model-identity mutant survived.' >&2
            exit 1
          fi
          if ! grep -R -F 'S19 reused model identity was accepted' \
              build/run/clientGameTest/logs build/s19-source-determinism/reused-identity-mutant.log >/dev/null 2>&1; then
            echo 'S19 reused-model-identity mutant died for a non-causal reason.' >&2
            exit 1
          fi
          git checkout -- "$file"

      - name: require geometry-determinism guard mutant to die
        shell: bash
        run: |
          set -euo pipefail
          file='src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryEngine.java'
          python3 - "$file" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); text=p.read_text()
          old='''            if (!firstGeometry.equals(secondGeometry) || !first.omissions().equals(second.omissions()))\n                throw new IllegalArgumentException("AdvancedModelBox source factory is not deterministic");'''
          new='''            if (!first.omissions().equals(second.omissions()))\n                throw new IllegalArgumentException("AdvancedModelBox source factory is not deterministic"); // adversarial mutant: geometry drift ignored'''
          if text.count(old) != 1:
              raise SystemExit('S19 geometry-determinism mutation target drifted')
          p.write_text(text.replace(old,new,1))
          PY
          rm -rf build/run/clientGameTest
          set +e
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-source-determinism/mods" \
            2>&1 | tee build/s19-source-determinism/geometry-mutant.log
          code=${PIPESTATUS[0]}
          set -e
          mkdir -p build/s19-source-determinism/logs-geometry-mutant
          cp -r build/run/clientGameTest/logs/. build/s19-source-determinism/logs-geometry-mutant/ || true
          if [ "$code" -eq 0 ]; then
            echo 'S19 geometry-determinism mutant survived.' >&2
            exit 1
          fi
          if ! grep -R -F 'S19 alternating fresh model geometry was accepted' \
              build/run/clientGameTest/logs build/s19-source-determinism/geometry-mutant.log >/dev/null 2>&1; then
            echo 'S19 geometry-determinism mutant died for a non-causal reason.' >&2
            exit 1
          fi
          git checkout -- "$file"

      - name: require caller-owned transform reference mutant to die
        shell: bash
        run: |
          set -euo pipefail
          file='src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryEngine.java'
          python3 - "$file" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); text=p.read_text()
          old='''        Matrix4f copy = new Matrix4f(supplied);'''
          new='''        Matrix4f copy = supplied; // adversarial mutant: caller-owned mutable transform retained by reference'''
          if text.count(old) != 1:
              raise SystemExit('S19 transform-copy mutation target drifted')
          p.write_text(text.replace(old,new,1))
          PY
          rm -rf build/run/clientGameTest
          set +e
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-source-determinism/mods" \
            2>&1 | tee build/s19-source-determinism/transform-reference-mutant.log
          code=${PIPESTATUS[0]}
          set -e
          mkdir -p build/s19-source-determinism/logs-transform-reference-mutant
          cp -r build/run/clientGameTest/logs/. build/s19-source-determinism/logs-transform-reference-mutant/ || true
          if [ "$code" -eq 0 ]; then
            echo 'S19 caller-owned transform reference mutant survived.' >&2
            exit 1
          fi
          if ! grep -R -F 'S19 unstable model transform was accepted' \
              build/run/clientGameTest/logs build/s19-source-determinism/transform-reference-mutant.log >/dev/null 2>&1; then
            echo 'S19 caller-owned transform reference mutant died for a non-causal reason.' >&2
            exit 1
          fi
          git checkout -- "$file"

      - name: require insertion-order source registry mutant to die
        shell: bash
        run: |
          set -euo pipefail
          file='src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryEngine.java'
          python3 - "$file" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); text=p.read_text()
          old='''    private final Map<Identifier, Source> sources = new TreeMap<>(Comparator.comparing(Identifier::toString));'''
          new='''    private final Map<Identifier, Source> sources = new LinkedHashMap<>(); // adversarial mutant: public view follows insertion history'''
          if text.count(old) != 1:
              raise SystemExit('S19 source-order mutation target drifted')
          p.write_text(text.replace(old,new,1))
          PY
          rm -rf build/run/clientGameTest
          set +e
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-source-determinism/mods" \
            2>&1 | tee build/s19-source-determinism/source-order-mutant.log
          code=${PIPESTATUS[0]}
          set -e
          mkdir -p build/s19-source-determinism/logs-source-order-mutant
          cp -r build/run/clientGameTest/logs/. build/s19-source-determinism/logs-source-order-mutant/ || true
          if [ "$code" -eq 0 ]; then
            echo 'S19 insertion-order source registry mutant survived.' >&2
            exit 1
          fi
          if ! grep -R -F 'S19 source registry view depends on registration order' \
              build/run/clientGameTest/logs build/s19-source-determinism/source-order-mutant.log >/dev/null 2>&1; then
            echo 'S19 insertion-order source registry mutant died for a non-causal reason.' >&2
            exit 1
          fi
          git checkout -- "$file"

      - name: capture source determinism evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S19-source-determinism-proof
          path: |
            build/s19-source-determinism/*.log
            build/s19-source-determinism/logs-normal/
            build/s19-source-determinism/logs-reused-mutant/
            build/s19-source-determinism/logs-geometry-mutant/
            build/s19-source-determinism/logs-transform-reference-mutant/
            build/s19-source-determinism/logs-source-order-mutant/
            build/resources/gametest/fabric.mod.json
            tools/s19-external-inputs.lock.json
