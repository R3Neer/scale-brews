name: s27-implementer-observer-recertification

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s27-implementer-observer-recertification.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/platform/Platforms.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S00ObserverBoundaryTests.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S27LateObserverPresentationClientProof.java'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  late-observer-after-friction-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S27 late observer proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=[
            'io.github.r3neer.scalebrews.test.S27LateObserverPresentationClientProof'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run late observer after friction owner fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/s27-implementer-observer
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            2>&1 | tee build/s27-implementer-observer/client.log
          grep -R -F 'S27_LATE_OBSERVER PASS' \
            build/run/clientGameTest/logs build/s27-implementer-observer/client.log >/dev/null
      - name: capture implementer recertification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S27-implementer-observer-recertification
          path: |
            build/s27-implementer-observer/client.log
            build/run/clientGameTest/logs/
            build/resources/gametest/fabric.mod.json
