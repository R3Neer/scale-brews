name: s19-advanced-model-box-proof

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s19-advanced-model-box-proof.yml'
      - 'tools/s19-external-inputs.lock.json'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'src/main/resources/fabric.mod.json'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/api/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/catalog/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/data/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/geometry/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/BuiltInGeometryEngines.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/**'
      - 'src/client/java/io/github/r3neer/scalebrews/client/ScaleBrewsClient.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S19AdvancedModelBoxGeometryContractTests.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S19*'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/AnatomyExportProof.java'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  common-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S19 common contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=['io.github.r3neer.scalebrews.collision.internal.S19AdvancedModelBoxGeometryContractTests']
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run common/dedicated family contract
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s19-common-junit.xml"
      - name: capture common evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S19-advanced-model-box-common-proof
          path: |
            build/s19-common-junit.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json

  external-input-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: verify external family remains optional in ordinary metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('src/main/resources/fabric.mod.json').read_text())
          depends = set((metadata.get('depends') or {}).keys())
          forbidden = {'alexsmobs', 'codxlib', 'cloth-config'}
          leaked = sorted(depends & forbidden)
          if leaked:
              raise SystemExit('S19 external proof mods became mandatory fabric.mod.json dependencies: ' + ', '.join(leaked))
          print('S19 ordinary metadata keeps Alex/Codx/Cloth optional')
          PY
      - name: verify ordinary Gradle classpaths exclude external family jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/s19-external-inputs
          for configuration in compileClasspath runtimeClasspath clientCompileClasspath clientRuntimeClasspath; do
            output="build/s19-external-inputs/${configuration}.txt"
            ./gradlew dependencies --configuration "$configuration" --console=plain > "$output"
          done
          pattern='curse\.maven|alexs-mobs-continued|alexsmobs|codxlib|cloth-config'
          if grep -Eiq "$pattern" build/s19-external-inputs/*Classpath.txt; then
            echo 'S19 ordinary Gradle classpath unexpectedly contains an external proof mod'
            grep -Ein "$pattern" build/s19-external-inputs/*Classpath.txt || true
            exit 1
          fi
          echo 'S19 ordinary main/client compile/runtime classpaths exclude external proof mods'
      - name: validate lock and build isolated resolver
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/s19-external-inputs"
          mkdir -p "$probe"
          python3 - "$probe" <<'PY'
          import json, pathlib, sys
          probe = pathlib.Path(sys.argv[1])
          lock = json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          if lock.get('schema') != 1 or lock.get('minecraft') != '26.2':
              raise SystemExit('Unsupported S19 external input lock schema or Minecraft version')
          inputs = lock.get('inputs')
          if not isinstance(inputs, list) or len(inputs) != 3:
              raise SystemExit('S19 external input lock must contain exactly three pinned proof inputs')
          ids = [item.get('modId') for item in inputs]
          if sorted(ids) != ['alexsmobs', 'cloth-config', 'codxlib'] or len(set(ids)) != len(ids):
              raise SystemExit(f'Unexpected or duplicate S19 proof mod ids: {ids}')
          coordinates = [item.get('coordinate') for item in inputs]
          if len(set(coordinates)) != len(coordinates):
              raise SystemExit('Duplicate CurseMaven coordinates in S19 lock')
          for item in inputs:
              sha = item.get('sha256', '')
              if len(sha) != 64 or any(c not in '0123456789abcdef' for c in sha):
                  raise SystemExit(f"Invalid SHA-256 in S19 lock for {item.get('modId')}")
          deps = '\n'.join(f"    proofInputs '{item['coordinate']}'" for item in inputs)
          (probe / 'settings.gradle').write_text("rootProject.name = 's19-external-inputs'\n")
          (probe / 'build.gradle').write_text(f"""repositories {{
              maven {{
                  url = 'https://cursemaven.com/'
                  content {{ includeGroup 'curse.maven' }}
              }}
          }}
          configurations {{
              proofInputs {{
                  canBeConsumed = false
                  canBeResolved = true
                  transitive = false
              }}
          }}
          dependencies {{
          {deps}
          }}
          tasks.register('copyProofInputs', Copy) {{
              from configurations.proofInputs
              into layout.buildDirectory.dir('proof-inputs')
          }}
          """)
          PY
          ./gradlew -p "$probe" copyProofInputs --console=plain
          mkdir -p build/s19-external-inputs/mods
          cp "$probe"/build/proof-inputs/*.jar build/s19-external-inputs/mods/
      - name: verify pinned hashes and mod identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          lock = json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          mods = pathlib.Path('build/s19-external-inputs/mods')
          manifest = pathlib.Path('build/s19-external-inputs/manifest.txt')
          lines = []
          for item in lock['inputs']:
              group, artifact, version = item['coordinate'].split(':')
              if group != 'curse.maven':
                  raise SystemExit(f"Unexpected Maven group in lock: {item['coordinate']}")
              jar = mods / f'{artifact}-{version}.jar'
              if not jar.is_file():
                  raise SystemExit(f'Missing resolved proof input: {jar.name}')
              actual_sha = hashlib.sha256(jar.read_bytes()).hexdigest()
              if actual_sha != item['sha256']:
                  raise SystemExit(f"SHA-256 mismatch for {jar.name}: expected {item['sha256']}, got {actual_sha}")
              with zipfile.ZipFile(jar) as archive:
                  metadata = json.loads(archive.read('fabric.mod.json'))
              if metadata.get('id') != item['modId']:
                  raise SystemExit(f"mod id mismatch for {jar.name}: {metadata.get('id')} != {item['modId']}")
              if str(metadata.get('version')) != item['version']:
                  raise SystemExit(f"mod version mismatch for {jar.name}: {metadata.get('version')} != {item['version']}")
              lines.append('\t'.join((jar.name, item['modId'], item['version'], actual_sha)))
          if len(list(mods.glob('*.jar'))) != len(lock['inputs']):
              raise SystemExit('Resolver produced unpinned extra jars')
          manifest.write_text('\n'.join(lines) + '\n')
          print(manifest.read_text(), end='')
          PY
      - name: capture pinned input evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S19-external-input-contract
          path: |
            tools/s19-external-inputs.lock.json
            build/s19-external-inputs/manifest.txt
            build/s19-external-inputs/mods/*.jar
            build/s19-external-inputs/compileClasspath.txt
            build/s19-external-inputs/runtimeClasspath.txt
            build/s19-external-inputs/clientCompileClasspath.txt
            build/s19-external-inputs/clientRuntimeClasspath.txt

  client-real-model-proof:
    needs: external-input-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - uses: actions/download-artifact@v7
        with:
          name: S19-external-input-contract
          path: .
      - name: isolate S19 real-model client proof
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S19AdvancedModelBoxClientProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run pinned Grizzly and Gazelle proof
        run: xvfb-run -a ./gradlew runClientGameTest --console=plain -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-external-inputs/mods"
      - name: capture real-model evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S19-advanced-model-box-real-client-proof
          path: |
            build/run/clientGameTest/logs/
            build/resources/gametest/fabric.mod.json

  model-transform-mutant:
    needs: external-input-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - uses: actions/download-artifact@v7
        with:
          name: S19-external-input-contract
          path: .
      - name: isolate S19 real-model client proof
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S19AdvancedModelBoxClientProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: inject lost-modelTransform mutant in checkout only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryEngine.java')
          text=p.read_text()
          old='''            ModelGeometry firstGeometry = first.geometry().withModelTransform(firstTransform);\n            ModelGeometry secondGeometry = second.geometry().withModelTransform(secondTransform);'''
          new='''            ModelGeometry firstGeometry = first.geometry().withModelTransform(new Matrix4f());\n            ModelGeometry secondGeometry = second.geometry().withModelTransform(new Matrix4f());'''
          if text.count(old) != 1:
              raise SystemExit('S19 modelTransform mutant target drifted; refusing a non-causal mutation')
          p.write_text(text.replace(old,new))
          print('Injected S19 lost-modelTransform mutant into ephemeral checkout')
          PY
      - name: require real-model proof to kill modelTransform mutant
        shell: bash
        run: |
          set +e
          xvfb-run -a ./gradlew runClientGameTest --console=plain -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-external-inputs/mods" > build/s19-model-transform-mutant.log 2>&1
          status=$?
          set -e
          cat build/s19-model-transform-mutant.log
          if [ "$status" -eq 0 ]; then
            echo 'S19 modelTransform mutant survived: real-model oracle did not detect lost external transform'
            exit 1
          fi
          if ! grep -Fq 'serialized concrete renderer modelTransform mismatch' build/s19-model-transform-mutant.log; then
            echo 'S19 modelTransform mutant died for a non-causal reason'
            exit 1
          fi
          echo 'S19 modelTransform mutant killed causally by independent renderer-transform oracle'
      - name: capture mutant evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S19-model-transform-mutant-proof
          path: build/s19-model-transform-mutant.log
