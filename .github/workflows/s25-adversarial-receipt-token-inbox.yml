name: s25-adversarial-receipt-token-inbox

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s25-adversarial-receipt-token-inbox.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyReceiptTokenInbox.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S25ReceiptTokenInboxTests.java'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  inbox-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S25 receipt-token inbox tests
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=['io.github.r3neer.scalebrews.collision.internal.S25ReceiptTokenInboxTests']
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run bounded receipt-token inbox
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s25-receipt-token-inbox.xml"
      - name: capture inbox evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S25-receipt-token-inbox
          path: |
            build/s25-receipt-token-inbox.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json

  body-bound-mutant-must-die:
    needs: inbox-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate inbox tests
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=['io.github.r3neer.scalebrews.collision.internal.S25ReceiptTokenInboxTests']
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: remove MAX_BODIES admission fence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyReceiptTokenInbox.java')
          s=p.read_text()
          old='if(tokens.size()>=MAX_BODIES)return false;'
          new='if(false)return false;'
          count=s.count(old)
          if count!=1: raise SystemExit(f'mutation target count: {count}, expected 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileGametestJava --console=plain
      - name: bound oracle must kill mutant
        shell: bash
        run: |
          set +e
          ./gradlew runGameTest --console=plain --rerun-tasks
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: receipt-token inbox exceeded MAX_BODIES'
            exit 1
          fi
          echo 'KILLED: MAX_BODIES omission'

  generation-mutant-must-die:
    needs: inbox-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate inbox tests
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=['io.github.r3neer.scalebrews.collision.internal.S25ReceiptTokenInboxTests']
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: admit retired tracking generation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyReceiptTokenInbox.java')
          s=p.read_text()
          old='if(packet.trackingGeneration()<generation)return false;'
          new='if(false)return false;'
          count=s.count(old)
          if count!=1: raise SystemExit(f'mutation target count: {count}, expected 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileGametestJava --console=plain
      - name: generation oracle must kill mutant
        shell: bash
        run: |
          set +e
          ./gradlew runGameTest --console=plain --rerun-tasks
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: retired tracking generation re-entered receipt-token inbox'
            exit 1
          fi
          echo 'KILLED: retired tracking-generation admission'

  ttl-mutant-must-die:
    needs: inbox-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate inbox tests
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=['io.github.r3neer.scalebrews.collision.internal.S25ReceiptTokenInboxTests']
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: disable receipt-token TTL expiry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyReceiptTokenInbox.java')
          s=p.read_text()
          old='return token.tick()<now && now-token.tick()>=AnatomyTransportReceipts.HISTORY_TICKS;'
          new='return false;'
          count=s.count(old)
          if count!=1: raise SystemExit(f'mutation target count: {count}, expected 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileGametestJava --console=plain
      - name: TTL oracle must kill mutant
        shell: bash
        run: |
          set +e
          ./gradlew runGameTest --console=plain --rerun-tasks
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: stale receipt token never expired'
            exit 1
          fi
          echo 'KILLED: receipt-token TTL omission'
