name: s18-finalize-docs

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s18-finalize-docs.yml'

permissions:
  contents: write

jobs:
  finalize-s18-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: close S18/G3.4 documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          decode=lambda s: base64.b64decode(s).decode()
          sprint_append=decode('')
          plan_replacement=decode('')
          validation_append=decode('')
          p=Path('docs/sprints/S18-vanilla-pose-keyframe-engine.md'); t=p.read_text(); old='Estado: **REABIERTO / G3.4 PENDIENTE POR PARIDAD MOJANG**.'; assert old in t; t=t.replace(old,'Estado: **CERRADO / G3.4 COMPLETADO TRAS REAPERTURA ADVERSARIAL**.',1); t=t.replace('Clasificación TM actual: **gap de arquitectura/modelo de datos en la frontera geometry↔pose de `mojang_keyframes`**.','Clasificación TM en esa reapertura: **gap de arquitectura/modelo de datos en la frontera geometry↔pose de `mojang_keyframes`**.',1); t=t.replace('Por tanto **G3.4 permanece abierto**. El cierre histórico no autoriza avanzar el estado global como si esta paridad estuviera resuelta, y S19/G3.5 no puede declararse cerrado por delante de esta dependencia.','En ese punto **G3.4 quedó reabierto**. El cierre histórico no autorizaba avanzar el estado global como si esa paridad estuviera resuelta, y S19/G3.5 no podía declararse cerrado por delante de esta dependencia.',1); assert '## Cierre definitivo tras reapertura — 2026-09-14' not in t; p.write_text(t+sprint_append)
          p=Path('docs/ENTITY_COLLISIONS_PLAN.md'); t=p.read_text(); old='4. [ ] consolidar engines de pose vanilla y engine general de `AnimationDefinition`;'; assert old in t; t=t.replace(old,'4. [x] consolidar engines de pose vanilla y engine general de `AnimationDefinition`;',1); start=t.index('**S18 continúa ABIERTO en segunda lectura adversarial:**'); end=t.index('\n\n**Salida:** catálogo general reproducible, extensible y con lifecycle transaccional.',start); p.write_text(t[:start]+plan_replacement+t[end:])
          p=Path('docs/VALIDATION.md'); t=p.read_text(); old='## G3 / S18 vanilla PoseEngine + Mojang keyframe program — closure 2026-09-14'; assert old in t; t=t.replace(old,'## G3 / S18 vanilla PoseEngine + Mojang keyframe program — historical closure 2026-09-14',1); t=t.replace('S18 closed G3 task 4. Vanilla procedural families now have canonical `PoseEngine` ownership','This was the first S18 closure and was later reopened by stronger original-source rest-transform oracles. At that historical point, vanilla procedural families had canonical `PoseEngine` ownership',1); old='**S18 is closed. G3 remains open for tasks 5–12.**'; assert old in t; t=t.replace(old,'**Historical conclusion only:** this closure was later superseded by the retroactive reopening recorded below; its evidence remains valid for the coverage it actually exercised.',1); assert '## G3 / S18 retroactive reopening and final reclosure — 2026-09-14' not in t; p.write_text(t+validation_append)
          PY
          git diff --check
          git config user.name 'ChatGPT Implementer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/sprints/S18-vanilla-pose-keyframe-engine.md docs/ENTITY_COLLISIONS_PLAN.md docs/VALIDATION.md
          git commit -m 'docs(s18): close final G3.4 parity campaign'
          git pull --rebase origin chatgpt-editing
          git push origin HEAD:chatgpt-editing
