name: s25-adversarial-reference-authority

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s25-adversarial-reference-authority.yml'
      - 'tools/s25_reference_authority_gate.py'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/**'
      - 'src/main/java/io/github/r3neer/scalebrews/platform/PlatformNetworking.java'
      - 'src/main/java/io/github/r3neer/scalebrews/platform/PlatformMovementReference.java'
      - 'src/main/java/io/github/r3neer/scalebrews/platform/PlatformMovePayload.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/**'
      - 'src/client/java/io/github/r3neer/scalebrews/client/mixin/PlatformOutgoingMoveMixin.java'
  workflow_dispatch:

jobs:
  reference-authority-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: verify anatomy references cannot borrow legacy or rich physical authority
        run: python3 tools/s25_reference_authority_gate.py

  legacy-borrow-mutant-must-die:
    needs: reference-authority-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: inject compiling legacy reference dependency into anatomy networking
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyNetworking.java')
          s=p.read_text()
          marker='public final class AnatomyNetworking {'
          injected=marker+'\n    private static final Class<?> S25_LEGACY_REFERENCE_LEAK=io.github.r3neer.scalebrews.platform.PlatformMovePayload.class;'
          count=s.count(marker)
          if count!=1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(marker,injected,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava --console=plain
      - name: authority gate must kill legacy borrow
        shell: bash
        run: |
          set +e
          python3 tools/s25_reference_authority_gate.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: anatomy borrowed legacy PlatformMovePayload authority'
            exit 1
          fi
          echo 'KILLED: legacy movement-reference dependency'

  rich-authority-mutant-must-die:
    needs: reference-authority-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: inject compiling serverbound contact-authority payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyNetworking.java')
          s=p.read_text()
          marker='public static void initialize(){'
          replacement=marker+"\n        PayloadTypeRegistry.serverboundPlay().register(AnatomyContactPayload.TYPE,AnatomyContactPayload.CODEC);\n        ServerPlayNetworking.registerGlobalReceiver(AnatomyContactPayload.TYPE,(payload,context)->{});"
          count=s.count(marker)
          if count!=1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(marker,replacement,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava --console=plain
      - name: authority gate must kill rich C2S authority
        shell: bash
        run: |
          set +e
          python3 tools/s25_reference_authority_gate.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: anatomy C2S registered contact/physical authority as a client reference'
            exit 1
          fi
          echo 'KILLED: rich serverbound physical-authority schema mutant'


  client-legacy-borrow-mutant-must-die:
    needs: reference-authority-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: inject compiling legacy reference dependency into client collision networking
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java')
          s=p.read_text()
          marker='public final class AnatomyClientNetworking {'
          injected=marker+'\n    private static final Class<?> S25_CLIENT_LEGACY_REFERENCE_LEAK=io.github.r3neer.scalebrews.platform.PlatformMovePayload.class;'
          count=s.count(marker)
          if count!=1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(marker,injected,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileClientJava --console=plain
      - name: authority gate must kill client legacy borrow
        shell: bash
        run: |
          set +e
          python3 tools/s25_reference_authority_gate.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: client anatomy networking borrowed legacy PlatformMovePayload'
            exit 1
          fi
          echo 'KILLED: client legacy movement-reference dependency'

  client-local-sequence-schema-mutant-must-die:
    needs: reference-authority-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: inject client-local transport sequence into serverbound reference schema
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMoveReferencePayload.java')
          s=p.read_text()
          old='public record AnatomyMoveReferencePayload(boolean vehicle,UUID support,long supportFrameSerial)\n        implements CustomPacketPayload {'
          new='public record AnatomyMoveReferencePayload(boolean vehicle,UUID support,long supportFrameSerial,long localTransportSequence)\n        implements CustomPacketPayload {'
          if s.count(old)!=1:
              raise SystemExit(f'header mutation target count: {s.count(old)}, expected 1')
          s=s.replace(old,new,1)
          compact='    public AnatomyMoveReferencePayload {'
          overload='''    public AnatomyMoveReferencePayload(boolean vehicle,UUID support,long supportFrameSerial) {
        this(vehicle,support,supportFrameSerial,1);
    }

'''
          if s.count(compact)!=1:
              raise SystemExit(f'constructor target count: {s.count(compact)}, expected 1')
          s=s.replace(compact,overload+compact,1)
          writer='''        buf.writeVarLong(payload.supportFrameSerial);'''
          writer_new='''        buf.writeVarLong(payload.supportFrameSerial);
        buf.writeVarLong(payload.localTransportSequence);'''
          if s.count(writer)!=1:
              raise SystemExit(f'writer target count: {s.count(writer)}, expected 1')
          s=s.replace(writer,writer_new,1)
          decoder='''        buf.readVarLong()
    ));'''
          decoder_new='''        buf.readVarLong(),
        buf.readVarLong()
    ));'''
          if s.count(decoder)!=1:
              raise SystemExit(f'decoder target count: {s.count(decoder)}, expected 1')
          p.write_text(s.replace(decoder,decoder_new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava --console=plain
      - name: authority gate must kill client-local sequence schema
        shell: bash
        run: |
          set +e
          python3 tools/s25_reference_authority_gate.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: serverbound reference accepted client-local transport sequence as authority'
            exit 1
          fi
          echo 'KILLED: client-local transport sequence in serverbound schema'
