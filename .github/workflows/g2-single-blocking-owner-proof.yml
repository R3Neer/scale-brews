name: g2-single-blocking-owner-proof

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/g2-single-blocking-owner-proof.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/mixin/PlatformEntityMixin.java'
      - 'src/main/java/io/github/r3neer/scalebrews/platform/PlatformPhysics.java'
      - 'src/main/java/io/github/r3neer/scalebrews/platform/Platforms.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyBindingState.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/data/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/integration/CollisionRules.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/G2SingleBlockingOwnerReadyTests.java'
  workflow_dispatch:

jobs:
  single-blocking-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate READY single-blocking-owner holdout
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.test.G2SingleBlockingOwnerReadyTests'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run single-blocking-owner holdout
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/g2-single-blocking-owner-junit.xml"
      - name: capture single-blocking-owner evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: G2-single-blocking-owner-proof
          path: |
            build/g2-single-blocking-owner-junit.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json

  pair-suppression-mutant-must-die:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: disable anatomy pair suppression only in CI checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/platform/PlatformPhysics.java')
          text=p.read_text()
          old='''        if(MOVING.get()==body && AnatomyApi.ownsSharedPhysics(body))\n            return AnatomyApi.ready(body) && AnatomyMovement.simulates(body)\n                && AnatomyMovement.replacesPair(body,other);'''
          new='''        if(MOVING.get()==body && AnatomyApi.ownsSharedPhysics(body))\n            return false; // adversarial mutant: revive vanilla entity AABB beside anatomy'''
          if old not in text:
              raise SystemExit('pair-suppression mutation target not found')
          p.write_text(text.replace(old,new,1))
          PY
      - name: isolate READY single-blocking-owner holdout
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.test.G2SingleBlockingOwnerReadyTests'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: require mutant to fail for the geometric-owner assertion
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          set +e
          ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/g2-single-blocking-owner-mutant-junit.xml" 2>&1 | tee "$GITHUB_WORKSPACE/build/g2-single-blocking-owner-mutant.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'Pair-suppression mutant survived: oracle does not prove single geometric ownership.' >&2
            exit 1
          fi
          if ! grep -R -F 'Eligible Entity.move must pass through the replaced rigid vanilla support AABB' build/run/gameTest/logs "$GITHUB_WORKSPACE/build/g2-single-blocking-owner-mutant.log" >/dev/null 2>&1; then
            echo 'Mutant failed, but not at the intended single-owner assertion.' >&2
            exit 1
          fi
      - name: capture pair-suppression mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: G2-single-blocking-owner-mutant
          path: |
            build/g2-single-blocking-owner-mutant-junit.xml
            build/g2-single-blocking-owner-mutant.log
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json
