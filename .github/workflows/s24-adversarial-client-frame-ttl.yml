name: s24-adversarial-client-frame-ttl

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s24-adversarial-client-frame-ttl.yml'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S24AdversarialFrameHistoryTtlClientProof.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyFrameHistory.java'
  workflow_dispatch:

jobs:
  client-frame-history-ttl:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S24 frame-history TTL holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S24AdversarialFrameHistoryTtlClientProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run expired frame-history retention holdout
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/s24-client-frame-ttl
          xvfb-run -a ./gradlew runClientGameTest --no-daemon --console=plain \
            2>&1 | tee build/s24-client-frame-ttl/client.log
      - name: capture RED evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S24-client-frame-history-ttl
          path: |
            build/s24-client-frame-ttl/client.log
            build/run/clientGameTest/logs/
            build/resources/gametest/fabric.mod.json
