name: s18-modelpart-target-semantics-probe

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s18-modelpart-target-semantics-probe.yml'
  workflow_dispatch:

jobs:
  inspect-modelpart-targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: resolve Minecraft 26.2 client jar
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew compileClientJava --console=plain
          jar="$(find .gradle/loom-cache/minecraftMaven -path '*minecraft-clientOnly-*' -path '*/26.2/*.jar' -type f -print -quit)"
          test -n "$jar"
          mkdir -p build/s18-modelpart-target-semantics
          cp "$jar" build/s18-modelpart-target-semantics/minecraft-client.jar
          sha256sum "$jar" > build/s18-modelpart-target-semantics/client-jar.sha256
      - name: inspect exact ModelPart and animation target bytecode
        shell: bash
        run: |
          set -euo pipefail
          out=build/s18-modelpart-target-semantics
          jar="$out/minecraft-client.jar"
          javap -classpath "$jar" -p -c net.minecraft.client.model.geom.ModelPart > "$out/ModelPart.txt"
          javap -classpath "$jar" -p -c net.minecraft.client.animation.AnimationChannel > "$out/AnimationChannel.txt"
          javap -classpath "$jar" -p -c net.minecraft.client.animation.KeyframeAnimations > "$out/KeyframeAnimations.txt"
          javap -classpath "$jar" -p -c net.minecraft.client.animation.AnimationDefinition > "$out/AnimationDefinition.txt"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/s18-modelpart-target-semantics/ModelPart.txt')
          lines=p.read_text().splitlines()
          wanted=('offsetPos(', 'offsetRotation(', 'offsetScale(', 'translateAndRotate(')
          out=[]
          for i,line in enumerate(lines):
              if any(w in line for w in wanted):
                  start=i
                  end=len(lines)
                  for j in range(i+1,len(lines)):
                      if lines[j].startswith('  public ') or lines[j].startswith('  private ') or lines[j].startswith('  protected '):
                          end=j; break
                  out.append('\n'.join(lines[start:end]))
          text='\n\n'.join(out)+'\n'
          Path('build/s18-modelpart-target-semantics/summary.txt').write_text(text)
          print(text)
          PY
      - name: capture target semantics evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S18-modelpart-target-semantics-probe
          path: build/s18-modelpart-target-semantics/
