name: s18-inspect-animation-api

on:
  push:
    branches: [chatgpt-editing]
    paths: ['.github/workflows/s18-inspect-animation-api.yml']

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: patch missing common import in workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/WorldAnatomyCatalog.java')
          text=p.read_text()
          old='import java.util.Objects;\nimport java.util.Set;'
          new='import java.util.Objects;\nimport java.util.Optional;\nimport java.util.Set;'
          if text.count(old)!=1:
              raise SystemExit(f'expected exact import seam once, got {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
      - name: populate mapped minecraft jars
        shell: bash
        run: ./gradlew compileClientJava --console=plain || true
      - name: inspect mapped Mojang animation API
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r jar; do
            matches=$(jar tf "$jar" 2>/dev/null | grep -E '(^|/)(AnimationDefinition|AnimationChannel|Keyframe|KeyframeAnimations)(\$[^/]*)?\.class$' || true)
            if [ -n "$matches" ]; then
              echo "=== JAR $jar ==="
              echo "$matches"
              while IFS= read -r cls; do
                [ -z "$cls" ] && continue
                case "$cls" in *'$'*) continue;; esac
                fqcn=${cls%.class}; fqcn=${fqcn//\//.}
                echo "=== JAVAP $fqcn ==="
                javap -classpath "$jar" -public "$fqcn" || true
              done <<< "$matches"
              found=1
            fi
          done < <(find .gradle "$HOME/.gradle" -type f -name '*.jar' 2>/dev/null | sort -u)
          test "$found" -eq 1
      - name: commit common import and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/s18-inspect-animation-api.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/github/r3neer/scalebrews/collision/internal/WorldAnatomyCatalog.java
          git commit -m 'fix(s18): import revision pose program optional'
          git push origin HEAD:chatgpt-editing
