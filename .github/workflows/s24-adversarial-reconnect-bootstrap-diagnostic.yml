name: s24-adversarial-reconnect-bootstrap-diagnostic

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s24-adversarial-reconnect-bootstrap-diagnostic.yml'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S24AdversarialReconnectBootstrapDiagnostics.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyNetworking.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java'
  workflow_dispatch:

jobs:
  reconnect-bootstrap-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate reconnect bootstrap diagnostic
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S24AdversarialReconnectBootstrapDiagnostics']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run staged reconnect bootstrap diagnostic
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/s24-reconnect-bootstrap-diagnostic
          xvfb-run -a ./gradlew runClientGameTest --no-daemon --console=plain \
            2>&1 | tee build/s24-reconnect-bootstrap-diagnostic/client.log
      - name: capture diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S24-reconnect-bootstrap-diagnostic
          path: |
            build/s24-reconnect-bootstrap-diagnostic/client.log
            build/run/clientGameTest/logs/
            build/resources/gametest/fabric.mod.json
