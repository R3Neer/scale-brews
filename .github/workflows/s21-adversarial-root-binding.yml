name: s21-adversarial-root-binding

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s21-adversarial-root-binding.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/api/CollisionEngines.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/api/spi/RootTransformProvider.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/WorldAnatomyCatalog.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S21AdversarialRootBindingTests.java'
  workflow_dispatch:

jobs:
  root-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S21 root-binding holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S21AdversarialRootBindingTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run S21 adversarial root-binding holdout
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s21-adversarial-root-binding-junit.xml"
      - name: capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S21-adversarial-root-binding
          path: |
            build/s21-adversarial-root-binding-junit.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json
