name: s19-proof-input-hash-probe

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s19-proof-input-hash-probe.yml'
  workflow_dispatch:

jobs:
  hash-exact-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: resolve exact CurseMaven files and record identities
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/s19-input-probe"
          mkdir -p "$probe"
          cat > "$probe/settings.gradle" <<'EOF'
          rootProject.name = 's19-proof-inputs'
          EOF
          cat > "$probe/build.gradle" <<'EOF'
          repositories {
              maven {
                  url = 'https://cursemaven.com/'
                  content { includeGroup 'curse.maven' }
              }
          }
          configurations {
              proofInputs {
                  canBeConsumed = false
                  canBeResolved = true
                  transitive = false
              }
          }
          dependencies {
              proofInputs 'curse.maven:alexs-mobs-continued-1635121:8772801'
              proofInputs 'curse.maven:codxlib-1633207:8723545'
              proofInputs 'curse.maven:cloth-config-348521:8269699'
          }
          tasks.register('copyProofInputs', Copy) {
              from configurations.proofInputs
              into layout.buildDirectory.dir('proof-inputs')
          }
          EOF
          ./gradlew -p "$probe" copyProofInputs --console=plain
          mkdir -p build/s19-input-probe
          : > build/s19-input-probe/hashes.txt
          for jar in "$probe"/build/proof-inputs/*.jar; do
              echo "FILE=$(basename "$jar")" | tee -a build/s19-input-probe/hashes.txt
              sha256sum "$jar" | tee -a build/s19-input-probe/hashes.txt
              unzip -p "$jar" fabric.mod.json > build/s19-input-probe/fabric.mod.json
              python3 - "$jar" <<'PY' | tee -a build/s19-input-probe/hashes.txt
          import json, pathlib, sys, zipfile
          jar = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(jar) as z:
              data = json.loads(z.read('fabric.mod.json'))
          print('MOD_ID=' + str(data.get('id')))
          print('MOD_VERSION=' + str(data.get('version')))
          print('MOD_NAME=' + str(data.get('name')))
          PY
              echo '---' | tee -a build/s19-input-probe/hashes.txt
          done
          cat build/s19-input-probe/hashes.txt
      - name: capture hash evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S19-proof-input-hash-probe
          path: build/s19-input-probe/hashes.txt
