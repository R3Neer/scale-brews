name: s24-lifecycle-generation

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s24-lifecycle-generation.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyFrameHistory.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyNetworking.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyPosePayload.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S24LifecycleGenerationTests.java'
  workflow_dispatch:

jobs:
  lifecycle-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S24 lifecycle generation tests
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S24LifecycleGenerationTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run S24 lifecycle generation tests
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s24-lifecycle-generation-junit.xml"
      - name: capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S24-lifecycle-generation
          path: |
            build/s24-lifecycle-generation-junit.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json
