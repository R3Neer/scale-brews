name: s18-update-s16-protocol-oracle

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s18-update-s16-protocol-oracle.yml'
      - '.github/scripts/s18_update_s16_protocol_oracle.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
      - run: python3 .github/scripts/s18_update_s16_protocol_oracle.py
      - name: commit oracle and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/s18-update-s16-protocol-oracle.yml .github/scripts/s18_update_s16_protocol_oracle.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S16CanonicalCatalogAuthorityTests.java
          git commit -m 'test(s18): let S16 preserve invariant across protocol advances'
          git push origin HEAD:chatgpt-editing
