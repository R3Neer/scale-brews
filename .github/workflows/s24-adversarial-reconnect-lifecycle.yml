name: s24-adversarial-reconnect-lifecycle

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s24-adversarial-reconnect-lifecycle.yml'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S24AdversarialReconnectLifecycleProof.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyNetworking.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java'
  workflow_dispatch:

jobs:
  reconnect-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate adversarial reconnect proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S24AdversarialReconnectLifecycleProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run adversarial reconnect proof
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/s24-adversarial-reconnect
          xvfb-run -a ./gradlew runClientGameTest --no-daemon --console=plain \
            2>&1 | tee build/s24-adversarial-reconnect/client.log
      - name: capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S24-adversarial-reconnect-lifecycle
          path: |
            build/s24-adversarial-reconnect/client.log
            build/run/clientGameTest/logs/
            build/resources/gametest/fabric.mod.json

  stale-catalog-mutation-kill:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate adversarial reconnect proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S24AdversarialReconnectLifecycleProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: preserve dead connection catalog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java')
          s=p.read_text()
          old='private static void reset(){session.resetConnection();clearPoses();poseLevel=null;clientTick=0;}'
          new='private static void reset(){clearPoses();poseLevel=null;clientTick=0;}'
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileClientJava compileGametestJava --no-daemon --console=plain
      - name: reconnect proof must kill stale catalog mutant
        shell: bash
        run: |
          set +e
          xvfb-run -a ./gradlew runClientGameTest --no-daemon --console=plain --rerun-tasks
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: disconnect retained the dead connection catalog'
            exit 1
          fi
          echo 'KILLED: stale connection catalog mutant'

  stale-history-mutation-kill:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate adversarial reconnect proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S24AdversarialReconnectLifecycleProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: preserve dead connection pose histories
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java')
          s=p.read_text()
          old='private static void reset(){session.resetConnection();clearPoses();poseLevel=null;clientTick=0;}'
          new='private static void reset(){session.resetConnection();poseLevel=null;clientTick=0;}'
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileClientJava compileGametestJava --no-daemon --console=plain
      - name: reconnect proof must kill stale history mutant
        shell: bash
        run: |
          set +e
          xvfb-run -a ./gradlew runClientGameTest --no-daemon --console=plain --rerun-tasks
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: disconnect retained the previous connection frame history'
            exit 1
          fi
          echo 'KILLED: stale connection history mutant'
