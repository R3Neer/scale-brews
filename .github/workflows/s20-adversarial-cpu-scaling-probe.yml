name: s20-adversarial-cpu-scaling-probe

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s20-adversarial-cpu-scaling-probe.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/pose/CitadelPoseProgramEvaluator.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/pose/CitadelPoseProgram.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/pose/CitadelPoseEngine.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S20AdversarialCpuScalingProbeTests.java'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  cpu-scaling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S20 CPU scaling probe
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S20AdversarialCpuScalingProbeTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: measure evaluator CPU scaling
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/s20-cpu-scaling-proof
          ./gradlew runGameTest --console=plain \
            -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s20-cpu-scaling-proof/junit.xml" 2>&1 \
            | tee build/s20-cpu-scaling-proof/console.log
      - name: extract CPU evidence
        if: always()
        shell: bash
        run: |
          grep -E 'S20_CPU|S20_CONDITION_BOUND' build/s20-cpu-scaling-proof/console.log \
            > build/s20-cpu-scaling-proof/measurement.txt || true
          cat build/s20-cpu-scaling-proof/measurement.txt || true
      - name: capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S20-adversarial-cpu-scaling-probe
          path: |
            build/s20-cpu-scaling-proof/
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json
