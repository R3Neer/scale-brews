name: s18-retro-modelpart-rotation-probe

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s18-retro-modelpart-rotation-probe.yml'
  workflow_dispatch:

jobs:
  inspect-modelpart-rotation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: materialize Minecraft client dependency
        run: ./gradlew compileClientJava --console=plain
      - name: inspect exact 26.2 ModelPart bytecode
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find "$HOME/.gradle/caches" "$GITHUB_WORKSPACE/.gradle" -type f -name 'minecraft-clientOnly-*-26.2.jar' -print -quit)"
          test -n "$jar"
          mkdir -p build/s18-retro-modelpart-rotation
          javap -classpath "$jar" -p -c net.minecraft.client.model.geom.ModelPart > build/s18-retro-modelpart-rotation/modelpart-javap.txt
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('build/s18-retro-modelpart-rotation/modelpart-javap.txt').read_text().splitlines()
          needles=('offsetRotation', 'translateAndRotate')
          out=[]
          for needle in needles:
              starts=[i for i,l in enumerate(lines) if needle in l and l.strip().endswith(';')]
              if not starts:
                  out.append('MISSING '+needle); continue
              for start in starts[:2]:
                  end=len(lines)
                  for j in range(start+1,len(lines)):
                      if lines[j].startswith('  public ') or lines[j].startswith('  private ') or lines[j].startswith('  protected '):
                          end=j; break
                  out.append('\n'.join(lines[start:end]))
          text='\n\n=== METHOD ===\n'.join(out)+'\n'
          Path('build/s18-retro-modelpart-rotation/selected-methods.txt').write_text(text)
          print(text)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: S18-retro-modelpart-rotation-semantics
          path: build/s18-retro-modelpart-rotation/
