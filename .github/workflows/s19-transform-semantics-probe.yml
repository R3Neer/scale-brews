name: s19-transform-semantics-probe

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s19-transform-semantics-probe.yml'
  workflow_dispatch:

jobs:
  inspect-transform-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: resolve exact locked Alex jar
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/s19-transform-semantics"
          mkdir -p "$probe"
          python3 - "$probe" <<'PY'
          import json, pathlib, sys
          probe = pathlib.Path(sys.argv[1])
          lock = json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          alex = next(item for item in lock['inputs'] if item['modId'] == 'alexsmobs')
          (probe / 'settings.gradle').write_text("rootProject.name = 's19-transform-semantics'\n")
          (probe / 'build.gradle').write_text(f"""repositories {{ maven {{ url = 'https://cursemaven.com/'; content {{ includeGroup 'curse.maven' }} }} }}
          configurations {{ proofInput {{ canBeConsumed = false; canBeResolved = true; transitive = false }} }}
          dependencies {{ proofInput '{alex['coordinate']}' }}
          tasks.register('copyProofInput', Copy) {{ from configurations.proofInput; into layout.buildDirectory.dir('proof-input') }}
          """)
          pathlib.Path('build').mkdir(exist_ok=True)
          pathlib.Path('build/s19-transform-semantics-expected.txt').write_text(alex['sha256'] + '\n')
          PY
          ./gradlew -p "$probe" copyProofInput --console=plain
          jar="$(find "$probe/build/proof-input" -name '*.jar' -type f -print -quit)"
          test -n "$jar"
          test "$(sha256sum "$jar" | awk '{print $1}')" = "$(cat build/s19-transform-semantics-expected.txt)"
          cp "$jar" build/s19-transform-semantics-alex.jar
      - name: inspect exact transform bytecode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/s19-transform-semantics-probe
          javap -classpath build/s19-transform-semantics-alex.jar -p -c \
            com.github.alexthe666.alexsmobs.citadel.client.model.AdvancedModelBox \
            > build/s19-transform-semantics-probe/advanced-model-box-javap.txt
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('build/s19-transform-semantics-probe/advanced-model-box-javap.txt').read_text().splitlines()
          signatures = (
              'public void setScale(float, float, float);',
              'public void setShouldScaleChildren(boolean);',
              'public void translateAndRotate(com.mojang.blaze3d.vertex.PoseStack);',
              'public void render(com.mojang.blaze3d.vertex.PoseStack, com.mojang.blaze3d.vertex.VertexConsumer, int, int, float, float, float, float);'
          )
          chunks=[]
          for sig in signatures:
              try:
                  start = next(i for i,l in enumerate(lines) if l.strip() == sig)
              except StopIteration:
                  chunks.append('MISSING: '+sig)
                  continue
              end = len(lines)
              for j in range(start+1, len(lines)):
                  if lines[j].startswith('  public ') or lines[j].startswith('  private ') or lines[j].startswith('  protected '):
                      end = j
                      break
              chunks.append('\n'.join(lines[start:end]))
          out='\n\n=== METHOD ===\n'.join(chunks)
          Path('build/s19-transform-semantics-probe/transform-methods.txt').write_text(out+'\n')
          print(out)
          PY
      - name: capture transform semantics evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S19-transform-semantics-probe
          path: build/s19-transform-semantics-probe/
