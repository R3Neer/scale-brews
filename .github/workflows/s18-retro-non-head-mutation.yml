name: s18-retro-non-head-mutation

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s18-retro-non-head-mutation.yml'
  workflow_dispatch:

jobs:
  non-head-compiler-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: apply test-only compiler mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AnimationDefinitionCompiler.java')
          text=p.read_text()
          needle='''        for (var bone : bones.entrySet()) {\n            String boneName = bone.getKey();'''
          replacement='''        for (var bone : bones.entrySet()) {\n            if (!"head".equals(bone.getKey())) continue;\n            String boneName = bone.getKey();'''
          if text.count(needle) != 1:
              raise SystemExit('compiler bone loop not found exactly once')
          p.write_text(text.replace(needle,replacement))
          PY
          git diff -- src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AnimationDefinitionCompiler.java
      - name: run current S18 client acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-client-gametest']=[
            'io.github.r3neer.scalebrews.test.S18AnimationDefinitionCompilerClientTests',
            'io.github.r3neer.scalebrews.test.S18AnimationDefinitionSemanticClientTests'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          xvfb-run -a ./gradlew runClientGameTest --console=plain
          echo 'S18_RETRO_MUTATION_SURVIVED compiler ignored all non-head tracks without failing current S18 original-source acceptance'
      - name: capture mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S18-retro-non-head-mutation
          path: |
            build/run/clientGameTest/logs/
            build/resources/gametest/fabric.mod.json
