name: s19-render-space-adversarial-proof

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s19-render-space-adversarial-proof.yml'
      - 'tools/s19-external-inputs.lock.json'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryEngine.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/AdvancedModelBoxGeometryExtractor.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S19RendererTransformClientProof.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S19AdvancedModelBoxClientProof.java'
  workflow_dispatch:

jobs:
  render-space-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew

      - name: resolve and verify pinned S19 external inputs
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/s19-render-space-inputs"
          mkdir -p "$probe"
          python3 - "$probe" <<'PY'
          import json, pathlib, sys
          probe = pathlib.Path(sys.argv[1])
          lock = json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          if lock.get('schema') != 1 or lock.get('minecraft') != '26.2':
              raise SystemExit('Unexpected S19 external input lock')
          deps = '\n'.join(f"    proofInputs '{item['coordinate']}'" for item in lock['inputs'])
          (probe / 'settings.gradle').write_text("rootProject.name = 's19-render-space-inputs'\n")
          (probe / 'build.gradle').write_text(f"""repositories {{
              maven {{
                  url = 'https://cursemaven.com/'
                  content {{ includeGroup 'curse.maven' }}
              }}
          }}
          configurations {{
              proofInputs {{
                  canBeConsumed = false
                  canBeResolved = true
                  transitive = false
              }}
          }}
          dependencies {{
          {deps}
          }}
          tasks.register('copyProofInputs', Copy) {{
              from configurations.proofInputs
              into layout.buildDirectory.dir('proof-inputs')
          }}
          """)
          PY
          ./gradlew -p "$probe" copyProofInputs --console=plain
          mkdir -p build/s19-render-space/mods
          cp "$probe"/build/proof-inputs/*.jar build/s19-render-space/mods/
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          lock = json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          mods = pathlib.Path('build/s19-render-space/mods')
          for item in lock['inputs']:
              group, artifact, version = item['coordinate'].split(':')
              jar = mods / f'{artifact}-{version}.jar'
              if not jar.is_file():
                  raise SystemExit(f'Missing pinned proof jar {jar.name}')
              actual = hashlib.sha256(jar.read_bytes()).hexdigest()
              if actual != item['sha256']:
                  raise SystemExit(f'SHA mismatch for {jar.name}: {actual}')
              with zipfile.ZipFile(jar) as archive:
                  metadata = json.loads(archive.read('fabric.mod.json'))
              if metadata.get('id') != item['modId'] or str(metadata.get('version')) != item['version']:
                  raise SystemExit(f'Mod identity mismatch for {jar.name}')
          PY

      - name: isolate independent renderer-transform oracle
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S19RendererTransformClientProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

      - name: run independent renderer-transform oracle
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-render-space/mods" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/s19-render-space/normal-transform.log"
          mkdir -p build/s19-render-space/logs-normal
          cp -r build/run/clientGameTest/logs/. build/s19-render-space/logs-normal/ || true

      - name: require wrong transform-order mutant to die
        shell: bash
        run: |
          set -euo pipefail
          file='src/gametest/java/io/github/r3neer/scalebrews/test/S19RendererTransformClientProof.java'
          python3 - "$file" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); text=p.read_text()
          old='''        Matrix4f transform = new Matrix4f().scaling(-1f, -1f, 1f);\n        if (gazelle) transform.scale(.8f, .8f, .8f);\n        return transform.translate(0f, -1.501f, 0f);'''
          new='''        Matrix4f transform = new Matrix4f().scaling(-1f, -1f, 1f).translate(0f, -1.501f, 0f);\n        if (gazelle) transform.scale(.8f, .8f, .8f);\n        return transform;'''
          if old not in text:
              raise SystemExit('S19 transform-order mutation target not found')
          p.write_text(text.replace(old,new,1))
          PY
          rm -rf build/run/clientGameTest
          set +e
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-render-space/mods" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/s19-render-space/order-mutant.log"
          code=${PIPESTATUS[0]}
          set -e
          mkdir -p build/s19-render-space/logs-order-mutant
          cp -r build/run/clientGameTest/logs/. build/s19-render-space/logs-order-mutant/ || true
          if [ "$code" -eq 0 ]; then
            echo 'S19 wrong transform-order mutant survived independent renderer oracle.' >&2
            exit 1
          fi
          if ! grep -R -F 'S19 source modelTransform differs from independent renderer oracle for alexsmobs:gazelle' \
              build/run/clientGameTest/logs "$GITHUB_WORKSPACE/build/s19-render-space/order-mutant.log" >/dev/null 2>&1; then
            echo 'S19 transform-order mutant failed, but not at the intended oracle.' >&2
            exit 1
          fi
          git checkout -- "$file"

      - name: require accidental Gazelle baby-state mutant to die
        shell: bash
        run: |
          set -euo pipefail
          file='src/gametest/java/io/github/r3neer/scalebrews/test/S19AdvancedModelBoxClientProof.java'
          python3 - "$file" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); text=p.read_text()
          old='prove(Identifier.parse("alexsmobs:gazelle"), GAZELLE, true);'
          new='prove(Identifier.parse("alexsmobs:gazelle"), GAZELLE, false);'
          if old not in text:
              raise SystemExit('S19 Gazelle adult-state mutation target not found')
          p.write_text(text.replace(old,new,1))
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S19AdvancedModelBoxClientProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          rm -rf build/run/clientGameTest
          set +e
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            -PscalebrewsCompatMods="$GITHUB_WORKSPACE/build/s19-render-space/mods" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/s19-render-space/age-mutant.log"
          code=${PIPESTATUS[0]}
          set -e
          mkdir -p build/s19-render-space/logs-age-mutant
          cp -r build/run/clientGameTest/logs/. build/s19-render-space/logs-age-mutant/ || true
          if [ "$code" -eq 0 ]; then
            echo 'S19 Gazelle baby-state mutant survived the real-model renderer oracle.' >&2
            exit 1
          fi
          if ! grep -R -F 'S19 collider vertex is absent from independently transformed real renderer for alexsmobs:gazelle' \
              build/run/clientGameTest/logs "$GITHUB_WORKSPACE/build/s19-render-space/age-mutant.log" >/dev/null 2>&1; then
            echo 'S19 Gazelle baby-state mutant failed, but not at the intended renderer/collider assertion.' >&2
            exit 1
          fi
          git checkout -- "$file"

      - name: capture render-space adversarial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S19-render-space-adversarial-proof
          path: |
            build/s19-render-space/*.log
            build/s19-render-space/logs-normal/
            build/s19-render-space/logs-order-mutant/
            build/s19-render-space/logs-age-mutant/
            build/resources/gametest/fabric.mod.json
            tools/s19-external-inputs.lock.json
