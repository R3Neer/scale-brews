name: s18-provider-fixture-compat

on:
  push:
    branches: [chatgpt-editing]
    paths: ['.github/workflows/s18-provider-fixture-compat.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
      - name: add nonlegacy two-argument evaluator seam
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/ModelGeometryProvider.java')
          text=p.read_text()
          old='''    /** Procedural/source compatibility constructor; data-backed engines must use the bound constructor. */
    public ModelGeometryProvider(ModelGeometry geometry,PoseEngine poses,AnatomyFilter filter,long revision) {
        this(geometry,bind(geometry,poses,Map.of()),filter,revision);
    }
'''
          new=old+'''    /** Pure/test compatibility seam. The evaluator is bound immediately and carries no catalog/resource lookup. */
    public ModelGeometryProvider(ModelGeometry geometry,
            java.util.function.BiFunction<ModelGeometry,PoseEngine.Inputs,Optional<Map<String,Matrix4f>>> poses,
            AnatomyFilter filter,long revision) {
        this(geometry,(PoseEngine.Bound)(inputs->poses.apply(geometry,inputs)),filter,revision);
    }
'''
          if text.count(old)!=1:
              raise SystemExit(f'constructor seam expected once, found {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
      - name: commit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/s18-provider-fixture-compat.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/github/r3neer/scalebrews/collision/internal/ModelGeometryProvider.java
          git commit -m 'refactor(s18): retain pure two argument evaluator fixture seam'
          git push origin HEAD:chatgpt-editing
