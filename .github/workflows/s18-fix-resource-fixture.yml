name: s18-fix-resource-fixture

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s18-fix-resource-fixture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
      - name: patch historical ResourceManager fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/gametest/java/io/github/r3neer/scalebrews/test/AnatomyGeometryTests.java')
          s=p.read_text()
          old='if(directory.endsWith("entity_collision"))return java.util.Map.of();'
          new='if(directory.endsWith("entity_collision") || directory.endsWith("pose_programs"))return java.util.Map.of();'
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one fixture seam, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - name: verify affected GameTest class compiles
        run: |
          chmod +x ./gradlew
          ./gradlew compileGametestJava --console=plain
      - name: commit fixture migration and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/s18-fix-resource-fixture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gametest/java/io/github/r3neer/scalebrews/test/AnatomyGeometryTests.java
          git commit -m 'test(s18): keep legacy reload fixture out of pose program namespace'
          git push origin HEAD:chatgpt-editing
