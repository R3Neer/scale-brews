name: s24-client-dimension-lifecycle

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s24-client-dimension-lifecycle.yml'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S24DimensionLifecycleClientProof.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyClientSession.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyFrameHistory.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyNetworking.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyPosePayload.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  dimension-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew

      - name: isolate S24 dimension lifecycle client proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S24DimensionLifecycleClientProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

      - name: run integrated dimension lifecycle proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/s24-dimension-lifecycle
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            2>&1 | tee build/s24-dimension-lifecycle/client.log
          if ! grep -R -F 'S24_DIMENSION_LIFECYCLE PASS' \
              build/run/clientGameTest/logs build/s24-dimension-lifecycle/client.log >/dev/null 2>&1; then
            echo 'S24 dimension lifecycle proof did not emit its causal PASS marker.' >&2
            exit 1
          fi

      - name: capture dimension lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S24-client-dimension-lifecycle
          path: |
            build/s24-dimension-lifecycle/client.log
            build/run/clientGameTest/logs/
            build/resources/gametest/fabric.mod.json
