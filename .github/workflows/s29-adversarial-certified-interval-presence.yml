name: s29-adversarial-certified-interval-presence

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s29-adversarial-certified-interval-presence.yml'
      - 'tools/s29_certified_interval_presence_gate.py'
      - 'docs/sprints/S29-g4-certified-presentation.md'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/**'
  workflow_dispatch:

jobs:
  certified-interval-presence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: require an actual certified interval presentation surface
        run: python3 tools/s29_certified_interval_presence_gate.py

  no-inference-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate presentation endpoint proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=[
            'io.github.r3neer.scalebrews.test.AnatomyPresentationFrameTests'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: ordered endpoints must remain CURRENT_ENDPOINT without certificate
        run: xvfb-run -a ./gradlew runClientGameTest --console=plain

  fake-certified-label-mutant-must-die:
    needs: no-inference-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate presentation endpoint proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=[
            'io.github.r3neer.scalebrews.test.AnatomyPresentationFrameTests'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: relabel uncertified current endpoints as certified intervals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java')
          s=p.read_text()
          old_guard='if(kind!=PresentationKind.CURRENT_ENDPOINT || before!=after || fraction!=1 || authorityTime!=before.authorityTick())'
          new_guard='if((kind!=PresentationKind.CURRENT_ENDPOINT && kind!=PresentationKind.CERTIFIED_INTERVAL) || before!=after || fraction!=1 || authorityTime!=before.authorityTick())'
          old_factory='return new PresentationFrame(identity,endpoint,endpoint,endpoint.authorityTick(),1,PresentationKind.CURRENT_ENDPOINT,evaluated);'
          new_factory='return new PresentationFrame(identity,endpoint,endpoint,endpoint.authorityTick(),1,PresentationKind.CERTIFIED_INTERVAL,evaluated);'
          if s.count(old_guard)!=1 or s.count(old_factory)!=1:
              raise SystemExit(f'mutation targets guard={s.count(old_guard)} factory={s.count(old_factory)}, expected 1/1')
          s=s.replace(old_guard,new_guard,1).replace(old_factory,new_factory,1)
          p.write_text(s)
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileClientJava compileGametestJava --console=plain
      - name: endpoint proof must kill fabricated certification label
        shell: bash
        run: |
          set +e
          xvfb-run -a ./gradlew runClientGameTest --no-daemon --console=plain --rerun-tasks
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: uncertified endpoints were mislabeled CERTIFIED_INTERVAL'
            exit 1
          fi
          echo 'KILLED: fabricated certified-interval label'
