name: s15-close-apply

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s15-close-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-s15:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: apply canonical S15 closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git fetch origin chatgpt-editing
          git checkout chatgpt-editing
          git pull --ff-only origin chatgpt-editing
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1))

          sprint = Path('docs/sprints/S15-prepared-catalog-bundle.md')
          replace_once(sprint, 'Estado: **PLAN CERRADO / IMPLEMENTACIÓN PENDIENTE**.', 'Estado: **CERRADO**.')
          for i in range(1, 13):
              replace_once(sprint, f'- [ ] I{i} ', f'- [x] I{i} ')
          sprint_closure = '## Resultado de implementación y cierre\n\n`WorldAnatomyCatalog` publica cada revisión aceptada como el par atómico `Snapshot + AnatomyCatalogTransfer.PreparedBundle`; serialización, SHA-256 y fragmentación ocurren antes del swap. `PreparedBundle.packets(epoch, revision)` reutiliza la lista preparada para el mismo `epoch + revision`; `AnatomyRuntime` y `AnatomyNetworking` sólo consumen packets preparados en la ruta live, y `AnatomyCatalogTransfer.encode(...)` delega en el mismo camino como seam de fixture.\n\nLos holdouts se añadieron antes de producción en `6b360fe9ec5c635cf3e9cdf89b848b543241f017`; los cambios productivos principales fueron `a1f74865e47af37d644c52437b16d13526ad3c5e`, `e9f8d70aa8280bcd5267c8bece88ac3ef782f7a0` y `2044ee434df5777c07bef0d28e5f7484fa43c0cf`. La primera lane focal, run `34746882338`, job `103696316689`, tuvo **9/9** GameTests verdes pero falló su propia aserción al no contar el sentinel automático `minecraft:always_pass`; `c49087ec095160043db142dcc7774945dc2bfbdd` corrigió sólo esa aserción. La evidencia final sobre `e52766a71cf66c4157d31b8884d901b22d4de7a8` es run `34747160506`, job `103697083788`: **8/8 S15** + sentinel y ordinary **394/394**; artifact `10313754760`, SHA-256 `5a3a20f13c7f24726cee3ed6af5baa3a1f3f63c4c6b5347c69c5063dfba42f57`. Build `34747160495`: **success**.\n\nLa revisión adversarial final no encontró otro owner ni una segunda ruta live de preparación; invalid replacement conserva snapshot+bundle, nueva revisión invalida el cache anterior, epoch/bounds siguen fail-closed y fragments continúan defensivos. Desde el hardening S15 `684142f32003a29f255b8ff204d39a7e0a968ed2` no hubo otro cambio de producción/tests S15. **Pasada final sin cambios de producción: S15 cerrado.**\n\n'
          replace_once(sprint, '## Modelo adversarial\n', sprint_closure + '## Modelo adversarial\n')

          plan = Path('docs/ENTITY_COLLISIONS_PLAN.md')
          replace_once(plan, '2. [ ] preparar/serializar una vez por revisión y reutilizar bundle por receptor;', '2. [x] preparar/serializar una vez por revisión y reutilizar bundle por receptor;')
          plan_anchor = '12. [ ] terminar separación de `collision.internal` cuando fronteras sean estables.\n\n**Salida:** catálogo general reproducible, extensible y con lifecycle transaccional.'
          plan_insert = '12. [ ] terminar separación de `collision.internal` cuando fronteras sean estables.\n\n**S15 cerrado:** G3 tarea 2/NFR-010 queda cerrada. `WorldAnatomyCatalog` publica `Snapshot + PreparedBundle` atómicamente y la ruta live reutiliza packets preparados por `epoch + revision`. Evidencia final `e52766a71cf66c4157d31b8884d901b22d4de7a8`, run `34747160506`, job `103697083788`: focal **8/8 S15** (+ sentinel) y ordinary **394/394**; artifact `10313754760`, SHA-256 `5a3a20f13c7f24726cee3ed6af5baa3a1f3f63c4c6b5347c69c5063dfba42f57`. Revisión post-verde sin cambios de producción. G3 sigue abierto para tareas 1 y 3-12.\n\n**Salida:** catálogo general reproducible, extensible y con lifecycle transaccional.'
          replace_once(plan, plan_anchor, plan_insert)

          validation = Path('docs/VALIDATION.md')
          text = validation.read_text()
          marker = '## G3 / S15 prepared catalog bundle reuse — closure 2026-09-13'
          if marker in text:
              raise SystemExit('VALIDATION already contains S15 closure section')
          section = '\n\n## G3 / S15 prepared catalog bundle reuse — closure 2026-09-13\n\nS15 cierra G3 tarea 2 / NFR-010. `WorldAnatomyCatalog` publica cada revisión como `Snapshot + AnatomyCatalogTransfer.PreparedBundle`; preparación de bytes/digest/fragments ocurre antes del swap, `AnatomyRuntime` usa `preparedPackets(epoch)` y `AnatomyNetworking.sendCatalog(...)` no recibe `models/profiles`. Repetir receptor con el mismo `epoch + revision` reutiliza la misma lista preparada; replacement inválido conserva el par anterior y cambio de revision/epoch rematerializa sólo headers/payloads desde fragments ya preparados.\n\nLos ocho holdouts S15 se añadieron antes del camino productivo en `6b360fe9ec5c635cf3e9cdf89b848b543241f017`. La primera lane dedicada, run **`34746882338`**, job **`103696316689`**, ejecutó **9/9 required GameTests** verdes, pero el job terminó rojo porque la aserción de CI esperaba ocho casos totales y Fabric añade `minecraft:always_pass`; fue un fallo de la lane, no del producto. `c49087ec095160043db142dcc7774945dc2bfbdd` corrigió esa aserción.\n\nEvidencia final exacta sobre **`e52766a71cf66c4157d31b8884d901b22d4de7a8`**: run **`34747160506`**, job **`103697083788`**, fase focal **8/8 S15** + `minecraft:always_pass`, seguida de suite ordinary **394/394** incluyendo los ocho holdouts. Artifact **`10313754760`**, SHA-256 **`5a3a20f13c7f24726cee3ed6af5baa3a1f3f63c4c6b5347c69c5063dfba42f57`**. Build run **`34747160495`** concluyó **success** sobre el mismo snapshot.\n\nLa revisión adversarial final recorrió owner, hot send, fixture encoder, invalid replacement, revision/epoch fences, bounds e inmutabilidad. No encontró una segunda ruta live de serialización/hash/fragmentation ni owner duplicado; desde `684142f32003a29f255b8ff204d39a7e0a968ed2` no hubo cambios adicionales de producción/tests S15. **La pasada final produjo cero cambios de producto; S15 queda cerrado y G3 permanece abierto para tareas 1 y 3-12.**\n'
          validation.write_text(text.rstrip() + section + '\n')
          PY
          git diff --check
          git add docs/sprints/S15-prepared-catalog-bundle.md docs/ENTITY_COLLISIONS_PLAN.md docs/VALIDATION.md
          git diff --cached --stat
          git commit -m 'docs(s15): close prepared catalog sprint'
          git pull --rebase origin chatgpt-editing
          git push origin HEAD:chatgpt-editing
