name: s19-offset-field-probe

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s19-offset-field-probe.yml'
  workflow_dispatch:

jobs:
  inspect-offset-usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: resolve exact locked Alex jar
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/s19-offset-field"
          mkdir -p "$probe"
          python3 - "$probe" <<'PY'
          import json, pathlib, sys
          probe = pathlib.Path(sys.argv[1])
          lock = json.loads(pathlib.Path('tools/s19-external-inputs.lock.json').read_text())
          alex = next(item for item in lock['inputs'] if item['modId'] == 'alexsmobs')
          (probe / 'settings.gradle').write_text("rootProject.name = 's19-offset-field'\n")
          (probe / 'build.gradle').write_text(f"""repositories {{ maven {{ url = 'https://cursemaven.com/'; content {{ includeGroup 'curse.maven' }} }} }}
          configurations {{ proofInput {{ canBeConsumed = false; canBeResolved = true; transitive = false }} }}
          dependencies {{ proofInput '{alex['coordinate']}' }}
          tasks.register('copyProofInput', Copy) {{ from configurations.proofInput; into layout.buildDirectory.dir('proof-input') }}
          """)
          pathlib.Path('build').mkdir(exist_ok=True)
          pathlib.Path('build/s19-offset-expected.txt').write_text(alex['sha256'] + '\n')
          PY
          ./gradlew -p "$probe" copyProofInput --console=plain
          jar="$(find "$probe/build/proof-input" -name '*.jar' -type f -print -quit)"
          test -n "$jar"
          test "$(sha256sum "$jar" | awk '{print $1}')" = "$(cat build/s19-offset-expected.txt)"
          cp "$jar" build/s19-offset-alex.jar
      - name: inspect offset field bytecode references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/s19-offset-field-probe
          javap -classpath build/s19-offset-alex.jar -p -c \
            com.github.alexthe666.alexsmobs.citadel.client.model.AdvancedModelBox \
            > build/s19-offset-field-probe/advanced-model-box-javap.txt
          grep -n -C 8 -E 'Field offset[XYZ]:F' build/s19-offset-field-probe/advanced-model-box-javap.txt \
            | tee build/s19-offset-field-probe/offset-references.txt
      - name: capture offset evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S19-offset-field-probe
          path: build/s19-offset-field-probe/
