name: s00-finalize
on:
  push:
    branches: [chatgpt-editing]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ github.event.head_commit.message == 'ci: materialize S00 logical closeout' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: materialize exact logical S00 commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/s00-finalize.py
