name: s18-vanilla-procedural-parity-proof

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s18-vanilla-procedural-parity-proof.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/api/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/geometry/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/pose/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyPoseEligibility.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AuthorityPoseTracker.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/**'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S18VanillaProceduralSemanticClientTests.java'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  client-original-vanilla-families:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate canonical original-source vanilla family parity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-client-gametest']=[
            'io.github.r3neer.scalebrews.test.S18VanillaProceduralSemanticClientTests'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run canonical original-source vanilla family parity proof
        run: xvfb-run -a ./gradlew runClientGameTest --console=plain
      - name: capture vanilla family parity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S18-vanilla-procedural-original-source-proof
          path: |
            build/run/clientGameTest/logs/
            build/resources/gametest/fabric.mod.json
