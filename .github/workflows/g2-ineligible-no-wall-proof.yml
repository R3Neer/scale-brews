name: g2-ineligible-no-wall-proof

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/g2-ineligible-no-wall-proof.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/platform/Platforms.java'
      - 'src/main/java/io/github/r3neer/scalebrews/platform/PlatformPhysics.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomySession.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyBindingState.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/data/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/integration/BodyClassification.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/integration/CollisionRules.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/G2EligibilityNoWallReadyTests.java'
  workflow_dispatch:

jobs:
  ineligible-no-wall:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate READY eligibility no-wall holdout
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.test.G2EligibilityNoWallReadyTests'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run eligibility no-wall holdout
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/g2-ineligible-no-wall-junit.xml"
      - name: capture eligibility no-wall evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: G2-ineligible-no-wall-proof
          path: |
            build/g2-ineligible-no-wall-junit.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json
