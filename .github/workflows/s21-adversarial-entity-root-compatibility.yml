name: s21-adversarial-entity-root-compatibility

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s21-adversarial-entity-root-compatibility.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/BuiltInRootTransformProviders.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/ModelGeometryProvider.java'
      - 'src/main/java/io/github/r3neer/scalebrews/integration/gravity/GravityFrames.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S21AdversarialEntityRootCompatibilityTests.java'
  workflow_dispatch:

jobs:
  entity-root-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S21 entity-root compatibility holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S21AdversarialEntityRootCompatibilityTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run S21 entity-root compatibility matrix holdout
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s21-adversarial-entity-root-compatibility-junit.xml"
      - name: capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S21-adversarial-entity-root-compatibility
          path: |
            build/s21-adversarial-entity-root-compatibility-junit.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json
