name: s17-retro-missing-cube-mutation

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s17-retro-missing-cube-mutation.yml'
  workflow_dispatch:

jobs:
  missing-cube-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: mutate extractor only inside runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/ModelPartGeometryExtractor.java')
          text = p.read_text()
          needle = '''        for (var cube : cubes) {\n            var vertices = new ArrayList<double[]>();'''
          replacement = '''        for (var cube : cubes) {\n            // Adversarial mutation: silently drop a real volumetric cube.\n            if (id.equals("root/body") && cubeIndex == 0) { cubeIndex++; continue; }\n            var vertices = new ArrayList<double[]>();'''
          if text.count(needle) != 1:
              raise SystemExit('expected extractor loop not found exactly once')
          p.write_text(text.replace(needle, replacement))
          PY
          git diff -- src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/ModelPartGeometryExtractor.java
      - name: require independent structural oracle to kill mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S17OriginalModelStructuralParityClientTests']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          mkdir -p build
          set +e
          xvfb-run -a ./gradlew runClientGameTest --console=plain > build/s17-retro-mutation.log 2>&1
          status=$?
          set -e
          cat build/s17-retro-mutation.log
          if [ "$status" -eq 0 ]; then
            echo 'S17_RETRO_MUTATION_SURVIVED strengthened structural oracle did not detect missing root/body/cube_0'
            exit 1
          fi
          grep -Eq 'structural piece mismatch|misses original vertex|Vertex cardinality mismatch' build/s17-retro-mutation.log
          echo 'S17_RETRO_MUTATION_KILLED independent original-tree oracle detected missing volumetric source cube'
      - name: capture mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S17-retro-missing-cube-mutation-kill
          path: |
            build/s17-retro-mutation.log
            build/run/clientGameTest/logs/
            build/run/clientGameTest/s17-retro-snapshots/
