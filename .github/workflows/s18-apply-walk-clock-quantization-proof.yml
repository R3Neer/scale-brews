name: s18-apply-walk-clock-quantization-proof

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s18-apply-walk-clock-quantization-proof.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/api/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/geometry/**'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/pose/**'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/preparation/**'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S18ApplyWalkClockQuantizationClientTests.java'
  workflow_dispatch:

jobs:
  client-apply-walk-clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate applyWalk clock quantization holdout
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-client-gametest']=[
            'io.github.r3neer.scalebrews.test.S18ApplyWalkClockQuantizationClientTests'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run applyWalk clock quantization holdout
        run: xvfb-run -a ./gradlew runClientGameTest --console=plain
      - name: capture applyWalk clock evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S18-apply-walk-clock-quantization-proof
          path: |
            build/run/clientGameTest/logs/
            build/resources/gametest/fabric.mod.json
