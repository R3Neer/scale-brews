name: s24-client-late-tracking-order

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s24-client-late-tracking-order.yml'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S24LateTrackingOrderClientProof.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S24AdversarialFrameOrderTests.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyEndpointLedger.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyFrameHistory.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyNetworking.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyPosePayload.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/GeometryProvider.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/TrackingReplayFence.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/runtime/RootFrame.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/runtime/RootFrameLedger.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S24TrackingAuthorityTestSeam.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/mixin/TestTrackingAuthorityMixin.java'
      - 'src/gametest/resources/scalebrews-test.mixins.json'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  late-tracking-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew

      - name: isolate S24 late tracking order client proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S24LateTrackingOrderClientProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

      - name: run integrated late tracking order proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/s24-late-tracking-order
          xvfb-run -a ./gradlew runClientGameTest --console=plain \
            2>&1 | tee build/s24-late-tracking-order/client.log
          if ! grep -R -F 'S24_LATE_TRACKING_ORDER PASS' \
              build/run/clientGameTest/logs build/s24-late-tracking-order/client.log >/dev/null 2>&1; then
            echo 'S24 late tracking order proof did not emit its causal PASS marker.' >&2
            exit 1
          fi

      - name: capture late tracking order evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S24-client-late-tracking-order
          path: |
            build/s24-late-tracking-order/client.log
            build/run/clientGameTest/logs/
            build/resources/gametest/fabric.mod.json

  same-window-ordering-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S24 same-window ordering owner holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S24AdversarialFrameOrderTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run same-window ordering owner holdout
        run: ./gradlew runGameTest --console=plain \
          -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s24-frame-order-baseline.xml"
      - name: capture owner evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S24-frame-order-baseline
          path: |
            build/s24-frame-order-baseline.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json

  stale-order-mutant-must-die:
    needs: [late-tracking-order, same-window-ordering-owner]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S24 same-window ordering owner holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S24AdversarialFrameOrderTests'
          ]
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: remove same-window endpoint ordering fences
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyFrameHistory.java')
          s=p.read_text()
          pattern=r'if\(next\.frameSerial\(\)<=current\.frameSerial\(\)\s*\|\|\s*next\.authorityTick\(\)<current\.authorityTick\(\)\s*\|\|\s*next\.jointSampleTick\(\)<current\.jointSampleTick\(\)\)return false;'
          s,count=re.subn(pattern,'if(false)return false;',s,count=1)
          if count!=1:
              raise SystemExit(f'mutation target count: {count}, expected exactly 1')
          p.write_text(s)
          PY
      - name: mutant must compile
        run: ./gradlew compileJava compileGametestJava --console=plain
      - name: owner holdout must kill same-window ordering mutant
        shell: bash
        run: |
          set +e
          ./gradlew runGameTest --console=plain --rerun-tasks \
            -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s24-frame-order-mutant.xml"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'SURVIVED: same-window frame ordering owner accepted rollback'
            exit 1
          fi
          echo 'KILLED: same-window frame ordering mutant'
      - name: capture ordering mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S24-frame-order-mutant
          path: |
            build/s24-frame-order-mutant.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json
