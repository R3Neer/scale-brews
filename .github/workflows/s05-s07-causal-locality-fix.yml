name: s05-s07-causal-locality-fix

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - .github/workflows/s05-s07-causal-locality-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
          fetch-depth: 0
      - name: patch source
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          rm /tmp/patch.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java src/main/java/io/github/r3neer/scalebrews/collision/internal/MaterialPhysicsRuntime.java
          git commit -m 'fix(collision): stabilize yaw broadphase and conflict locality'
          git push origin HEAD:chatgpt-editing
