name: s05-s07-causal-locality-fix

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - .github/workflows/s05-s07-causal-locality-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
          fetch-depth: 0
      - name: patch source on latest fast-forward head
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin chatgpt-editing
            git checkout --detach origin/chatgpt-editing
            python /tmp/patch.py
            git diff --check
            git add src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java src/main/java/io/github/r3neer/scalebrews/collision/internal/MaterialPhysicsRuntime.java
            git commit -m 'fix(collision): stabilize yaw broadphase and conflict locality'
            if git push origin HEAD:chatgpt-editing; then
              rm /tmp/patch.py
              exit 0
            fi
          done
          rm /tmp/patch.py
          exit 1
