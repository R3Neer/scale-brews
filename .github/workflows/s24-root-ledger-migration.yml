name: s24-root-ledger-migration

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s24-root-ledger-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew

      - name: migrate root provenance ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          movement=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java')
          text=movement.read_text()

          old='import io.github.r3neer.scalebrews.collision.runtime.TransportLedger;'
          new='''import io.github.r3neer.scalebrews.collision.runtime.RootFrame;
          import io.github.r3neer.scalebrews.collision.runtime.RootFrameLedger;
          import io.github.r3neer.scalebrews.collision.runtime.TransportLedger;'''
          assert text.count(old)==1, 'unexpected AnatomyMovement runtime import shape'
          text=text.replace(old,new)

          old='''    /** Rigid root provenance is independent of 20 Hz joint-pose evaluation. */
          public record RootFrame(long sequence,long tick,Vec3 origin,float yaw,float scale,GravityFrame gravity) {
              public RootFrame {
                  if(sequence<0 || tick<0 || origin==null || gravity==null || !Double.isFinite(origin.lengthSqr()) || !Float.isFinite(yaw) || !Float.isFinite(scale) || scale<=0)
                      throw new IllegalArgumentException("Invalid root frame");
              }
          }
          private static final class RootHistory {final ArrayDeque<RootFrame> frames=new ArrayDeque<>();}
          private static final Map<LivingEntity,RootHistory> ROOTS=entityMap();
          '''
          assert text.count(old)==1, 'unexpected nested RootFrame/ROOTS block'
          text=text.replace(old,'')

          text=text.replace('FRAME_SERIALS.remove(support);ROOTS.remove(support);clearSupportContacts(support);removeSpatialEntry(support);',
                            'FRAME_SERIALS.remove(support);RootFrameLedger.clear(support);clearSupportContacts(support);removeSpatialEntry(support);')
          assert 'ROOTS.remove(support)' in text, 'expected invalidateRoot ROOTS removal missing'
          text=text.replace('clearSupportContacts(support);ROOTS.remove(support);removeSpatialEntry(support);',
                            'clearSupportContacts(support);RootFrameLedger.clear(support);removeSpatialEntry(support);')
          assert 'ROOTS.keySet().removeIf(e->e.level()==level);' in text, 'expected deactivate ROOTS cleanup missing'
          text=text.replace('ROOTS.keySet().removeIf(e->e.level()==level);','RootFrameLedger.deactivate(level);')

          start=text.index('    /** Capture before a root move; no pose channels are read or evaluated. */')
          end=text.index('    private static void clearSupportContacts(LivingEntity support) {',start)
          replacement='''    /** Capture before a root move; no pose channels are read or evaluated. */
          public static RootFrame captureRoot(LivingEntity support){return observeRoot(support);}
          /**
           * Record a continuous rigid transform segment after move/setPos/yaw/scale. Sequence and
           * bounded provenance live in RootFrameLedger; this orchestrator owns only the physical
           * reaction to a discontinuity.
           */
          public static synchronized RootFrame observeRoot(LivingEntity support,RootFrame before) {
              var observed=RootFrameLedger.observe(support,support.level().getGameTime(),support.position(),support.yBodyRot,
                  support.getScale(),gravity(support),before);
              if(observed.discontinuity())clearSupportContacts(support);
              return observed.frame();
          }
          /** Cheap deduplicated observation for query/tick paths that bypass Entity.move. */
          public static synchronized RootFrame observeRoot(LivingEntity support) {
              var observed=RootFrameLedger.observe(support,support.level().getGameTime(),support.position(),support.yBodyRot,
                  support.getScale(),gravity(support));
              if(observed.discontinuity())clearSupportContacts(support);
              return observed.frame();
          }
          /** Explicit teleport/dimension/removal lifecycle hook; even a small jump is discontinuous. */
          public static synchronized void invalidateRoot(LivingEntity support) {
              // The support can itself be standing on another support. Clear that anchor too, so a
              // sub-four-block teleport cannot pull it through air on the next carry pass.
              invalidateBody(support,true);
              // Do not reset the binding's serial: a receiver/cursor must distinguish
              // this discontinuity from an old endpoint with the same transform.
              FRAME_SERIALS.computeIfPresent(support,(ignored,old)->new EndpointSerial(old.stamp(),old.endpoint(),old.snapshot(),true));
              clearSupportContacts(support);RootFrameLedger.clear(support);removeSpatialEntry(support);
          }
          /**
           * An accepted unavailable pose keeps its endpoint watermark, but every body
           * anchored to that support must stop immediately. Client lifecycle code uses
           * this without deactivating the whole level or resetting binding serials.
           */
          public static synchronized void invalidateSupport(LivingEntity support) {
              clearSupportContacts(support);removeSpatialEntry(support);
          }
          '''
          text=text[:start]+replacement+text[end:]
          movement.write_text(text)

          # GeometryProvider and every remaining caller now consume the neutral runtime DTO.
          for path in Path('src').rglob('*.java'):
              text=path.read_text()
              if path==movement: continue
              fq='io.github.r3neer.scalebrews.collision.internal.AnatomyMovement.RootFrame'
              if fq in text:
                  text=text.replace(fq,'io.github.r3neer.scalebrews.collision.runtime.RootFrame')
              if 'AnatomyMovement.RootFrame' not in text:
                  path.write_text(text)
                  continue
              text=text.replace('AnatomyMovement.RootFrame','RootFrame')
              if 'package io.github.r3neer.scalebrews.collision.runtime;' not in text and 'import io.github.r3neer.scalebrews.collision.runtime.RootFrame;' not in text:
                  marker=text.index('\n',text.index('package '))+1
                  text=text[:marker]+'\nimport io.github.r3neer.scalebrews.collision.runtime.RootFrame;'+text[marker:]
              path.write_text(text)

          leftovers=[]
          for path in Path('src').rglob('*.java'):
              if 'AnatomyMovement.RootFrame' in path.read_text(): leftovers.append(str(path))
          assert not leftovers, f'legacy nested RootFrame references remain: {leftovers}'
          PY

      - name: compile migrated sources
        run: ./gradlew compileJava compileClientJava compileGametestJava --no-daemon --console=plain

      - name: commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Migration produced no changes.' >&2
            exit 1
          fi
          git config user.name 'Scale Brews CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src
          git commit -m 'refactor(collision): move root provenance into runtime ledger'
          git push origin HEAD:chatgpt-editing
