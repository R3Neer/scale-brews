name: s20-adversarial-pose-channel-atomicity

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s20-adversarial-pose-channel-atomicity.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/api/CollisionAdapters.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/api/spi/PoseChannelAdapter.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AuthorityPoseTracker.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S20AdversarialPoseChannelAtomicityTests.java'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  atomic-external-channels:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S20 adversarial atomicity holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'io.github.r3neer.scalebrews.collision.internal.S20AdversarialPoseChannelAtomicityTests'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run S20 adversarial atomicity holdout
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s20-adversarial-channel-atomicity-junit.xml"
      - name: capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S20-adversarial-pose-channel-atomicity
          path: |
            build/s20-adversarial-channel-atomicity-junit.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json
