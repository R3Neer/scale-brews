name: s16-canonical-catalog-proof
# Implementation verification: keep this lane pinned to the adversarial S16 holdouts.

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s16-canonical-catalog-proof.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/**'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/**'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S16CanonicalCatalogAuthorityTests.java'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  s16-canonical-catalog-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S16 GameTests
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=['io.github.r3neer.scalebrews.collision.internal.S16CanonicalCatalogAuthorityTests']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run S16 proof
        run: ./gradlew runGameTest --console=plain -PscalebrewsGameTestReport="$GITHUB_WORKSPACE/build/s16-junit.xml"
      - name: capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S16-canonical-catalog-proof
          path: |
            build/s16-junit.xml
            build/run/gameTest/logs/
            build/resources/gametest/fabric.mod.json
