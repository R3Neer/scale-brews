name: prerelease

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prerelease:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-prerelease]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: prepare release tree
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f .github/scripts/prerelease-prep.py ]]; then
            python .github/scripts/prerelease-prep.py
            git diff --check

            if ! git diff --quiet; then
              version="$(sed -n 's/^version=//p' gradle.properties)"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -m "release: prepare Scale Brews ${version}"
              git push origin HEAD:main
            fi
          fi

          release_sha="$(git rev-parse HEAD)"
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ -z "$version" || "$version" != *-* ]]; then
            echo "::error::Refusing prerelease for invalid/non-prerelease version: $version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "::error::Tag v${version} already exists"
            exit 1
          fi

          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: build and run server GameTests
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./gradlew build runGameTest --no-daemon --console=plain | tee server-tests.log

      - name: run client GameTests
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xvfb-run -a ./gradlew runClientGameTest --no-daemon --console=plain | tee client-tests.log

      - name: verify release artifacts
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          set -euo pipefail
          regular="build/libs/scalebrews-${VERSION}.jar"
          sources="build/libs/scalebrews-${VERSION}-sources.jar"
          test -f "$regular"
          test -f "$sources"

          python - "$regular" "$VERSION" <<'PY'
          import json
          import sys
          import zipfile

          jar, expected = sys.argv[1:]
          with zipfile.ZipFile(jar) as archive:
              metadata = json.loads(archive.read("fabric.mod.json"))
              if metadata.get("version") != expected:
                  raise SystemExit(
                      f"fabric.mod.json version {metadata.get('version')!r} != {expected!r}"
                  )
              names = archive.namelist()
              leaked = [name for name in names if name.startswith("io/github/r3neer/scalebrews/test/")]
              if leaked:
                  raise SystemExit(f"GameTest classes leaked into production JAR: {leaked[:5]}")
          PY

          server_tests="$(grep -oE 'All [0-9]+ required tests passed' server-tests.log | tail -n 1 | grep -oE '[0-9]+')"
          test -n "$server_tests"
          regular_sha="$(sha256sum "$regular" | awk '{print $1}')"

          echo "regular=${regular}" >> "$GITHUB_OUTPUT"
          echo "sources=${sources}" >> "$GITHUB_OUTPUT"
          echo "server_tests=${server_tests}" >> "$GITHUB_OUTPUT"
          echo "regular_sha=${regular_sha}" >> "$GITHUB_OUTPUT"

      - name: compose prerelease notes
        shell: bash
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          RELEASE_SHA: ${{ steps.prep.outputs.release_sha }}
          SERVER_TESTS: ${{ steps.package.outputs.server_tests }}
          REGULAR_SHA: ${{ steps.package.outputs.regular_sha }}
        run: |
          set -euo pipefail
          python <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          sha = os.environ["RELEASE_SHA"]
          server_tests = os.environ["SERVER_TESTS"]
          regular_sha = os.environ["REGULAR_SHA"]

          props = {}
          for raw in Path("gradle.properties").read_text(encoding="utf-8").splitlines():
              if "=" in raw and not raw.lstrip().startswith("#"):
                  key, value = raw.split("=", 1)
                  props[key.strip()] = value.strip()

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## [{version}]"
          if marker not in changelog:
              raise SystemExit(f"Missing {marker} in CHANGELOG.md")
          section = changelog.split(marker, 1)[1]
          if "\n## " in section:
              section = section.split("\n## ", 1)[0]
          section = section.strip()
          if "\n### " in section:
              intro, changes = section.split("\n### ", 1)
              changes = "### " + changes.strip()
          else:
              intro, changes = section, section
          intro = intro.strip()

          notes = f"""# Scale Brews {version}

          {intro}

          ## Explore first

          The [README](https://github.com/R3Neer/scale-brews#readme) gives a few things to
          try, with real in-game screenshots. Exact recipes, balance, mounts and world rules
          live in the spoiler-rich [player guide](https://github.com/R3Neer/scale-brews/blob/main/docs/GUIDE.md).

          ## Changes since the previous prerelease

          {changes}

          ## Installation

          Use `scalebrews-{version}.jar`, not the sources JAR. Requires Java 25,
          Minecraft {props['minecraft_version']}, Fabric Loader {props['loader_version']}+ and
          Fabric API {props['fabric_api_version']} or newer for Minecraft {props['minecraft_version']}.
          Install on both client and server. Back up worlds before updating.

          ## Validation and limits

          The exact source snapshot `{sha[:7]}` passed build, all **{server_tests} required server GameTests**
          and the full real-client GameTest suite in this prerelease workflow on Ubuntu/Java 25.
          The packaged regular JAR was also checked for the expected mod version and for leaked
          GameTest classes.

          Gravity Changer remains optional and is not bundled in the base release lane. Six-frame
          Tiny Mount behavior is covered by the gravity-frame regression fixtures; absence of a
          gravity provider retains vanilla-DOWN behavior.

          **All-direction anatomical collisions and the shared Clinging physics remain unfinished
          and disabled in normal gameplay.** Prototype code is included, but the existing
          upper-surface living-platform system remains the released behavior.

          Regular JAR SHA-256:
          `{regular_sha}`
          """
          lines = notes.splitlines()
          normalized = []
          for index, line in enumerate(lines):
              if index == 0:
                  normalized.append(line)
              elif line.startswith("          "):
                  normalized.append(line[10:])
              else:
                  normalized.append(line)
          Path("release-notes.md").write_text("\n".join(normalized).rstrip() + "\n", encoding="utf-8")
          PY

      - name: create GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prep.outputs.version }}
          RELEASE_SHA: ${{ steps.prep.outputs.release_sha }}
          REGULAR: ${{ steps.package.outputs.regular }}
          SOURCES: ${{ steps.package.outputs.sources }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            "$REGULAR" \
            "$SOURCES" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Scale Brews ${VERSION}" \
            --notes-file release-notes.md \
            --prerelease

      - name: capture prerelease artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Prerelease-${{ steps.prep.outputs.version }}
          path: |
            build/libs/
            server-tests.log
            client-tests.log
            release-notes.md
            build/run/*/logs/latest.log
            build/run/clientGameTest/screenshots/*.png
          if-no-files-found: warn
