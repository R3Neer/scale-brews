name: s00-reentrancy-oracle-fix

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - .github/workflows/s00-reentrancy-oracle-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
          fetch-depth: 0
      - name: correct reentrancy oracle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/gametest/java/io/github/r3neer/scalebrews/test/S00LifecycleTests.java')
          t=p.read_text()
          old='''            var provider=new Provider(entity,1,0);var nested=new ArrayList<Optional<GeometryProvider.QueryFrame>>();
            AnatomyMovement.register(entity,provider,descriptor(1));
            provider.onEndpoint=()->nested.add(AnatomyMovement.queryFrame(entity));
            AnatomyMovement.queryFrame(entity);
            check(nested.size()==1 && nested.getFirst().isEmpty() && provider.endpointCalls==1,"Reentrant provider query evaluated or published a second endpoint");
'''
          new='''            var provider=new Provider(entity,1,0);var nested=new ArrayList<Optional<GeometryProvider.QueryFrame>>();
            AnatomyMovement.register(entity,provider,descriptor(1));
            int callsAfterRegister=provider.endpointCalls;
            provider.onEndpoint=()->nested.add(AnatomyMovement.queryFrame(entity));
            AnatomyMovement.queryFrame(entity);
            check(nested.size()==1 && nested.getFirst().isEmpty() && provider.endpointCalls==callsAfterRegister+1,
                "Reentrant provider query evaluated or published a second endpoint beyond the outer capture");
'''
          if t.count(old)!=1:
              raise SystemExit(f'expected one S00 reentrancy oracle, found {t.count(old)}')
          p.write_text(t.replace(old,new,1))
          PY
          git diff --check
          git diff -- src/gametest/java/io/github/r3neer/scalebrews/test/S00LifecycleTests.java
      - name: commit test correction
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gametest/java/io/github/r3neer/scalebrews/test/S00LifecycleTests.java
          git commit -m 'test(collision): measure reentrancy after eager registration'
          git push origin HEAD:chatgpt-editing
