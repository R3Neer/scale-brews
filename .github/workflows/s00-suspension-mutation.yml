# Temporary S00 directed mutations for suspension lifecycle identity. Never updates refs.
name: s00-suspension-mutation
on:
  push:
    branches: [chatgpt-editing]
permissions:
  contents: read
jobs:
  suspension-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mutation:
          - suspension-rebind-generation
          - suspension-instance-identity
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: materialize exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/s00-build.py
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
          cache: gradle
      - name: apply and seal directed mutation
        env:
          MUTATION: ${{ matrix.mutation }}
        run: |
          chmod +x ./gradlew
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          name=os.environ['MUTATION']
          p=pathlib.Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java')
          cases={
            'suspension-rebind-generation': (
              'if(generation==null || generation.longValue()!=registrationGeneration(support)) {',
              'if(generation==null) {',
              's00lifecycle_tests_rebind_clears_suspended_pair_quarantine'),
            'suspension-instance-identity': (
              'var generation=suspended.get(support);',
              'var generation=suspended.entrySet().stream().filter(entry->entry.getKey().getUUID().equals(support.getUUID())).map(Map.Entry::getValue).findFirst().orElse(null);',
              's00lifecycle_tests_replacement_support_cannot_inherit_suspended_pair_by_uuid'),
          }
          old,new,oracle=cases[name]
          s=p.read_text(encoding='utf-8'); assert s.count(old)==1,(name,s.count(old))
          candidate=subprocess.check_output(['git','write-tree'],text=True).strip()
          p.write_text(s.replace(old,new),encoding='utf-8')
          subprocess.check_call(['git','add','--',str(p)])
          mutation=subprocess.check_output(['git','write-tree'],text=True).strip(); assert mutation!=candidate
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'s00-suspension-mutation'; d.mkdir()
          (d/'identity.json').write_text(json.dumps({'mutation':name,'candidate_tree':candidate,'mutation_tree':mutation,'oracle':oracle},indent=2))
          print('candidate='+candidate);print('mutation='+mutation)
          PY
      - name: mutation must compile
        run: ./gradlew compileGametestJava --console=plain
      - name: exact lifecycle assertion must kill mutation
        shell: bash
        env:
          MUTATION: ${{ matrix.mutation }}
        run: |
          set +e
          ./gradlew runGameTest --console=plain --rerun-tasks "-PscalebrewsGameTestReport=$RUNNER_TEMP/s00-suspension-mutation/server.xml" > "$RUNNER_TEMP/s00-suspension-mutation/run.log" 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          python3 - <<'PY'
          import json,os,pathlib,subprocess,xml.etree.ElementTree as ET
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'s00-suspension-mutation'; identity=json.loads((d/'identity.json').read_text())
          assert identity['mutation']==os.environ['MUTATION']
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==identity['mutation_tree']
          failed=[t.get('name') for t in ET.parse(d/'server.xml').findall('.//testcase') if t.find('failure') is not None]
          expected='scalebrews-test:'+identity['oracle']; assert expected in failed,failed
          (d/'result.json').write_text(json.dumps({'status':'KILLED','observed_failures':failed,**identity},indent=2))
          print('MUTATION_KILLED '+identity['mutation'])
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S00-suspension-${{ matrix.mutation }}-${{ github.run_id }}
          path: ${{ runner.temp }}/s00-suspension-mutation/
          if-no-files-found: warn
