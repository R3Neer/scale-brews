name: s24-player-iteration-revalidation

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s24-player-iteration-revalidation.yml'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java'
      - 'src/gametest/java/io/github/r3neer/scalebrews/collision/internal/S24AdversarialRuntimePlayerIterationTests.java'
  workflow_dispatch:

jobs:
  unchanged-adversarial-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate unchanged adversarial player-iteration proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=['io.github.r3neer.scalebrews.collision.internal.S24AdversarialRuntimePlayerIterationTests']
          data['entrypoints']['fabric-client-gametest']=[]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run unchanged adversarial player-iteration proof
        run: ./gradlew runGameTest --no-daemon --console=plain
