name: s14-apply-binding-migration

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s14-apply-binding-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout exact trigger snapshot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - name: migrate binding ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java')
          s=p.read_text()
          def sub(pattern,repl,count=1):
              global s
              s2,n=re.subn(pattern,repl,s,count=count,flags=re.S)
              if n!=count: raise SystemExit(f'expected {count}, found {n}: {pattern[:90]}')
              s=s2
          sub(r'    private static final Map<LivingEntity,GeometryProvider> PROVIDERS=entityMap\(\);\n.*?    private static final Map<LivingEntity,Long> QUARANTINED_REGISTRATIONS=entityMap\(\);\n','')
          s=s.replace('PROVIDERS.get(', 'AnatomyBindingState.provider(').replace('DESCRIPTORS.get(', 'AnatomyBindingState.descriptor(').replace('PROVIDERS.containsKey(', 'AnatomyBindingState.hasProvider(').replace('DESCRIPTORS.containsKey(', 'AnatomyBindingState.causal(')
          sub(r'        Map<LivingEntity,GeometryProvider> providers;List<Entity> bodies;\n        synchronized\(PROVIDERS\)\{providers=new IdentityHashMap<>\(PROVIDERS\);\}\n','        Map<LivingEntity,GeometryProvider> providers=AnatomyBindingState.providersSnapshot();List<Entity> bodies;\n')
          sub(r'        Map<LivingEntity,GeometryProvider> providers;\n        synchronized\(PROVIDERS\)\{providers=new IdentityHashMap<>\(PROVIDERS\);\}\n','        Map<LivingEntity,GeometryProvider> providers=AnatomyBindingState.providersSnapshot();\n',2)
          sub(r'    public static synchronized void register\(LivingEntity support,GeometryProvider provider\)\{\n.*?\n    \}\n    /\*\* Runtime causal registration','    public static synchronized void register(LivingEntity support,GeometryProvider provider){\n        if(support==null || provider==null)throw new IllegalArgumentException("Missing geometry registration");\n        requireServerThread(support.level());\n        AnatomyBindingState.rebind(support,provider,null);\n        FRAME_SERIALS.remove(support);ROOTS.remove(support);clearSupportContacts(support);removeSpatialEntry(support);\n        refreshSpatialEntry(support);\n    }\n    /** Runtime causal registration')
          sub(r'    public static synchronized void register\(LivingEntity support,GeometryProvider provider,GeometryProvider\.GeometryIdentityDescriptor descriptor\)\{\n.*?\n    \}\n    private static void requireServerThread','    public static synchronized void register(LivingEntity support,GeometryProvider provider,GeometryProvider.GeometryIdentityDescriptor descriptor){\n        if(support==null || provider==null)throw new IllegalArgumentException("Missing geometry registration");\n        if(descriptor==null)throw new IllegalArgumentException("Missing geometry descriptor");\n        requireServerThread(support.level());\n        AnatomyBindingState.rebind(support,provider,descriptor);\n        FRAME_SERIALS.remove(support);ROOTS.remove(support);clearSupportContacts(support);removeSpatialEntry(support);\n        queryFrame(support);\n    }\n    private static void requireServerThread')
          sub(r'public static synchronized long registrationGeneration\(LivingEntity support\)\{return REGISTRATIONS\.getOrDefault\(support,0L\);\}','public static synchronized long registrationGeneration(LivingEntity support){return AnatomyBindingState.generation(support);}')
          sub(r'    public static synchronized Optional<GeometryProvider\.PublishedFrame> publishedFrame\(LivingEntity support\)\{\n.*?\n    \}\n    /\*\* Current collision frame','    public static synchronized Optional<GeometryProvider.PublishedFrame> publishedFrame(LivingEntity support){\n        requireServerThread(support.level());\n        var binding=AnatomyBindingState.beginCapture(support);\n        if(binding==null)return Optional.empty();\n        try {\n            var descriptor=binding.descriptor();var provider=binding.provider();\n            var capture=new CaptureStamp(provider,descriptor,binding.generation(),transportGeneration(support));\n            var endpoint=causalEndpoint(support,provider,capture).orElse(null);\n            if(endpoint==null || !captureCurrent(support,capture))return Optional.empty();\n            var identity=new GeometryProvider.GeometryIdentity(support.level().dimension(),support.getUUID(),support.getId(),descriptor.epoch(),descriptor.revision(),\n                descriptor.model(),descriptor.poseProvider(),descriptor.bindingGeneration(),capture.registration());\n            return Optional.of(new GeometryProvider.PublishedFrame(identity,endpoint));\n        } finally {AnatomyBindingState.endCapture(support);}\n    }\n    /** Current collision frame')
          sub(r'    private static boolean captureBindingCurrent\(LivingEntity support,CaptureStamp capture\) \{\n.*?\n    \}\n    private static boolean captureCurrent','    private static boolean captureBindingCurrent(LivingEntity support,CaptureStamp capture) {\n        var binding=AnatomyBindingState.snapshot(support);\n        return binding!=null && binding.provider()==capture.provider() && Objects.equals(binding.descriptor(),capture.descriptor())\n            && binding.generation()==capture.registration();\n    }\n    private static boolean captureCurrent')
          sub(r'if\(old==null\)QUARANTINED_REGISTRATIONS\.put\(support,registrationGeneration\(support\)\);','if(old==null)AnatomyBindingState.quarantineCurrent(support);')
          sub(r'if\(Objects\.equals\(QUARANTINED_REGISTRATIONS\.get\(support\),registrationGeneration\(support\)\)\)return Optional\.empty\(\);','if(AnatomyBindingState.quarantined(support))return Optional.empty();')
          sub(r'        ACTIVE\.remove\(level\);PROVIDERS\.keySet\(\)\.removeIf\(e->e\.level\(\)==level\);\n        // Local registration generation is a weak identity watermark and must not rewind on level lifecycle\.\n        DESCRIPTORS\.keySet\(\)\.removeIf\(e->e\.level\(\)==level\);\n','        ACTIVE.remove(level);AnatomyBindingState.deactivate(level);\n        // Local registration generation is a weak identity watermark and must not rewind on level lifecycle.\n')
          forbidden=['PROVIDERS','REGISTRATIONS','DESCRIPTORS','CAPTURING','QUARANTINED_REGISTRATIONS']
          left=[x for x in forbidden if x in s]
          if left: raise SystemExit(f'forbidden binding owner references remain: {left}')
          p.write_text(s)
          PY
          git diff --check
      - name: build migrated tree
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: commit and push migrated source
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java
          git commit -m 'refactor(s14): migrate live binding ownership'
          git push origin HEAD:chatgpt-editing
