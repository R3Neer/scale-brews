name: s16-live-binding-migration

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s16-fixture-migration.yml'

permissions:
  contents: write

jobs:
  wire-live-binding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
      - name: apply exact S16 patch
        run: python3 .github/scripts/s16_live_binding_patch.py
      - name: commit live binding migration
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code --quiet && { echo 'No binding changes produced'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyMovement.java \
                  src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java \
                  src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java \
                  src/main/java/io/github/r3neer/scalebrews/platform/Platforms.java \
                  src/gametest/java/io/github/r3neer/scalebrews/test/AnatomyGeometryTests.java
          git commit -m 'fix(s16): route policy through live canonical binding'
          git push origin HEAD:chatgpt-editing
