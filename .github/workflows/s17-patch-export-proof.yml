name: s17-patch-export-proof
on:
  push:
    branches: [chatgpt-editing]
    paths: ['.github/workflows/s17-patch-export-proof.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-editing
      - run: python3 .github/scripts/s17_patch_export_proof.py
      - run: |
          set -euo pipefail
          git rm .github/workflows/s17-patch-export-proof.yml .github/scripts/s17_patch_export_proof.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gametest/java/io/github/r3neer/scalebrews/test/AnatomyExportProof.java
          git commit -m 'test(s17): route vanilla exports through model part engine'
          git push origin HEAD:chatgpt-editing
