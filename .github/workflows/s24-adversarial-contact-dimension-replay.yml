name: s24-adversarial-contact-dimension-replay

on:
  push:
    branches: [chatgpt-editing]
    paths:
      - '.github/workflows/s24-adversarial-contact-dimension-replay.yml'
      - 'src/gametest/java/io/github/r3neer/scalebrews/test/S24ContactDimensionReplayClientProof.java'
      - 'src/client/java/io/github/r3neer/scalebrews/client/collision/network/AnatomyClientNetworking.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyContactInbox.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyContactOrdering.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/AnatomyRuntime.java'
      - 'src/main/java/io/github/r3neer/scalebrews/collision/internal/TrackingReplayFence.java'
      - 'src/gametest/resources/fabric.mod.json'
  workflow_dispatch:

jobs:
  contact-dimension-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: isolate S24 contact dimension replay holdout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[]
          data['entrypoints']['fabric-client-gametest']=['io.github.r3neer.scalebrews.test.S24ContactDimensionReplayClientProof']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: run contact replay barrier holdout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/s24-contact-dimension-replay
          xvfb-run -a ./gradlew runClientGameTest --no-daemon --console=plain \
            2>&1 | tee build/s24-contact-dimension-replay/client.log
          if ! grep -R -F 'S24_CONTACT_DIMENSION_REPLAY PASS' \
              build/run/clientGameTest/logs build/s24-contact-dimension-replay/client.log >/dev/null 2>&1; then
            echo 'S24 contact dimension replay proof did not emit its causal PASS marker.' >&2
            exit 1
          fi
      - name: capture contact replay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S24-adversarial-contact-dimension-replay
          path: |
            build/s24-contact-dimension-replay/client.log
            build/run/clientGameTest/logs/
            build/resources/gametest/fabric.mod.json
