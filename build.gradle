plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Machine-local settings also apply to ordinary IntelliJ Gradle actions.
// Command-line/user Gradle properties take precedence; CI retains its default build/.
def localBuildProperties = new Properties()
def localBuildConfig = file("gradle-local.properties")
if (localBuildConfig.exists()) {
	localBuildConfig.withInputStream { localBuildProperties.load(it) }
}
def localBuildDir = providers.gradleProperty("scalebrewsBuildDir")
	.orElse(localBuildProperties.getProperty("scalebrewsBuildDir", "build"))
layout.buildDirectory = file(localBuildDir.get())

repositories {
	exclusiveContent {
		forRepository {
			mavenCentral()
		}
		filter {
			includeGroup("org.vineflower")
		}
	}

	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"scalebrews" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "scalebrews-test"
		enableGameTests = true
		enableClientGameTests = true
		clearRunDirectory = false
		eula = true
	}
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional external mods are discovered by Fabric below, not flattened onto Java's classpath.
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ['-Xlint:deprecation']
}

tasks.withType(JavaExec).configureEach {
	if (providers.gradleProperty('scalebrewsAnatomyCatalog').isPresent())
		systemProperty 'scalebrews.anatomyCatalog', file(providers.gradleProperty('scalebrewsAnatomyCatalog').get()).absolutePath
	systemProperty 'scalebrews.platformSoak', providers.gradleProperty('scalebrewsPlatformSoak').orElse('false').get()
	// Opt-in GameTest evidence.  This is never set for normal gameplay runs.
	if (name in ['runGameTest', 'runClientGameTest'] && providers.gradleProperty('scalebrewsGameTestReport').isPresent()) {
		systemProperty 'fabric-api.gametest.report-file', file(providers.gradleProperty('scalebrewsGameTestReport').get()).absolutePath
	}
	if (name in ['runGameTest', 'runClientGameTest'] && providers.gradleProperty('scalebrewsCompatMods').isPresent()) {
		systemProperty 'fabric.addMods', file(providers.gradleProperty('scalebrewsCompatMods').get()).absolutePath
	}
}

tasks.named('processGametestResources') {
	def anatomyOnly = providers.gradleProperty('scalebrewsAnatomyProof').orElse('false')
	def preparedAnatomySuite = providers.gradleProperty('scalebrewsAnatomyPreparedSuite').orElse('false')
	def trackerLifecycleSuite = providers.gradleProperty('scalebrewsAnatomyTrackerLifecycleSuite').orElse('false')
	def hostIndependenceProof = providers.gradleProperty('scalebrewsAnatomyHostIndependenceProof').orElse('false')
	def predictionBaselineProof = providers.gradleProperty('scalebrewsAnatomyPredictionBaselineProof').orElse('false')
	def readmeCapture = providers.gradleProperty('scalebrewsReadmeCapture').orElse('false')
	inputs.property('anatomyOnly', anatomyOnly)
	inputs.property('preparedAnatomySuite', preparedAnatomySuite)
	inputs.property('trackerLifecycleSuite', trackerLifecycleSuite)
	inputs.property('hostIndependenceProof', hostIndependenceProof)
	inputs.property('predictionBaselineProof', predictionBaselineProof)
	inputs.property('readmeCapture', readmeCapture)
	doLast {
		if (hostIndependenceProof.get().toBoolean() && (anatomyOnly.get().toBoolean() || readmeCapture.get().toBoolean()
				|| preparedAnatomySuite.get().toBoolean() || trackerLifecycleSuite.get().toBoolean() || predictionBaselineProof.get().toBoolean()))
			throw new GradleException('Host-independence client proof is mutually exclusive with the other client proof selectors.')
		if (predictionBaselineProof.get().toBoolean() && (anatomyOnly.get().toBoolean() || readmeCapture.get().toBoolean()
				|| preparedAnatomySuite.get().toBoolean() || trackerLifecycleSuite.get().toBoolean()))
			throw new GradleException('Prediction-baseline client proof is mutually exclusive with the other client proof selectors.')
		if (anatomyOnly.get().toBoolean() || readmeCapture.get().toBoolean()) {
			def manifest = new File(destinationDir, 'fabric.mod.json')
			def metadata = new groovy.json.JsonSlurper().parse(manifest)
			metadata.entrypoints['fabric-client-gametest'] = [readmeCapture.get().toBoolean() ? 'io.github.r3neer.scalebrews.test.ReadmeCapture' : 'io.github.r3neer.scalebrews.test.AnatomyExportProof']
			manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
		}
		if (hostIndependenceProof.get().toBoolean()) {
			def hostManifest = new File(destinationDir, 'fabric.mod.json')
			def hostMetadata = new groovy.json.JsonSlurper().parse(hostManifest)
			hostMetadata.entrypoints['fabric-client-gametest'] = ['io.github.r3neer.scalebrews.test.AnatomyHostCatalogIndependenceProof']
			hostManifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(hostMetadata))
		}
		if (predictionBaselineProof.get().toBoolean()) {
			def baselineManifest = new File(destinationDir, 'fabric.mod.json')
			def baselineMetadata = new groovy.json.JsonSlurper().parse(baselineManifest)
			baselineMetadata.entrypoints['fabric-client-gametest'] = ['io.github.r3neer.scalebrews.test.AnatomyPredictionBaselineProof']
			baselineManifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(baselineMetadata))
		}
		if (preparedAnatomySuite.get().toBoolean()) {
			// Fabric 26.2 has no batch before/after hook.  The proof therefore owns
			// one real runtime lifetime and must not run beside raw-core GameTests.
			def preparedManifest = new File(destinationDir, 'fabric.mod.json')
			def preparedMetadata = new groovy.json.JsonSlurper().parse(preparedManifest)
			preparedMetadata.entrypoints['fabric-gametest'] = ['io.github.r3neer.scalebrews.test.AnatomyPreparedIntegrationProof']
			preparedManifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(preparedMetadata))
		}
		if (trackerLifecycleSuite.get().toBoolean()) {
			if (preparedAnatomySuite.get().toBoolean()) throw new GradleException('Prepared and tracker lifecycle suites are mutually exclusive.')
			def lifecycleManifest = new File(destinationDir, 'fabric.mod.json')
			def lifecycleMetadata = new groovy.json.JsonSlurper().parse(lifecycleManifest)
			lifecycleMetadata.entrypoints['fabric-gametest'] = ['io.github.r3neer.scalebrews.test.AnatomyTrackerLifecycleProof']
			lifecycleManifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(lifecycleMetadata))
		}
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
